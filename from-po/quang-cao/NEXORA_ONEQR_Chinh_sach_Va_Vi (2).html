phiên bắt đầu từ OneQR của doanh nghiệp, kể cả quảng cáo trả phí. Trường hợp phân loại không chắc chắn cần được xem xét trước khi phân phối.',secondaryPolicy:'Ngành chính và ngành phụ đã xác nhận tham gia quy tắc chặn. Nhóm ngành liên quan, ngoại lệ và cơ chế báo sai cần được quản trị rõ.',draftTag:'Dự thảo · cần phê duyệt',policyTitle:'Điều khoản OneQR, quảng cáo và chia doanh thu',p1:'1. Đồng ý & tham gia: Khi tích đồng ý và kích hoạt OneQR theo gói hiện tại, doanh nghiệp chấp nhận các điều khoản, quảng cáo tại các vị trí được công bố và tự tham gia chương trình tích lũy. Lưu phiên bản điều khoản, thời điểm, tài khoản và doanh nghiệp đồng ý.',p2:'2. Vị trí & ngành: Quảng cáo có thể xuất hiện trong Deal Nearby, Search Deals và Khám phá. Doanh nghiệp cung cấp ngành chính và các ngành phụ liên quan. Hệ thống chặn quảng cáo bên thứ ba cùng ngành trong phiên OneQR của doanh nghiệp; ngành chưa xác định được xem xét trước khi phân phối. Có kênh báo phân loại sai.',p3:'3. Thu nhập: Chỉ các hành động quảng cáo đủ điều kiện theo chiến dịch mới được cộng điểm. Quét QR, xem hoặc mở danh sách không tự tạo điểm. Điểm có thể chờ duyệt hoặc điều chỉnh do trùng lặp, gian lận, hoàn tiền hay sai sót; cung cấp lý do và kênh khiếu nại.',p4:'4. Quy đổi: 100 ONEQR Points = 1 credit = $1 giá trị quy đổi. Mức thưởng cho từng sự kiện, thời gian đối soát và phí chưa được chốt và phải công bố trước khi áp dụng.',p5:'5. Dùng & chuyển: Điểm đã duyệt trong ví thu nhập có thể đổi sang credit hoặc chuyển, tối thiểu 1.000 điểm mỗi lần chuyển. Người nhận nhận credit trong ví sử dụng, không rút tiền và chưa chuyển tiếp. Điểm đã dùng được trừ khỏi số dư khả dụng.',p6:'6. Rút tiền: Từ 10.000 điểm đã duyệt chưa dùng = $100. Người nhận hoàn tất thông tin người nhận, thuế, xác minh và phương thức thanh toán theo yêu cầu. Phí, thời gian xử lý, phương thức và cách xử lý thất bại cần công bố trước.',p7:'7. Quản lý: Lưu lịch sử, mã giao dịch, trạng thái và cơ chế chống xử lý trùng. Công bố cách xử lý thay đổi chính sách, khiếu nại, số dư tồn, tài khoản đóng và trường hợp hoàn trả.',legal:'Đây là dự thảo sản phẩm, không phải điều khoản pháp lý cuối cùng. Cần CPA, cố vấn và đối tác thanh toán rà soát trước khi triển khai, kể cả thời điểm thu thập thông tin thuế và cơ chế chuyển credit.',chooseGroup:'Chọn nhóm ngành',chooseIndustry:'Chọn ngành chính',notChosen:'Chưa chọn',statusOff:'Chưa kích hoạt · minh họa',statusOn:'Đã kích hoạt · minh họa',errRecipient:'Nhập DEMO để chọn người nhận mẫu.',errAmount:'Nhập ít nhất 1.000 điểm nguyên và không vượt số dư.',done:'Đã chuyển trong bản mô phỏng. Không có giao dịch thật.',points:'điểm',credits:'credit',equiv:'giá trị sử dụng'};

ilable balance.',p6:'6. Payout: At least 10,000 approved, unused points = $100. The recipient completes payee, tax, verification and payment details as required. Fees, timing, methods and failure handling must be disclosed before launch.',p7:'7. Administration: Maintain transaction IDs, history, status and duplicate-processing controls. Publish rules for policy changes, complaints, outstanding balances, account closure and refunds.',legal:'This is a product draft, not final legal terms. Obtain CPA, legal and payment-provider review before launch, including the timing of tax information and the transfer and use of credit.',chooseGroup:'Choose an industry group',chooseIndustry:'Choose a primary industry',notChosen:'Not selected',statusOff:'Not activated · demo',statusOn:'Activated · demo',errRecipient:'Enter DEMO to select the sample recipient.',errAmount:'Enter a whole number of at least 1,000 points, within the available balance.',done:'Demo transfer completed. No real transaction occurred.',points:'points',credits:'credits',equiv:'spending value'};

points.',ledgerTitle:'History & status',ledgerText:'Record source, program, event, points, status, time and adjustment reason; each point can be used only once.',sourceRules:'Developers must configure conversion, transfer and withdrawal rights by program. Do not automatically allow referral point withdrawals until approved.',ownCredits:'Credits converted from own points · sample',ownCreditsHelp:'Spending only; excluded from withdrawable balance',testPayout:'Test payout request using sample balance',convertAmount:'Points to convert (demo uses multiples of 100)',convertConfirm:'Confirm demo conversion',errConvert:'Enter a positive multiple of 100 within the approved balance.',convertDone:'Converted in the demo; credits were added to the sample spending wallet.',payoutLow:'At least 10,000 approved unused points are required.',payoutDone:'Sample balance qualifies. Next: recipient, tax and verification details; no real request was submitted.'});let lang='vi',activated=false,balance=12000,receipt=0,ownCredit=0;function t(k){return (lang==='vi'?vi:en)[k]}function show(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-i]').forEach(x=>x.textContent=t(x.dataset.i));document.querySelectorAll('[data-ph]').forEach(x=>x.placeholder=t(x.dataset.ph));renderGroups();updateIndustry();document.getElementById('status').textContent=t(activated?'statusOn':'statusOff');preview()}function renderGroups(){let g=document.getElementById('group'),v=g.value;g.innerHTML='';g.add(new Option(t('chooseGroup'),''));categories.forEach(c=>g.add(new Option(c[lang==='vi'?1:2],c[0])));g.value=v;renderIndustries()}function renderIndustries(){let g=document.getElementById('group').value,i=document.getElementById('industry'),secondary=document.getElementById('secondary'),prev=i.value,selected=Array.from(secondary.selectedOptions).map(x=>x.value);i.innerHTML='';i.add(new Option(t('chooseIndustry'),''));categories.filter(c=>c[0]===g).forEach(c=>c[3].forEach(a=>i.add(new Option(a[lang==='vi'?1:2],a[0]))));i.value=prev;secondary.innerHTML='';categories.forEach(c=>{let optgroup=document.createElement('optgroup');optgroup.label=c[lang==='vi'?1:2];c[3].forEach(a=>{if(a[0]!=='other'){let o=new Option(a[lang==='vi'?1:2],a[0]);o.selected=selected.includes(a[0]);optgroup.appendChild(o)}});secondary.appendChild(optgroup)});updateIndustry()}function updateIndustry(){let i=document.getElementById('industry'),other=i.value==='other';document.getElementById('customBlock').classList.toggle('hide',!other);let name=i.selectedOptions[0]?.text||t('notChosen');if(!i.value)name=t('notChosen');document.getElementById('chosen').textContent=name;document.getElementById('adIndustry').textContent=name;canActivate()}function canActivate(){let i=document.getElementById('industry').value,c=document.getElementById('custom').value.trim();document.getElementById('activate').disabled=activated||!(i&&document.getElementById('agree').checked&&(i!=='other'||c))}function activate(){activated=true;document.getElementById('status').textContent=t('statusOn');document.getElementById('activate').disabled=true}function preview(){let a=Number(document.getElementById('amount').value)||0;document.getElementById('preview').textContent=a.toLocaleString(lang==='vi'?'vi-VN':'en-US')+' '+t('points')+' → '+(a/100).toLocaleString(lang==='vi'?'vi-VN':'en-US')+' '+t('credits')+' · $'+(a/100).toFixed(2)+' '+t('equiv');document.getElementById('review').classList.add('hide')}function review(){let a=Number(document.getElementById('amount').value),e=document.getElementById('error');document.getElementById('review').classList.add('hide');if(document.getElementById('recipient').value.trim()!=='DEMO'){e.textContent=t('errRecipient');return}if(!Number.isInteger(a)||a<1000||a>balance){e.textContent=t('errAmount');return}e.textContent='';document.getElementById('reviewAmount').textContent=document.getElementById('preview').textContent;document.getElementById('review').classList.remove('hide')}function confirmTransfer(){let a=Number(document.getElementById('amount').value);if(!Number.isInteger(a)||a<1000||a>balance||document.getElementById('recipient').value.trim()!=='DEMO')return;balance-=a;receipt+=a/100;document.querySelectorAll('.balance').forEach(x=>x.textContent=balance.toLocaleString(lang==='vi'?'vi-VN':'en-US'));document.getElementById('received').textContent=receipt.toLocaleString(lang==='vi'?'vi-VN':'en-US');document.getElementById('review').classList.add('hide');document.getElementById('result').textContent=t('done')}function refreshBalance(){document.querySelectorAll('.balance').forEach(x=>x.textContent=balance.toLocaleString(lang==='vi'?'vi-VN':'en-US'));document.getElementById('ownCredits').textContent=ownCredit.toLocaleString(lang==='vi'?'vi-VN':'en-US')}function convertPoints(){let a=Number(document.getElementById('convertAmount').value);let r=document.getElementById('convertResult');if(!Number.isInteger(a)||a<=0||a%100!==0||a>balance){r.textContent=t('errConvert');r.className='error';return}balance-=a;ownCredit+=a/100;refreshBalance();r.textContent=t('convertDone');r.className='ok'}function requestPayout(){document.getElementById('payoutResult').textContent=t(balance>=10000?'payoutDone':'payoutLow')}function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'vi',autoDisplay:false},'google_translate_element')}setLang('vi');</script><script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script></body></html>
