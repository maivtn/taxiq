<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA POS — Checkout có ưu đãi</title>
<style>
:root{--ind:#4F46E5;--ink:#0F172A;--mute:#64748B;--line:#E2E8F0;--bg:#F4F6FB;--amb:#B45309;--ambb:#FFFBEB;--ambl:#FDE68A;--ok:#047857;--okb:#ECFDF5;--red:#DC2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:30}
.hw{max-width:1240px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;display:grid;place-items:center;font-weight:900}
h1{font-size:17px;margin:0}header small{display:block;color:var(--mute);font-size:12px}.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#F8FAFC}.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--mute)}.seg button.on{background:var(--ind);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--ink)}.btn.pri{background:var(--ind);border-color:var(--ind);color:#fff}.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.amb{background:var(--ambb);border-color:var(--ambl);color:var(--amb);font-size:12px;padding:5px 10px;border-radius:8px}
main{max-width:1240px;margin:0 auto;padding:16px;display:grid;gap:14px}
.banner{border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.5}.banner.cur{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}.banner.new{background:var(--okb);border:1px solid #A7F3D0;color:#065F46}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cust{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#F8FAFC;flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:50%;background:#E0E7FF;color:var(--ind);display:grid;place-items:center;font-weight:900}
.cust b{display:block}.cust span{color:var(--mute);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#EEF2FF;color:#4338CA}.pill.g{background:var(--okb);color:var(--ok)}.pill.a{background:var(--ambb);color:var(--amb)}.pill.r{background:#FEF2F2;color:var(--red)}
.svc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}.svc small{color:var(--mute)}.svc .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.svc s{color:var(--mute);font-weight:500;margin-right:6px}
.tot{margin-top:10px;display:grid;gap:6px;font-variant-numeric:tabular-nums}.tot div{display:flex;justify-content:space-between}.tot .d{color:var(--red)}.tot .T{font-size:20px;font-weight:900;border-top:1px solid var(--line);padding-top:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.offer{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:#fff;text-align:left;width:100%}
.offer.on{border-color:var(--ok);background:var(--okb)}.offer.no{opacity:.55}
.offer .th{width:54px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:12px}
.offer b{display:block;font-size:13px}.offer small{color:var(--mute);font-size:11.5px;display:block;line-height:1.35}
.list{display:grid;gap:8px}
.scan{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.scan input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
.note{font-size:12px;color:var(--mute);line-height:1.5;margin:8px 0 0}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin:12px 0 6px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.st{border:1px solid var(--line);border-radius:12px;padding:10px;background:#F8FAFC}.st i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ind);color:#fff;font-size:11px;font-weight:900;margin-bottom:6px}.st b{display:block;font-size:13px;margin-bottom:3px}.st span{font-size:12px;color:var(--mute);line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}.tw{overflow-x:auto}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#FFFEF8;border:1px dashed #D6D3D1;border-radius:10px;padding:12px;line-height:1.55;white-space:pre-wrap;max-width:320px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:40;padding:16px}.modal[hidden]{display:none}
.mb{background:#fff;border-radius:16px;width:min(460px,100%);max-height:88vh;overflow:auto;padding:18px}
.mb h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:700}.chips button.on{border-color:var(--ind);color:var(--ind);background:#EEF2FF}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
.spot{outline:3px solid #6366F1;outline-offset:3px;border-radius:14px;transition:outline .2s}
.stour{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(580px,calc(100% - 32px));background:#111827;color:#fff;border-radius:16px;padding:12px 14px;z-index:50;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}.stour[hidden]{display:none}
.stour .hd{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:900;letter-spacing:.08em;color:#C4B5FD}.stour .hd button{background:#1F2937;border:0;color:#fff;border-radius:8px;width:28px;height:26px}
#tVi{font-size:14px;margin-top:6px;line-height:1.45}#tEn{font-size:12px;color:#9CA3AF;margin-top:3px}.bar{height:3px;background:#374151;border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#A78BFA}
.wn ul{padding-left:18px;line-height:1.55;font-size:13px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.flow{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<header><div class="hw"><div class="lg">N</div><div><h1 id="hT"></h1><small id="hS"></small></div><div class="sp"></div>
<div class="seg" id="mode"><button data-m="cur"></button><button data-m="new"></button></div>
<div class="seg" id="lang"><button data-l="vi">VI</button><button data-l="en">EN</button></div>
<button class="btn sm" id="tourBtn">✦ AI Tour</button></div></header>
<main id="main"></main>
<div class="modal" id="md" hidden><div class="mb" id="mdb"></div></div>
<div class="modal wn" id="wn" hidden><div class="mb" id="wnb"></div></div>
<div class="toast" id="toast"></div>
<div class="stour" id="tb" hidden><div class="hd">✦ AI SMART TOUR <span id="tS"></span><span class="sp"></span><button id="tP">⏸</button><button id="tN">⏭</button><button id="tX">✕</button></div><div id="tVi"></div><div id="tEn"></div><div class="bar"><i id="tBar"></i></div></div>
<script>
let LANG='vi';const L=(v,e)=>LANG==='vi'?v:e;const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const money=n=>'$'+n.toFixed(2);
const SV=[['Classic Pedicure','Kayla',40],['Gel Manicure','Kayla',35],['Special Shape','Mai',5]];
const SUB=SV.reduce((a,s)=>a+s[2],0);
// Chương trình đang chạy trong POS (theo khung ngày/giờ) — giống dữ liệu Promotions hiện tại
const PROMOS=[{id:'p1',n:'Pedicure ngày thường',en:'Weekday pedicure',t:'pct',v:15,win:'T3–T5 · 10:00–14:00',ok:true,c:'#D97706'},{id:'p2',n:'Thứ Hai thư giãn',en:'Relax Monday',t:'amt',v:10,win:'T2 cả ngày',ok:false,c:'#0EA5E9'}];
// Ưu đãi gắn với khách (đề xuất)
const WAL=[{id:'c1',src:'NEXORA Deals',n:'Giảm $15 dịch vụ Gel',en:'$15 off Gel services',t:'amt',v:15,scope:'Gel Manicure',exp:'hết hạn 31/10',ok:true,c:'#7C3AED',how:L('Khách bấm “Lấy ưu đãi” trên NEXORA Deals','Claimed on NEXORA Deals')},
{id:'c2',src:'OneQR',n:'Khách mới −20%',en:'New client −20%',t:'pct',v:20,scope:'all',exp:'chỉ lần đầu',ok:false,why:['Không áp: khách đã có 3 lần ghé','Not eligible: 3 prior visits'],c:'#DB2777'},
{id:'c3',src:'Tích điểm',n:'Đổi 500 điểm = $5',en:'Redeem 500 pts = $5',t:'amt',v:5,scope:'all',exp:'620 điểm',ok:true,c:'#059669'}];
const GC={code:'GC-4821',bal:50};
const S={mode:'new',found:false,pick:null,promo:null,manual:null,gc:false,tip:0,md:null,code:''};
function discOf(o){if(!o)return 0;const base=o.scope&&o.scope!=='all'?(SV.find(s=>s[0]===o.scope)||[0,0,0])[2]:SUB;return o.t==='pct'?Math.round(base*o.v)/100:Math.min(o.v,base)}
function best(){return [...WAL,...PROMOS].filter(o=>o.ok).sort((a,b)=>discOf(b)-discOf(a))[0]}
function curApplied(){if(S.mode==='cur')return S.promo?PROMOS.find(p=>p.id===S.promo):S.manual;return S.pick?WAL.find(w=>w.id===S.pick)||PROMOS.find(p=>p.id===S.pick):S.manual}
function totals(){const a=curApplied();const d=a?discOf(a):0;const after=SUB-d;const tax=0;const pre=after+tax+S.tip;const gc=S.gc?Math.min(GC.bal,pre):0;return{d,after,tax,pre,gc,due:pre-gc,a}}
function draw(){document.documentElement.lang=LANG;$('#hT').textContent=L('POS Checkout — coupon & giảm giá','POS Checkout — coupons & discounts');$('#hS').textContent=L('Front Desk › Checkout Customer · Nexora Touch Nail Spa','Front Desk › Checkout Customer');
$$('#mode button').forEach(b=>{b.textContent=b.dataset.m==='cur'?L('Đang có trên POS','Live today'):L('Đề xuất','Proposed');b.classList.toggle('on',b.dataset.m===S.mode)});
$$('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
const T=totals();
$('#main').innerHTML=(S.mode==='cur'?`<div class="banner cur" id="bnr">${L('<b>Đang chạy trên nexoratouch.com (đã kiểm tra 30/09):</b> hệ thống <b>không tự áp</b>. Thu ngân bấm “Discount all” → trong hộp có mục “Offers this visit qualifies for” (ưu đãi hợp khung giờ) → bấm 1 thẻ. Không có ô nhập mã coupon, không quét QR coupon, không nhận biết coupon riêng của khách. Gift card chỉ là nhãn phương thức thanh toán.','<b>Live on nexoratouch.com (checked 09/30):</b> nothing auto-applies. Cashier taps “Discount all” → “Offers this visit qualifies for” → taps one. No coupon code, no QR scan, no customer-owned coupons. Gift card is only a payment label.')}</div>`
:`<div class="banner new" id="bnr">${L('<b>Đề xuất:</b> nhận ra khách (số điện thoại, QR check-in, app) → hệ thống tự gom mọi ưu đãi của khách + chương trình đang chạy → <b>tự áp cái có lợi nhất</b> và báo cho thu ngân; thu ngân chỉ đổi hoặc bỏ. Quét/nhập mã khi khách đưa coupon giấy hay màn hình điện thoại.','<b>Proposed:</b> identify the client → gather their coupons + running programs → <b>auto-apply the best one</b>; cashier can switch or remove. Scan/enter a code for paper or on-screen coupons.')}</div>`)+
`<div class="grid"><div class="card" id="tick"><h2>🧾 ${L('Ticket #6 · đang thanh toán','Ticket #6 · checking out')} <span class="pill">${L('Hoàn tất dịch vụ','Service done')}</span></h2>
<div class="cust" id="custBox"><div class="av">LN</div><div style="flex:1;min-width:0"><b>Linda Nguyen</b><span>+1 (832) 555-0142 · ${L('4 lần ghé','4 visits')}</span></div>${S.mode==='new'?(S.found?`<span class="pill g">✓ ${L('Đã nhận ra khách','Client recognized')}</span>`:`<button class="btn sm" id="findBtn">🔎 ${L('Nhận ra khách','Identify client')}</button>`):`<span class="pill a">${L('Chỉ tên + SĐT','Name + phone only')}</span>`}</div>
${SV.map(s=>{const a=T.a;const line=a&&a.scope===s[0];const ld=line?discOf(a):0;return `<div class="svc"><div><b>${s[0]}</b><br><small>${s[1]}</small>${line?`<br><span class="pill g">🏷️ ${esc(nm(a))}</span>`:''}</div><div class="p">${line?`<s>${money(s[2])}</s>${money(s[2]-ld)}`:money(s[2])}</div></div>`}).join('')}
<div class="acts"><button class="btn amb" id="discBtn">％ ${L('Discount all','Discount all')}</button><button class="btn sm" id="tipBtn">＋ ${L('Tip','Tip')} ${S.tip?money(S.tip):''}</button></div>
<div class="tot" id="totBox"><div><span>${L('Dịch vụ','Services')}</span><span>${money(SUB)}</span></div>
${T.d?`<div class="d"><span>${T.a.scope&&T.a.scope!=='all'?L('Giảm theo dịch vụ','Line discount'):L('Giảm cả bill','Order discount')} · ${esc(nm(T.a))}</span><span>−${money(T.d)}</span></div>`:''}
<div><span>${L('Thuế','Sales tax')}</span><span>${money(T.tax)}</span></div><div><span>Tip</span><span>${money(S.tip)}</span></div>
${T.gc?`<div class="d"><span>🎁 Gift card ${GC.code}</span><span>−${money(T.gc)}</span></div>`:''}
<div class="T"><span>${L('Khách trả','Amount due')}</span><span>${money(T.due)}</span></div></div>
<div class="acts"><button class="btn pri" id="payBtn">${L('Thanh toán','Take payment')} ${money(T.due)}</button></div></div>
<div style="display:grid;gap:14px;min-width:0">${S.mode==='new'?walletCard():curSide()}<div class="card" id="rcpt"><h2>🧾 ${L('Hoá đơn in ra','Printed receipt')}</h2><div class="rc">${receipt(T)}</div><p class="note">${S.mode==='cur'?L('Hoá đơn hiện tại chỉ có Services · Sales tax · Tip · TOTAL — không có dòng giảm giá, khách không thấy mình được giảm.','Current receipt shows only Services · Tax · Tip · TOTAL — no discount line.'):L('Đề xuất: in tên ưu đãi + số tiền giảm + “Bạn đã tiết kiệm”. Khách thấy giá trị, tiệm đo được hiệu quả từng chương trình.','Proposed: print offer name, amount and “You saved”.')}</p></div></div></div>
${howCard()}`;bind()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=o=>o.manual?(L('Giảm tay','Manual')+' '+(o.t==='pct'?o.v+'%':money(o.v))):(LANG==='vi'?o.n:o.en||o.n);
function rate(o){return o.t==='pct'?o.v+'%':money(o.v)}
function curSide(){return `<div class="card" id="side"><h2>ℹ️ ${L('Hiện tại hệ thống biết thế nào?','How the live system decides')}</h2>
<p class="note" style="margin-top:0">${L('Chỉ theo <b>khung ngày/giờ</b> của chương trình trong POS › Promotions. Khi mở hộp “Discount all”, POS hỏi máy chủ danh sách chương trình hợp với lượt ghé này; bấm 1 thẻ thì máy chủ kiểm lại rồi tính tiền giảm (nếu hết hạn báo “This promotion is no longer running”, sai khung báo “This visit does not qualify”).','Only by the program’s <b>day/time window</b>. Opening “Discount all” asks the server for qualifying programs; tapping one is re-checked and priced by the server.')}</p>
<div class="lbl">${L('Chương trình đang có','Programs')}</div><div class="list">${PROMOS.map(p=>`<div class="offer ${p.ok?'':'no'}"><div class="th" style="background:${p.c}">${rate(p)}</div><div><b>${esc(LANG==='vi'?p.n:p.en)}</b><small>${p.win} · ${p.ok?L('hợp lượt này','qualifies now'):L('ngoài khung giờ — không hiện','outside window — hidden')}</small></div><span></span></div>`).join('')}</div>
<div class="lbl">${L('Chưa có','Missing')}</div><ul class="note" style="padding-left:18px;margin:0">${[L('Tự áp ưu đãi — thu ngân phải nhớ mở hộp','Auto-apply'),L('Coupon của riêng khách (lấy từ NEXORA Deals, OneQR)','Customer-owned coupons'),L('Ô nhập mã / quét QR coupon','Code entry / QR scan'),L('Giới hạn lượt, mỗi khách 1 lần, khách mới','Usage limits, once per client, new client only'),L('Trừ số dư gift card theo mã','Gift card balance by code'),L('Dòng giảm giá trên hoá đơn','Discount line on receipt'),L('Chỉ giảm 1 dịch vụ (ưu đãi trong POS luôn giảm cả bill)','Single-service offers')].map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function walletCard(){const b=best();return `<div class="card" id="side"><h2>🎟️ ${L('Ưu đãi của khách','Client’s offers')} ${S.found?`<span class="pill g">${L('tự tìm','auto')}</span>`:''}</h2>
${!S.found?`<p class="note" style="margin-top:0">${L('Bấm “Nhận ra khách” (hoặc khách đã check-in bằng QR/app) — hệ thống tự gom ưu đãi.','Tap “Identify client” — offers are gathered automatically.')}</p>`:`
${S.pick&&S.pick===(b&&b.id)?`<div class="banner new" style="margin-bottom:10px">✦ ${L('Đã tự áp ưu đãi có lợi nhất cho khách:','Best offer auto-applied:')} <b>${esc(nm(b))}</b> (−${money(discOf(b))})</div>`:''}
<div class="list">${WAL.map(o=>`<button class="offer ${S.pick===o.id?'on':''} ${o.ok?'':'no'}" data-pick="${o.id}" ${o.ok?'':'disabled'}><div class="th" style="background:${o.c}">${rate(o)}</div><div><b>${esc(nm(o))}</b><small>${o.src} · ${o.scope==='all'?L('cả bill','whole bill'):o.scope} · ${o.exp}${o.ok?'':'<br><span style="color:#DC2626">'+L(...o.why)+'</span>'}</small></div><span class="pill ${o.ok?'g':'r'}">${o.ok?'−'+money(discOf(o)):L('không áp','n/a')}</span></button>`).join('')}
${PROMOS.filter(p=>p.ok).map(p=>`<button class="offer ${S.pick===p.id?'on':''}" data-pick="${p.id}"><div class="th" style="background:${p.c}">${rate(p)}</div><div><b>${esc(nm(p))}</b><small>${L('Chương trình tiệm','Shop program')} · ${p.win}</small></div><span class="pill g">−${money(discOf(p))}</span></button>`).join('')}</div>
<div class="scan"><input id="code" placeholder="${L('Nhập mã hoặc quét QR coupon','Enter code or scan QR')}" value="${esc(S.code)}"><button class="btn sm" id="codeBtn">${L('Áp mã','Apply')}</button>${S.pick?`<button class="btn sm" id="rmBtn">${L('Bỏ ưu đãi','Remove')}</button>`:''}</div>
<div class="lbl">🎁 Gift card</div><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="gcChk" ${S.gc?'checked':''}> ${GC.code} · ${L('số dư','balance')} ${money(GC.bal)} ${S.gc?`→ ${L('còn','left')} ${money(GC.bal-totals().gc)}`:''}</label>
<p class="note">${L('Luật mặc định: 1 ưu đãi mỗi lượt ghé (theo điều khoản hiện tại “không cộng dồn”). Gift card là tiền, không phải ưu đãi — luôn dùng chung được.','Default: one offer per visit. Gift card is payment, not an offer — always combinable.')}</p>`}</div>`}
function receipt(T){const lines=['NEXORA TOUCH NAIL SPA','Ticket #6 · Linda N.','--------------------------------',...SV.map(s=>(s[0].padEnd(22,' ')+money(s[2]).padStart(10,' '))),'--------------------------------','Services'.padEnd(22,' ')+money(SUB).padStart(10,' ')];
if(S.mode==='new'&&T.d)lines.push(('- '+nm(T.a)).slice(0,22).padEnd(22,' ')+('-'+money(T.d)).padStart(10,' '));
lines.push('Sales tax'.padEnd(22,' ')+money(T.tax).padStart(10,' '),'Tip'.padEnd(22,' ')+money(S.tip).padStart(10,' '));
if(S.mode==='new'&&T.gc)lines.push(('Gift card '+GC.code).padEnd(22,' ')+('-'+money(T.gc)).padStart(10,' '));
lines.push('TOTAL'.padEnd(22,' ')+money(S.mode==='cur'?T.pre:T.due).padStart(10,' '));
if(S.mode==='new'&&T.d)lines.push('','*** '+L('Bạn đã tiết kiệm','You saved')+' '+money(T.d)+' ***');
return esc(lines.join('\n'))}

:[[L('Khách lấy ưu đãi','Client claims'),L('Trên NEXORA Deals, quét OneQR, SMS, app — ưu đãi lưu vào ví của khách theo SĐT.','Deals, OneQR, SMS, app → saved to the client’s wallet by phone.')],[L('Nhận ra khách','Identify'),L('Check-in QR/app, hoặc thu ngân gõ SĐT — ticket gắn với khách.','QR/app check-in or phone number links the ticket.')],[L('Máy chủ gom & kiểm','Server checks'),L('Ví khách + chương trình tiệm; kiểm hạn, khung giờ, dịch vụ, lượt dùng, khách mới.','Wallet + programs; checks dates, window, service, limits, new client.')],[L('Tự áp cái lợi nhất','Auto-apply best'),L('Chọn mức giảm lớn nhất hợp lệ; thu ngân đổi hoặc bỏ được.','Largest valid discount; cashier can change.')],[L('Thanh toán & ghi nhận','Pay & record'),L('Đánh dấu coupon đã dùng (1 lần), trừ gift card, in dòng giảm, báo cáo theo chương trình.','Mark used, deduct gift card, print line, report.')]];

${S.mode==='new'?`<div class="lbl">${L('Việc cần làm cho dev','Dev work')}</div><div class="tw"><table><thead><tr><th>${L('Hạng mục','Item')}</th><th>${L('Hiện có','Exists')}</th><th>${L('Cần thêm','To add')}</th></tr></thead><tbody>
<tr><td>${L('Danh sách ưu đãi hợp lệ','Eligible offers')}</td><td>GET …/checkout/{order}/eligible-promotions</td><td>${L('Trả thêm coupon trong ví khách + lý do không áp','Add wallet coupons + reasons')}</td></tr>
<tr><td>${L('Áp ưu đãi','Apply')}</td><td>PUT …/checkout/{order}/discount (promotionId)</td><td>${L('Nhận couponId/mã; giảm theo dịch vụ; tự áp khi mở checkout','Accept couponId/code; line-level; auto on open')}</td></tr>
<tr><td>${L('Nhận ra khách','Identify client')}</td><td>${L('Tên + SĐT trên ticket','Name + phone')}</td><td>${L('Nối ticket với ví khách (SĐT/app/QR check-in)','Link ticket to wallet')}</td></tr>
<tr><td>${L('Chống dùng lại','Anti-reuse')}</td><td>—</td><td>${L('Khoá coupon khi áp, đánh dấu đã dùng khi thanh toán, nhả khi huỷ ticket','Lock on apply, consume on pay, release on void')}</td></tr>
<tr><td>Gift card</td><td>${L('Nhãn phương thức','Payment label')}</td><td>${L('Quét/nhập mã, trừ số dư, trả phần còn thiếu bằng cách khác','Scan code, deduct, split rest')}</td></tr>
<tr><td>${L('Hoá đơn','Receipt')}</td><td>Services · Tax · Tip · Total</td><td>${L('Dòng giảm + “Bạn đã tiết kiệm”','Discount line + “You saved”')}</td></tr></tbody></table></div>`:''}</div>`}
function openDisc(){const T=totals();S.md={t:'pct',v:0};const P=PROMOS.filter(p=>p.ok);
$('#mdb').innerHTML=`<h3>${L('Giảm cả bill','Discount all services')}<button class="btn sm" id="mdX">✕</button></h3>

<div class="lbl">${L('Ưu đãi hợp lượt ghé này','Offers this visit qualifies for')}</div><div class="list">${P.map(p=>`<button class="offer" data-promo="${p.id}"><div class="th" style="background:${p.c}">${rate(p)}</div><div><b>${esc(nm(p))}</b><small>${p.win}</small></div><span class="pill g">${rate(p)} off</span></button>`).join('')}</div>
${S.mode==='new'?`<p class="note">${L('Ở bản đề xuất, hộp này chỉ còn cho giảm tay — ưu đãi đã hiện sẵn bên phải.','In the proposal this box is for manual discounts only.')}</p>`:''}
<div class="acts"><button class="btn" id="mdRm">${L('Bỏ giảm','Remove')}</button><button class="btn pri" id="mdOk">${L('Áp dụng','Apply')}</button></div>`;
$('#md').hidden=false;
$('#mdX').onclick=()=>$('#md').hidden=true;
$$('#dt button').forEach(b=>b.onclick=()=>{S.md.t=b.dataset.t;$$('#dt button').forEach(x=>x.classList.toggle('on',x===b))});
$$('#dv button').forEach(b=>b.onclick=()=>{S.md.v=+b.dataset.v;$$('#dv button').forEach(x=>x.classList.toggle('on',x===b))});
$$('[data-promo]').forEach(b=>b.onclick=()=>{if(S.mode==='cur'){S.promo=b.dataset.promo;S.manual=null}else{S.pick=b.dataset.promo;S.manual=null}$('#md').hidden=true;toast(L('Máy chủ đã kiểm và áp chương trình','Server checked and applied'));draw()});

$('#mdRm').onclick=()=>{S.manual=null;S.promo=null;S.pick=null;$('#md').hidden=true;draw()}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function identify(){S.found=true;const b=best();S.pick=b.id;S.manual=null;draw();toast(L('✦ Tìm thấy 3 ưu đãi của khách · tự áp cái lợi nhất','✦ Found 3 offers · best applied'))}
function bind(){const f=$('#findBtn');if(f)f.onclick=identify;$('#discBtn').onclick=openDisc;
$('#tipBtn').onclick=()=>{S.tip=S.tip?0:12;draw()};$('#payBtn').onclick=()=>toast(L('Bản mẫu — không thu tiền thật','Prototype — no real payment'));
$$('[data-pick]').forEach(b=>b.onclick=()=>{S.pick=S.pick===b.dataset.pick?null:b.dataset.pick;S.manual=null;draw()});
const cb=$('#codeBtn');if(cb)cb.onclick=()=>{const v=$('#code').value.trim().toUpperCase();S.code=v;if(!v){toast(L('Nhập mã trước','Enter a code'));return}if(v==='NX15'||v==='GEL15'){S.pick='c1';toast(L('Mã hợp lệ — đã áp','Code valid — applied'))}else toast(L('Mã không đúng hoặc đã dùng — thử NX15','Invalid or used — try NX15'));draw()};
const rm=$('#rmBtn');if(rm)rm.onclick=()=>{S.pick=null;draw()};const g=$('#gcChk');if(g)g.onchange=()=>{S.gc=g.checked;draw()}}
$$('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.pick=null;S.promo=null;S.manual=null;S.gc=false;S.found=false;draw()});

// AI Smart Tour
const TOUR=[
{sel:'#bnr',m:'cur',vi:'Đây là POS đang chạy thật: không có gì tự áp. Thu ngân phải tự nhớ mở hộp giảm giá.',en:'Live POS: nothing auto-applies.'},
{sel:'#discBtn',m:'cur',vi:'Nút “Discount all” màu cam: giảm tay theo % / $, và bên trong có “Ưu đãi hợp lượt ghé này”.',en:'“Discount all”: manual % / $ plus qualifying offers.',do:()=>openDisc()},
{sel:'#side',m:'cur',vi:'Hệ thống chỉ biết theo khung ngày/giờ của chương trình. Chưa có coupon riêng của khách, mã, QR hay giới hạn lượt.',en:'Only the day/time window is known today.',do:()=>{$('#md').hidden=true}},
{sel:'#rcpt',m:'cur',vi:'Hoá đơn không có dòng giảm giá — khách không thấy mình được lợi.',en:'Receipt has no discount line.'},
{sel:'#custBox',m:'new',vi:'Đề xuất: nhận ra khách qua SĐT, QR check-in hoặc app — ticket gắn với ví ưu đãi của khách.',en:'Proposed: identify the client and link their wallet.'},
{sel:'#side',m:'new',vi:'Hệ thống gom ưu đãi từ NEXORA Deals, OneQR, tích điểm và chương trình tiệm, kiểm điều kiện rồi tự áp cái lợi nhất. Cái không hợp lệ ghi rõ lý do.',en:'Gathers offers, checks rules, auto-applies the best; shows why others fail.',do:()=>identify()},
{sel:'#tick',m:'new',vi:'Ưu đãi chỉ cho 1 dịch vụ thì giảm đúng dòng đó; gift card trừ số dư như tiền.',en:'Line-level offers; gift card deducts like cash.',do:()=>{S.gc=true;draw()}},
{sel:'#rcpt',m:'new',vi:'Hoá đơn in tên ưu đãi, số tiền giảm và “Bạn đã tiết kiệm”.',en:'Receipt shows the offer and “You saved”.'},
{sel:'#how',m:'new',vi:'5 bước hệ thống tự biết, và bảng việc cần làm cho dev dựa trên API hiện có.',en:'Five steps and the dev work list.'}];
let on=false,ti=0,paused=false,t0=0,raf;const D=6500;
function show(){const s=TOUR[ti];if(S.mode!==s.m){S.mode=s.m;S.pick=null;S.promo=null;S.manual=null;S.gc=false;S.found=false;$('#md').hidden=true;draw()}s.do&&s.do();$$('.spot').forEach(x=>x.classList.remove('spot'));setTimeout(()=>{const el=$(s.sel);if(el){el.classList.add('spot');el.scrollIntoView({behavior:'smooth',block:'center'})}},120);$('#tVi').textContent=s.vi;$('#tEn').textContent=s.en;$('#tS').textContent=`${ti+1}/${TOUR.length}`;t0=performance.now()}
function tick(n){if(!on)return;if(!paused){const p=(n-t0)/D;$('#tBar').style.width=Math.min(100,p*100)+'%';if(p>=1){ti=(ti+1)%TOUR.length;show()}}else t0=n-parseFloat($('#tBar').style.width||0)/100*D;raf=requestAnimationFrame(tick)}
function start(){on=true;ti=0;paused=false;$('#tP').textContent='⏸';$('#tb').hidden=false;show();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function stop(){on=false;$('#tb').hidden=true;$$('.spot').forEach(x=>x.classList.remove('spot'))}
$('#tourBtn').onclick=()=>{$('#wn').hidden=true;start()};$('#tX').onclick=stop;$('#tN').onclick=()=>{ti=(ti+1)%TOUR.length;show()};$('#tP').onclick=()=>{paused=!paused;$('#tP').textContent=paused?'▶':'⏸'};
addEventListener('touchstart',e=>{if(on&&!$('#tb').contains(e.target))stop()},{passive:true});
