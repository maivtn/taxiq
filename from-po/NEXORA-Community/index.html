<style>
:root{--ind:#4F46E5;--ink:#0F172A;--mute:#64748B;--line:#E2E8F0;--bg:#F6F7FB}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:5}
.hw{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;display:grid;place-items:center;font-weight:900}
h1{font-size:18px;margin:0}header small{color:var(--mute);font-size:12px}.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px}.lang button.on{background:#0F766E;color:#fff;border-color:#0F766E}
main{max-width:1180px;margin:0 auto;padding:16px}
.note{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:14px}
section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;transition:box-shadow .3s}
section.spot{box-shadow:0 0 0 3px #6366F1,0 20px 40px -20px rgba(79,70,229,.5)}
h2{font-size:16px;margin:0 0 4px}section>p{margin:0 0 12px;color:var(--mute);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
a.c{display:block;border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit;background:#FCFCFE}
a.c:hover{border-color:var(--ind)}a.c b{display:block;font-size:14px;margin-bottom:3px}a.c span{font-size:12.5px;color:var(--mute);line-height:1.45}
.t{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}.new{background:#EEF2FF;color:#4338CA}.old{background:#FEF3C7;color:#92400E}
.stour{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:#111827;color:#fff;border-radius:16px;padding:12px 14px;z-index:20;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
.stour.hide{display:none}.stour .hd{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:900;letter-spacing:.08em;color:#C4B5FD}.stour .hd button{background:#1F2937;border:0;color:#fff;border-radius:8px;width:28px;height:26px;cursor:pointer}
#tVi{font-size:14px;margin-top:6px;line-height:1.45}#tEn{font-size:12px;color:#9CA3AF;margin-top:3px}.bar{height:3px;background:#374151;border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#A78BFA}
</style></head><body>
<header><div class="hw"><div class="lg">N</div><div><h1 id="ti">NEXORA Community — toàn bộ bản mẫu</h1><small id="st">Bắt đầu từ đây · mở từng trang bên dưới</small></div><div class="sp"></div>

['nexora-oneqr-tai-tiem.html','OneQR tại tiệm','Deals gần đây và tìm deal khi quét QR.','Nearby deals when scanning in-store QR.',''],

['tai-lieu/brief-tong.md','Brief tổng (§1–§36)','Toàn bộ quyết định và luật nghiệp vụ.','All decisions and rules.','new'],
['tai-lieu/00-tai-khoan-dinh-danh-dieu-khoan.md','00 · Tài khoản, định danh, điều khoản','','',''],

function draw(){document.documentElement.lang=LANG;ti.textContent=L('NEXORA Community — toàn bộ bản mẫu','NEXORA Community — all prototypes');st.textContent=L('Bắt đầu từ đây · mở từng trang bên dưới','Start here · open any page below');
m.innerHTML=`<div class="note">${L('💚 <b>Giai đoạn 1 · miễn phí cho doanh nghiệp.</b> Đây là bản mẫu giao diện — dữ liệu là mẫu, AI là mô phỏng. Giữ nguyên thư mục để các trang liên kết được với nhau.','💚 <b>Phase 1 · free for businesses.</b> UI prototypes — sample data, simulated AI. Keep the folder intact so pages link together.')}</div>`+
G.map(g=>`<section id="${g.id}"><h2>${L(...g.h)}</h2><p>${L(...g.p)}</p><div class="g">${g.it.map(i=>`<a class="c" href="${i[0]}" target="_blank" rel="noopener"><b>${i[1]}${i[4]==='new'?`<span class="t new">${L('MỚI','NEW')}</span>`:i[4]==='old'?`<span class="t old">${L('bản cũ','older')}</span>`:''}</b>${i[2]?`<span>${L(i[2],i[3])}</span>`:''}</a>`).join('')}</div></section>`).join('');
document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;draw();if(on)show()});
const T=[['g1','Bắt đầu với bản gộp 1 file: xem toàn bộ Community và POS Promotions trong một trang.','Start with the one-file build.'],
['g2','Phía doanh nghiệp: Business Suite bật/tắt module, Campaign Studio tạo chiến dịch 1 ô, AI Studio làm banner và lời đăng.','Business side: Suite, Campaign Studio, AI Studio.'],
['g3','Phía khách: mọi deal về NEXORA Deals; quét OneQR để lấy; app mang thương hiệu tiệm.','Customer side: NEXORA Deals, OneQR, branded app.'],
['g4','Tài liệu cho dev và BA: brief tổng §1–§36 và 8 file đặc tả.','Docs: master brief and 8 specs.']];
let on=false,i=0,paused=false,t0=0,raf;const D=6000;
function show(){const s=T[i];document.querySelectorAll('section').forEach(x=>x.classList.toggle('spot',x.id===s[0]));document.getElementById(s[0]).scrollIntoView({behavior:'smooth',block:'center'});tVi.textContent=s[1];tEn.textContent=s[2];tS.textContent=`${i+1}/${T.length}`;t0=performance.now()}
function tick(n){if(!on)return;if(!paused){const p=(n-t0)/D;tBar.style.width=Math.min(100,p*100)+'%';if(p>=1){i=(i+1)%T.length;show()}}else t0=n-parseFloat(tBar.style.width||0)/100*D;raf=requestAnimationFrame(tick)}
function start(){on=true;i=0;paused=false;tP.textContent='⏸';tb.classList.remove('hide');show();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function stop(){on=false;tb.classList.add('hide');document.querySelectorAll('section').forEach(x=>x.classList.remove('spot'))}
tourBtn.onclick=start;tX.onclick=stop;tN.onclick=()=>{i=(i+1)%T.length;show()};tP.onclick=()=>{paused=!paused;tP.textContent=paused?'▶':'⏸'};
addEventListener('touchstart',e=>{if(on&&!tb.contains(e.target))stop()},{passive:true});
draw();setTimeout(()=>{if(!on)start()},1500);
</script></body></html>
