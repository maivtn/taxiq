      if(["Review Required","Retrying","Draft","Pending","Needs Review","Review","Reviewing","Degraded","Requested","Warn"].includes(status)) return "warn";

    function gpsToRad(value){return value * Math.PI / 180;}
    function gpsPointLabel(point){
      if(!point) return "Waiting for GPS";
      if(point.label) return point.label;
      if(point.lat == null || point.lng == null) return "Manual location";
      return `${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}`;
    }
    function gpsDistanceMiles(points){
      const usable = points.filter(point => point && point.lat != null && point.lng != null && !point.manual);
      if(usable.length < 2) return 0;
      let total = 0;
      for(let i = 1; i < usable.length; i += 1){
        const prev = usable[i - 1];
        const next = usable[i];
        const dLat = gpsToRad(next.lat - prev.lat);
        const dLng = gpsToRad(next.lng - prev.lng);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(gpsToRad(prev.lat)) * Math.cos(gpsToRad(next.lat)) * Math.sin(dLng / 2) ** 2;
        total += 3958.8 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }
      return Math.round(total * 10) / 10;
    }

            <div class="form-control"><label for="mileagePurpose">Business purpose</label><select id="mileagePurpose"><option>Business supplies</option><option>Client visit</option><option>Cash deposit</option><option>Job site</option><option>CPA meeting</option><option>Other business trip</option></select></div>
            <div class="form-control"><label for="mileageVehicle">Vehicle</label><input id="mileageVehicle" value="Business vehicle"></div>
            <div class="form-control"><label>Tracking rule</label><input value="Start at A, stop at B to save" readonly></div>
          </div>
          <div class="notice" style="margin-top:12px;margin-bottom:0">Workflow: press Start at point A, drive to point B, then press Stop. Tax IQ saves the trip into the table for deduction and CPA review.</div>
        </div></div>`;
      const latestPoint = activeMileageTrip ? activeMileageTrip.points[activeMileageTrip.points.length - 1] : null;
      const activePanel = activeMileageTrip ? `
        <div class="panel" style="margin-bottom:14px"><div class="panel-head"><h3>Active Mileage Capture</h3>${statusPill("Tracking")}</div><div class="panel-body">
          <div class="field-grid">
            <div class="field"><span>Trip ID</span><strong class="mono">${activeMileageTrip.id}</strong></div>
            <div class="field"><span>Point A</span><strong>${gpsPointLabel(activeMileageTrip.startPoint)}</strong></div>
            <div class="field"><span>Current / Point B</span><strong>${gpsPointLabel(latestPoint)}</strong></div>
            <div class="field"><span>Miles so far</span><strong>${activeMiles}</strong></div>
            <div class="field"><span>Purpose</span><strong>${activeMileageTrip.purpose}</strong></div>
            <div class="field"><span>GPS status</span><strong>${activeMileageTrip.gpsStatus}</strong></div>
          </div>
          <div class="notice" style="margin-top:12px;margin-bottom:0">When you arrive at point B, press Stop Trip at Point B. The system will save route, miles, start time, stop time, vehicle, and purpose.</div>
        </div></div>` : "";
      document.getElementById("screen-gps").innerHTML = `
        <div class="grid-4" style="margin-bottom:14px">
          <div class="metric green card"><div class="label">Trips</div><div class="value">${mileageTrips.length}</div><div class="sub">Tracked or pending review</div></div>
          <div class="metric cyan card"><div class="label">Total Miles</div><div class="value">${totalMiles}</div><div class="sub">Saved plus active capture</div></div>
          <div class="metric yellow card"><div class="label">Deduction Candidates</div><div class="value">${mileageTrips.filter(t=>t.status==="Deduction candidate").length}</div><div class="sub">CPA should review</div></div>
          <div class="metric red card"><div class="label">Policy Checks</div><div class="value">${mileageTrips.filter(t=>t.status.includes("check")).length}</div><div class="sub">Ambiguous route purpose</div></div>
        </div>
        ${setupPanel}
        ${activePanel}
        <div class="panel" style="margin-bottom:14px"><div class="panel-head"><h3>GPS Mileage Tracker</h3><button class="btn primary" data-action="start-mileage">${activeMileageTrip ? "Stop Trip at Point B" : "Start Trip at Point A"}</button></div>${table(["Trip ID","Route","Miles","Purpose","Status"],mileageRows)}</div>
        <div class="panel"><div class="panel-head"><h3>Mileage Data To Collect</h3></div>${table(["Field","Why It Matters","Required"],fieldRows)}</div>`;
    }

    function renderWebhooks(){
      setTitle("Webhook Monitor","Outbox delivery log for connected payroll systems.");
      document.getElementById("screen-webhooks").innerHTML = `
        <div class="grid-4" style="margin-bottom:14px">
          <div class="metric green card"><div class="label">Delivered (24h)</div><div class="value">1,284</div><div class="sub">99.7% success rate</div></div>
          <div class="metric cyan card"><div class="label">Pending</div><div class="value">7</div><div class="sub">In delivery queue</div></div>
          <div class="metric yellow card"><div class="label">Retrying</div><div class="value">3</div><div class="sub">Next retry in 5 min</div></div>
          <div class="metric red card"><div class="label">Dead Letter</div><div class="value">1</div><div class="sub">Manual review required</div></div>
        </div>
        <div class="panel"><div class="panel-head"><h3>Recent Events</h3><button class="btn" data-action="retry-webhooks">Retry Failed</button></div>
          ${table(["Event ID","Type","Tenant","Attempts","Status","Created","Delivered"], events.filter(matches).map(e=>`<tr><td class="mono">${e.id}</td><td class="mono">${e.type}</td><td>${e.tenant}</td><td>${e.attempts}</td><td>${statusPill(e.status)}</td><td>${e.created}</td><td>${e.delivered}</td></tr>`))}
        </div>`;
    }

    function renderSettings(){
      setTitle("Settings","Configure tenant security, strict mode, and notification behavior.");
      document.getElementById("screen-settings").innerHTML = `
        <div class="grid-2">
          <div class="panel"><div class="panel-head"><h3>US Payroll Scope</h3><span class="chip green">${state.scope}</span></div><div class="panel-body">
            <div class="row"><span>Supported country</span><span>United States</span></div>
            <div class="row"><span>Tax levels</span><span>Federal, State, Local</span></div>
            <div class="row"><span>Employee forms</span><span>W-4, W-2</span></div>
            <div class="row"><span>Employer returns</span><span>941, 940, SUTA</span></div>
            <div class="row"><span>Identity fields</span><span>SSN / TIN tokenized</span></div>
          </div></div>
          <div class="panel"><div class="panel-head"><h3>Compliance Controls</h3></div><div class="panel-body">
            <div class="row"><span>Strict finalization mode</span><span><input type="checkbox" checked> Enabled</span></div>
            <div class="row"><span>Require TIN verification</span><span><input type="checkbox" checked> Enabled</span></div>
            <div class="row"><span>Mask SSN in UI</span><span><input type="checkbox" checked> Enabled</span></div>
            <div class="row"><span>Block missing state registration</span><span><input type="checkbox" checked> Enabled</span></div>
            <div class="row"><span>Track FUTA/SUTA obligations</span><span><input type="checkbox" checked> Enabled</span></div>
            <div class="row"><span>Audit retention</span><span>7 years</span></div>
          </div></div>
          <div class="panel"><div class="panel-head"><h3>Notifications</h3></div><div class="panel-body">
            <div class="row"><span>Exception digest</span><span>Daily</span></div>
            <div class="row"><span>Webhook failure alerts</span><span>Immediate</span></div>
            <div class="row"><span>Owner escalation</span><span>After 2 days</span></div>
            <button class="btn primary" data-action="save-settings">Save Settings</button>
          </div></div>
          <div class="panel"><div class="panel-head"><h3>Role & Access</h3><select class="role-select" id="roleSelect">${Object.keys(roles).map(role => `<option ${role===state.role ? "selected" : ""}>${role}</option>`).join("")}</select></div><div class="panel-body">
            ${["create_run","verify_tin","resolve_exception","finalize_run","export_data","manage_settings"].map(permission => `<div class="permission"><span class="mono">${permission}</span><span>${can(permission) ? statusPill("Active") : statusPill("Missing")}</span></div>`).join("")}
          </div></div>
          <div class="panel"><div class="panel-head"><h3>Data Protection</h3></div><div class="panel-body">
            <div class="row"><span>SSN/TIN storage</span><span>Tokenized</span></div>
            <div class="row"><span>PII export approval</span><span>Required</span></div>
            <div class="row"><span>Webhook signing</span><span>HMAC SHA-256</span></div>
            <div class="row"><span>Idempotency window</span><span>24 hours</span></div>
          </div></div>
        </div>`;
    }

    const renderers = {
      dashboard: renderDashboard, analytics: renderAnalytics, employers: renderEmployers, employees: renderEmployees, runs: renderRuns,
      "run-detail": renderRunDetail, "employee-profile": renderEmployeeProfile, connections: renderConnections, ledger: renderLedger,
      exceptions: renderExceptions, jurisdictions: renderJurisdictions, forms: renderForms,
      "ai-advisor": renderAiAdvisor, ocr: renderOcr, "share-links": renderShareLinks, gps: renderGps,
      webhooks: renderWebhooks, settings: renderSettings
    };

    function showScreen(name){
      state.screen = renderers[name] ? name : "dashboard";
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(`screen-${state.screen}`).classList.add("active");
      if(window.location.hash.slice(1) !== state.screen){
        history.replaceState(null, "", `#${state.screen}`);
      }
      render();
    }

    function render(){
      renderNav();
      renderPeriods();
      renderers[state.screen]();
      bindDynamicEvents();
    }

    function bindDynamicEvents(){
      document.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => showScreen(el.dataset.go)));
      document.querySelectorAll("[data-run]").forEach(el => el.addEventListener("click", () => {state.selectedRun = el.dataset.run; showScreen("run-detail");}));
      document.querySelectorAll("[data-employee]").forEach(el => el.addEventListener("click", () => {state.selectedEmployee = el.dataset.employee; showScreen("employee-profile");}));
      document.querySelectorAll("[data-action]").forEach(el => el.addEventListener("click", () => handleAction(el.dataset.action, el)));
      document.querySelectorAll("[data-export]").forEach(el => el.addEventListener("click", () => exportCsv(el.dataset.export)));
      document.querySelectorAll("[data-resolve]").forEach(el => el.addEventListener("click", () => {
        if(!can("resolve_exception")){ toast(`${state.role} cannot resolve exceptions.`); return; }
        const ex = exceptions.find(x => x.id === el.dataset.resolve);
        if(ex){
          ex.status = "Resolved";
          addAudit(ex.id, "Resolved exception", `${ex.type} resolved from ${state.screen}.`);
          toast(`${ex.id} marked resolved`);
          render();
        }
      }));
      const roleSelect = document.getElementById("roleSelect");
      if(roleSelect){
        roleSelect.addEventListener("change", () => {
          state.role = roleSelect.value;
          toast(`Role switched to ${state.role}`);
          render();
        });
      }
    }

    function handleAction(action){
      if(action === "new-run"){
        if(!can("create_run")){ toast(`${state.role} cannot create payroll runs.`); return; }
        const id = `pr_draft_${Date.now().toString().slice(-5)}`;
        runs.unshift({id, period:"Next Regular", payDate:"Jul 17, 2026", employees:0, gross:0, tax:0, employerTax:0, risk:null, status:"Pending", source:"Manual draft", approvedBy:"Pending", depositDue:"Jul 22, 2026"});
        runValidations[id] = [{name:"Payroll import", status:"warn", detail:"Draft run is waiting for employee line items.", owner:"Payroll"}];
        addAudit(id, "Created draft run", "Run created from Tax IQ workspace.");
        state.selectedRun = id;
        toast(`Draft run ${id} created.`);
        showScreen("run-detail");
        return;
      }
      if(action === "finalize"){
        const run = runs.find(r=>r.id===state.selectedRun);
        if(!run){ toast("No payroll run selected."); return; }
        if(!can("finalize_run")){ toast(`${state.role} cannot finalize runs.`); return; }
        if(["Ledger Posted","Reported"].includes(run.status)){ toast(`${run.id} is already finalized.`); return; }
        if(!runLineItems(run.id).length){
          run.status = "Pending";
          addAudit(run.id, "Finalization blocked", "No line items are attached to the run.");
          toast("Cannot finalize: payroll line items are missing.");
          render();
          return;
        }
        if(hasBlockingItems(run)){
          run.status = "Validation Failed";
          addAudit(run.id, "Finalization blocked", "Blocking validation or exception is still open.");
          toast("Cannot finalize: resolve blocking items first.");
          render();
          return;
        }
        run.status = "Ledger Posted";
        run.approvedBy = state.role;
        run.risk = Math.min(run.risk ?? 12, 18);
        addAudit(run.id, "Finalized payroll run", "Validation passed and ledger was posted.");
        toast(`${run.id} finalized and posted to ledger.`);
        render();
        return;
      }
      if(action === "verify-tin"){
        if(!can("verify_tin")){ toast(`${state.role} cannot verify TINs.`); return; }
        const emp = employees.find(e=>e.id===state.selectedEmployee);
        if(emp){
          emp.tin = "Verified";
          emp.risk = Math.max(0, emp.risk - 12);
          addAudit(emp.id, "Verified TIN", "Employee tax identity was marked verified.");
          toast(`${emp.name} TIN verified.`);
          render();
        }
        return;
      }
      if(action === "send-w4"){
        const emp = employees.find(e=>e.id===state.selectedEmployee);
        if(emp){
          emp.w4 = emp.w4 === "Missing" ? "Requested" : emp.w4;
          addAudit(emp.id, "Queued W-4 request", "Employee self-service link was queued.");
          toast(`W-4 request queued for ${emp.name}.`);
          render();
        }
        return;
      }
      if(action === "sync"){
        employers.forEach(employer => {
          if(matches(employer)){ employer.lastSync = "Now"; employer.health = Math.max(employer.health, 99); employer.status = "Active"; }
        });
        addAudit("connections", "Synced employer connections", "Matching employers were refreshed.");
        toast("Employer sync completed.");
        render();
        return;
      }
      if(action === "generate-report"){
        forms.unshift({name:"Payroll Tax Control Report", period:state.period, status:"Draft", records:runs.length, due:"Internal", source:"Tax IQ audit ledger", owner:state.role});
        addAudit("forms", "Generated report draft", `Payroll Tax Control Report for ${state.period}.`);
        toast("Report draft generated.");
        render();
        return;
      }
      if(action === "retry-webhooks"){
        events.forEach(event => {
          if(event.status === "Retrying" || event.status === "Dead Letter"){
            event.status = "Delivered";
            event.attempts += 1;
            event.delivered = "Now";
          }
        });
        addAudit("webhooks", "Retried failed webhooks", "Retrying and dead-letter events were queued for delivery.");
        toast("Failed webhooks retried.");
        render();
        return;
      }
      if(action === "save-settings"){
        if(!can("manage_settings")){ toast(`${state.role} cannot update settings.`); return; }
        addAudit("settings", "Saved tenant settings", "Compliance controls and notifications reviewed.");
        toast("Settings saved.");
        return;
      }
      if(action === "add-registration"){
        const missing = jurisdictions.find(j => j.registrations === "Missing setup");
        if(missing){
          missing.registrations = "Review";
          addAudit(missing.id, "Started registration workflow", `${missing.name} registration moved to review.`);
          toast(`${missing.name} registration workflow started.`);
          render();
          return;
        }
      }
      if(action === "capture-ocr"){
        const id = `rcpt_${String(receiptVault.length + 1).padStart(3,"0")}`;
        receiptVault.unshift({id, vendor:"AI capture pending", type:"Uncategorized", amount:0, source:"Camera upload", status:"Needs Review", owner:state.role});
        addAudit(id, "Captured receipt for OCR", "AI extraction queued for merchant review.");
        toast("Receipt captured and queued for AI OCR.");
        render();
        return;
      }
      if(action === "create-share-link"){
        const id = `shr_${String(shareLinks.length + 1).padStart(3,"0")}`;
        shareLinks.unshift({id, recipient:"New reviewer", access:"Selected records", expires:"15 days", status:"Active"});
        addAudit(id, "Created share link", "Secure upload/review link created with 15-day default expiration.");
        toast("Secure share link created.");
        render();
        return;
      }
      if(action === "connect-cpa"){
        cpaReviews.unshift({firm:"New CPA invite", scope:"Tax IQ ledger review", status:"Invited", next:"Waiting for CPA acceptance"});
        addAudit("cpa", "Invited CPA reviewer", "CPA portal invite queued.");
        toast("CPA invite created.");
        render();
        return;
      }
      if(action === "start-mileage"){
        if(activeMileageTrip){
          stopMileageWatch();
          const lastPoint = activeMileageTrip.points[activeMileageTrip.points.length - 1];
          let finalPoint;
          if(lastPoint && !lastPoint.manual){
            finalPoint = {...lastPoint, label:activeMileageTrip.endLabel || "Point B"};
            if(activeMileageTrip.points.length > 1){
              activeMileageTrip.points[activeMileageTrip.points.length - 1] = finalPoint;
            } else {
              activeMileageTrip.points.push(finalPoint);
            }
          } else {
            finalPoint = manualMileagePoint(activeMileageTrip.endLabel || "Point B: destination stop");
            activeMileageTrip.points.push(finalPoint);
          }

          const gpsMiles = gpsDistanceMiles(activeMileageTrip.points);
          const miles = gpsMiles || activeMileageTrip.expectedMiles || 0;
          const route = `${gpsPointLabel(activeMileageTrip.startPoint)} to ${gpsPointLabel(finalPoint)}`;
          const savedTrip = {
            id: activeMileageTrip.id,
            route,
            miles,
            purpose: activeMileageTrip.purpose,
            status: miles > 0 ? "Deduction candidate" : "Needs CPA policy check",
            pointA: gpsPointLabel(activeMileageTrip.startPoint),
            pointB: gpsPointLabel(finalPoint),
            vehicle: activeMileageTrip.vehicle,
            started: activeMileageTrip.startedAt,
            stopped: new Date().toLocaleString()
          };
          mileageTrips.unshift(savedTrip);
          addAudit(savedTrip.id, "Stopped mileage capture", `Saved route ${savedTrip.pointA} to ${savedTrip.pointB} with ${savedTrip.miles} miles.`);
          activeMileageTrip = null;
          toast(`Trip saved: ${route}`);
          render();
          return;
        }

        const id = `trip_${String(mileageTrips.length + 1).padStart(3,"0")}`;
        const startLabel = document.getElementById("mileageStartLabel")?.value.trim() || "Point A: current location";
        const endLabel = document.getElementById("mileageEndLabel")?.value.trim() || "Point B: destination";
        const expectedMiles = Number(document.getElementById("mileageExpectedMiles")?.value || 0);
        const purpose = document.getElementById("mileagePurpose")?.value || "Business trip";
        const vehicle = document.getElementById("mileageVehicle")?.value.trim() || "Business vehicle";
        const startPoint = manualMileagePoint(startLabel);
        activeMileageTrip = {
          id,
          startLabel,
          endLabel,
          expectedMiles:Number.isFinite(expectedMiles) ? Math.max(expectedMiles, 0) : 0,
          purpose,
          vehicle,
          startedAt:new Date().toLocaleString(),
          startPoint,
          points:[startPoint],
          gpsStatus:navigator.geolocation ? "Requesting GPS permission" : "Manual mode: GPS unavailable",
          watchId:null
        };

        if(navigator.geolocation){
          try{
            activeMileageTrip.watchId = navigator.geolocation.watchPosition(position => {
              if(!activeMileageTrip || activeMileageTrip.id !== id) return;
              const point = {
                lat:position.coords.latitude,
                lng:position.coords.longitude,
                accuracy:Math.round(position.coords.accuracy || 0),
                at:new Date(position.timestamp).toLocaleString()
              };
              if(activeMileageTrip.points.length === 1 && activeMileageTrip.points[0].manual){
                point.label = activeMileageTrip.startLabel;
                activeMileageTrip.points[0] = point;
                activeMileageTrip.startPoint = point;
              } else {
                activeMileageTrip.points.push(point);
              }
              activeMileageTrip.gpsStatus = "Tracking live GPS";
              if(state.screen === "gps" && activeMileageTrip.points.length <= 2){
                render();
              }
            }, () => {
              if(!activeMileageTrip || activeMileageTrip.id !== id) return;
              activeMileageTrip.gpsStatus = "Manual mode: GPS permission denied";
              toast("GPS permission denied. Expected miles will be used when stopped.");
              render();
            }, {enableHighAccuracy:true, maximumAge:10000, timeout:12000});
          } catch(error){
            activeMileageTrip.gpsStatus = "Manual mode: GPS unavailable";
          }
        }

        addAudit(id, "Started mileage capture", `Started point A to point B trip from ${startLabel}.`);
        toast("Mileage tracking started at Point A.");
        render();
        return;
      }
      toast(actionMessage(action));
    }

    function actionMessage(action){
      const labels = {
        "new-run":"Draft payroll run created.",
        "finalize":"Finalize workflow opened. Validation must pass first.",
        "send-w4":"W-4 request link queued for employee.",
        "verify-tin":"TIN verification request started.",
        "invite-employee":"Employee invitation flow opened.",
        "sync":"Employer sync requested.",
        "add-employer":"Employer setup wizard opened.",
        "add-connection":"Connection wizard opened.",
        "test-connection":"Connection health check started.",
        "download-report":"Report download prepared.",
        "assign":"Assignment panel opened.",
        "review-jurisdiction":"Jurisdiction review opened.",
        "add-registration":"Tax registration workflow opened.",
        "preview-report":"Report preview opened.",
        "generate-report":"Report generation started.",
        "retry-webhooks":"Failed webhook retry queued.",
        "save-settings":"Settings saved.",
        "open-guide":"Guided help opened for this workspace.",
        "ask-ai-cfo":"AI CFO is preparing cash-flow and tax planning advice.",
        "generate-checklist":"Industry deduction checklist generated.",
        "copy-share-link":"Secure share link copied."
      };
      return labels[action] || "Action received.";
    }

    function exportCsv(type){
      if(!can("export_data")){ toast(`${state.role} cannot export data.`); return; }
      const map = {runs, employees, exceptions, ledger, "line-items": runLineItems(state.selectedRun)};
      const data = map[type] || [];
      if(!data.length){ toast("No data to export."); return; }
      const headers = Object.keys(data[0]);
      const csv = [headers.join(","), ...data.map(row => headers.map(h => `"${String(row[h] ?? "").replaceAll('"','""')}"`).join(","))].join("\n");
      const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `tax-iq-${type}.csv`;
      link.click();
      URL.revokeObjectURL(url);
      toast(`${type} CSV exported.`);
    }

    function toast(message){
      const box = document.getElementById("toast");
      const item = document.createElement("div");
      item.textContent = message;
      box.appendChild(item);
      setTimeout(() => item.remove(), 2800);
    }

    document.getElementById("searchInput").addEventListener("input", (event) => {
      state.query = event.target.value;
      renderers[state.screen]();
      bindDynamicEvents();
    });
    document.getElementById("newRunBtn").addEventListener("click", () => showScreen("runs"));
    window.addEventListener("hashchange", () => {
      const screen = window.location.hash.slice(1);
      if(renderers[screen]) showScreen(screen);
    });
    const initialScreen = window.location.hash.slice(1);
    showScreen(renderers[initialScreen] ? initialScreen : state.screen);
  </script>
</body>
</html>
