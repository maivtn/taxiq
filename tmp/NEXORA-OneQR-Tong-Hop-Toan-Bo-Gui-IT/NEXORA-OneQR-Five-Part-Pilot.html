</style><body><div class="shell"><aside><h2>NEXORA<br>ONEQR</h2><div class="account">Thử nghiệm địa phương<small>Tiện ích trước · Kiếm tiền tùy chọn</small></div><nav id="nav"></nav><div class="navfoot">5 phần cùng một dữ liệu mẫu.<br>Không kết nối Nexora thật.</div></aside><div class="workspace"><header><b>OneQR / Phác thảo triển khai nhanh</b><span class="pill">PROTOTYPE · PILOT</span></header><main id="main"></main></div></div><dialog id="dialog" class="dialog"><button class="close" onclick="document.getElementById('dialog').close()" aria-label="Đóng">×</button><div id="content"></div></dialog><script>
let tab=0,step=0,earn=false,source='business',screen='home',category='Tất cả',query='',clicks=0,duplicates=0,selected='',paused=false,submitted=false;
let promo={title:'Signature Pedicure',price:80,original:100,description:'Ngâm chân, chăm sóc móng, tẩy da chết và massage đá nóng.',template:'Khách mới',budget:20,cpc:.20};
const labels=['01 · Tạo promotion nhanh','02 · Mạng lưới bổ trợ','03 · Khách quét OneQR','04 · Dashboard hai phía','05 · Thử nghiệm CPC'];
const offers=[{id:'self',name:'Bitcoin Nail Bar',cat:'Nail',title:'Signature Pedicure',price:'$80',desc:'Ưu đãi của tiệm đang đón bạn.',icon:'✦'},{id:'cafe',name:'Café Mộc',cat:'Ăn uống',title:'Combo cà phê & bánh',price:'$9',desc:'Một khoảng nghỉ ngon miệng sau buổi làm đẹp.',icon:'☕'},{id:'car',name:'Fresh Auto',cat:'Chăm sóc xe',title:'Rửa xe trọn gói',price:'$19',desc:'Chăm sóc xe trong chuyến đi hôm nay.',icon:'◈'},{id:'nail',name:'Rose Nails',cat:'Nail',title:'Gel manicure',price:'$29',desc:'Mẫu từ một salon khác trong mạng lưới.',icon:'✧'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cash=n=>'$'+Number(n).toFixed(2);
function go(n){tab=n;render()}function heading(t,s){return `<div class="eyebrow">ONEQR · 5 PHẦN TRIỂN KHAI</div><div class="title"><div><h1>${t}</h1><p class="muted">${s}</p></div></div>`}
function card(t,n,s){return `<div class="card"><span class="label">${t}</span><b>${n}</b><small>${s}</small></div>`}
function banner(){return `<div class="deal"><small>BITCOIN NAIL BAR · CHƯƠNG TRÌNH MẪU</small><h2>${esc(promo.title)}</h2><strong>${cash(promo.price)}</strong> <s>${cash(promo.original)}</s><p>${esc(promo.description)}</p><small>Khách mới · theo lịch còn trống · điều kiện cần xác nhận trước phát hành</small></div>`}
function form(){return heading('Một nội dung. Nhiều nơi hiển thị.','Chọn mẫu → sửa → xem trước → gửi duyệt. Nội dung dùng lại cho OneQR, card và poster.')+`<div class="progress">${[0,1,2].map(i=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><div class="split"><div class="panel"><span class="badge">Bước ${step+1}/3</span>${step===0?`<h2>Chọn mẫu để bắt đầu</h2><div class="form">${['Khách mới','Giờ vắng','Nâng cấp dịch vụ'].map(t=>`<button onclick="choose('${t}')">${promo.template===t?'✓ ':''}${t} →</button>`).join('')}</div><p class="muted">Điền sẵn nội dung minh họa. Merchant kiểm tra giá, dịch vụ và điều kiện.</p><button class="primary" onclick="step=1;render()">Sửa nội dung →</button>`:step===1?`<h2>Thông tin chương trình</h2><form class="form" onsubmit="save(event)"><label>Tên chương trình<input id="title" required maxlength="70" value="${esc(promo.title)}"></label><label>Mô tả dịch vụ<input id="description" required maxlength="180" value="${esc(promo.description)}"></label><label>Giá gốc ($)<input id="original" required type="number" min="1" step=".01" value="${promo.original}"></label><label>Giá ưu đãi ($)<input id="price" required type="number" min="1" step=".01" value="${promo.price}"></label><p id="error" role="alert"></p><button class="primary">Lưu & xem trước →</button></form>`:`<h2>Chương trình này sẽ hiển thị ở đâu?</h2><p>Chọn nơi đăng và bấm Xem vị trí để thấy giao diện khách. Bản xem trước chưa phát hành thật.</p>${destinations()}<div class="tabs"><button onclick="poster()">Tạo poster / bản in riêng</button></div><button class="primary" ${!placements.shop&&!placements.public?'disabled':''} onclick="submitted=true;render()">${submitted?'Đã lưu lựa chọn · mẫu':'Lưu nơi hiển thị · mô phỏng'}</button>${submitted?`<p class="good">Đã chọn: ${[placements.shop?'OneQR của tiệm':'',placements.public?'Mạng lưới công khai':'',placements.paid?'Quảng bá trả phí':''].filter(Boolean).join(' · ')}. Chưa đăng thật, chưa thu phí.</p>`:''}`}<div class="tabs">${step>0?'<button onclick="step--;render()">← Quay lại</button>':''}</div></div><div><div class="panel"><h2>Xem trước banner</h2>${banner()}<p class="mini muted">Ảnh dịch vụ và tải thiết kế riêng sẽ được bổ sung khi triển khai. Bản phác thảo này dùng nền đồ họa.</p></div></div></div>`}
function choose(t){promo.template=t;if(t==='Giờ vắng')Object.assign(promo,{title:'Pedicure giờ vắng',original:60,price:49,description:'Chăm sóc móng và massage thư giãn. Khung giờ áp dụng do tiệm xác nhận.'});else if(t==='Nâng cấp dịch vụ')Object.assign(promo,{title:'Nâng cấp Spa Pedicure',original:90,price:75,description:'Thêm mặt nạ dưỡng ẩm và massage đá nóng vào dịch vụ.'});else Object.assign(promo,{title:'Signature Pedicure',original:100,price:80,description:'Ngâm chân, chăm sóc móng, tẩy da chết và massage đá nóng.'});submitted=false;render()}
function save(e){e.preventDefault();let price=Number(document.getElementById('price').value),original=Number(document.getElementById('original').value);if(price>original){document.getElementById('error').textContent='Giá ưu đãi không được lớn hơn giá gốc.';return}Object.assign(promo,{title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim(),price,original});submitted=false;step=2;render()}
function network(){return heading('Một khu vực. Các ngành bổ trợ.','Mở rộng tiếp cận từ khách của tiệm sang khách trong mạng lưới.')+`<div class="hero"><div><small>CỤM THỬ NGHIỆM ĐỀ XUẤT</small><h2>Houston · 10–20 doanh nghiệp · 30 ngày</h2><p>Đây là kế hoạch mẫu, chưa phải đối tác đã tham gia.</p></div></div><div class="cards">${card('Nhóm khởi đầu','Nail','Menu, check-in, booking')}${card('Ngành bổ trợ','Ăn uống','Nhà hàng, cà phê')}${card('Ngành bổ trợ','Dịch vụ xe','Chăm sóc xe')}${card('Nguồn mở rộng','Cá nhân','QR chia sẻ · không quản lý bản in')}</div><div class="panel"><h2>Thử bộ lọc theo nguồn QR</h2><div class="tabs"><button class="${source==='business'?'primary':''}" onclick="source='business';render()">QR tiệm nail</button><button class="${source==='personal'?'primary':''}" onclick="source='personal';render()">QR cá nhân / truy cập trực tiếp</button></div><p>${source==='business'?'Giữ ưu đãi chính tiệm; loại salon đối thủ. Không yêu cầu GPS để quyết định ngành nguồn.':'Khám phá toàn mạng. QR cá nhân không tự mang ngành của nơi đặt bản in.'}</p>${offers.map(o=>`<div class="line"><span>${o.icon} ${o.name} · ${o.cat}</span><b class="${source==='business'&&o.id==='nail'?'bad':'good'}">${source==='business'&&o.id==='nail'?'Loại: cạnh tranh':'Đủ điều kiện ngành'}</b></div>`).join('')}<p class="mini muted">Minh họa một quy tắc ngành. Production phải dùng ngành chính và dịch vụ của doanh nghiệp cho cả list, bản đồ và chi tiết.</p><button onclick="screen='nearby';go(2)">Xem như khách →</button></div>`}
function eligible(){return offers.filter(o=>!(source==='business'&&o.id==='nail')).filter(o=>category==='Tất cả'||o.cat===category).filter(o=>(o.name+' '+(o.id==='self'?promo.title:o.title)+' '+o.cat).toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))}
function offercards(){return eligible().map(o=>`<div class="offer"><div class="row"><span>${o.icon} ${o.cat}</span><span class="badge">${o.id==='self'?'Của tiệm':'Được tài trợ · mẫu'}</span></div><h3>${o.name}</h3><p>${o.id==='self'?esc(promo.title):o.title}</p><strong>${o.id==='self'?cash(promo.price):o.price}</strong><p class="mini muted">${o.desc}</p><button onclick="openDeal('${o.id}')">Xem chi tiết →</button></div>`).join('')||'<p>Không có kết quả phù hợp. Không chèn deal đối thủ để lấp chỗ.</p>'}
function guest(){return heading('Khách có lý do để quét và đi tiếp','Không cần app để xem. Hai nút khám phá luôn có; bật kiếm tiền làm lời mời nổi bật hơn.')+`<div class="split"><div><div class="panel"><h2>Điều khiển bản mẫu</h2><label class="check"><input type="checkbox" ${earn?'checked':''} onchange="earn=this.checked;render()"><span><b>Bật kiếm tiền cho chủ QR</b><br><small>Đồng ý giới thiệu nổi bật nội dung mạng lưới. Không biến mọi lượt quét thành tiền.</small></span></label><div class="tabs"><button onclick="source='business';screen='home';render()">QR doanh nghiệp</button><button onclick="source='personal';screen='home';render()">QR cá nhân</button></div><p>Nguồn hiện tại: <b>${source==='business'?'Bitcoin Nail Bar · ngành Nail':'QR cá nhân · toàn mạng'}</b></p><div class="callout">Không giới hạn số bản in, không bắt đăng ký từng nơi đặt. Mã gắn chủ nguồn; mã kênh riêng là tùy chọn.</div><p class="mini muted">Bấm deal trong bản mẫu để xem lượt click mô phỏng xuất hiện ở dashboard. Không gửi dữ liệu hoặc tính phí thật.</p></div></div><div class="phone"><div class="phoneheader">Khách · Không cần cài app</div><div class="phonebody">${screen==='home'?`<span class="eyebrow">ONEQR</span><h2>${source==='business'?'Bitcoin Nail Bar':'Khám phá cùng OneQR'}</h2><p class="mini muted">${source==='business'?'Tiện ích và chương trình của tiệm':'Một mã · nhiều tiện ích và ưu đãi'}</p><div class="discover ${earn?'large':''}"><button onclick="screen='nearby';category='Tất cả';query='';render()">⌖ Nearby / Explore<small>${earn?'Chỗ hay quanh bạn. Khám phá thêm →':'Khám phá địa điểm'}</small></button><button onclick="screen='search';category='Tất cả';query='';render()">⌕ Search Deals<small>${earn?'Tìm ưu đãi phù hợp nhu cầu →':'Tìm ưu đãi'}</small></button></div>${source==='business'?banner():''}<div class="menugrid">${['Check-in','Dịch vụ & giá','Đặt lịch','Tip','Đánh giá','Ưu đãi của tiệm'].map(t=>`<button onclick="utility('${t}')">${t} →</button>`).join('')}</div>`:`<button onclick="screen='home';render()">⌂ Về OneQR Main Menu</button><h2 style="margin-top:18px">${screen==='nearby'?'Nearby / Explore':'Search Deals'}</h2><p class="mini muted">${screen==='nearby'?'Khám phá địa điểm và dịch vụ. Khu vực minh họa: Houston; chưa dùng vị trí thật.':'Chọn ngành để thấy ngay chương trình phù hợp.'}</p><input aria-label="Tìm dịch vụ hoặc ưu đãi" placeholder="Tìm dịch vụ hoặc ưu đãi…" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px" value="${esc(query)}" oninput="query=this.value;document.getElementById('results').innerHTML=offercards()"><div class="chips">${['Tất cả','Nail','Ăn uống','Chăm sóc xe'].map(c=>`<button class="${c===category?'primary':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div id="results">${offercards()}</div>`}</div></div></div>`}
function openDeal(id){const o=offers.find(o=>o.id===id);if(source==='business'&&id==='nail')return;selected=id;const paid=id!=='self'&&!paused;let counted=false;if(paid&&promo.budget>=Number(((clicks+1)*promo.cpc).toFixed(2))){if(!seen.has(id)){seen.add(id);clicks++;counted=true}else duplicates++}modal(`<span class="badge">${id==='self'?'Chương trình của tiệm':'Được tài trợ · ví dụ'}</span><h2>${esc(o.name)}</h2><h3>${id==='self'?esc(promo.title):o.title}</h3><p>${id==='self'?esc(promo.description):o.desc}</p><strong>${id==='self'?cash(promo.price):o.price}</strong><p>Điều kiện và lịch còn trống cần được xác nhận với doanh nghiệp. Chưa mua deal trong giai đoạn này.</p><div class="callout">${counted?'Đã mô phỏng 1 click hợp lệ.':id==='self'?'Lượt mở nội dung của chính tiệm không bị tính phí trong bản mẫu.':'Không phát sinh phí mới: lượt lặp, tạm dừng hoặc hết hạn mức.'}${counted&&!earn?'<br>Chủ QR chưa bật kiếm tiền: không tạo thưởng nguồn.':''}</div><p class="mini muted">Quy tắc lượt lặp ở demo: một deal chỉ ghi 1 click trong phiên. Đây chưa phải chống gian lận production.</p><button onclick="document.getElementById('dialog').close()">Quay lại danh sách</button>`);if(counted&&earn)rewardCents+=Math.round(promo.cpc*100*.5)}
const seen=new Set();let rewardCents=0;
function utility(t){modal(`<h2>${t}</h2><p>Điểm kết nối tới chức năng hiện có của doanh nghiệp. Bản phác thảo này chưa gửi check-in, booking, tip hay review thật.</p><button onclick="document.getElementById('dialog').close();screen='home';render()">⌂ Về OneQR Main Menu</button>`)}
function dashboard(){const spent=Number((clicks*promo.cpc).toFixed(2));return heading('Thấy kết quả. Hiểu tiền đi đâu.','Số liệu dưới đây đến từ thao tác thử trong phần 03, không phải dữ liệu khách thật.')+`<div class="cards">${card('Click được ghi nhận',clicks,'Đủ ngân sách và không trùng trong demo')}${card('Lượt lặp không tính phí',duplicates,'Không tăng chi phí')}${card('Chi quảng cáo',cash(spent),'Đơn giá thử '+cash(promo.cpc)+'/click')}${card('Ngân sách còn',cash(Math.max(0,promo.budget-spent)),'Hạn mức thử '+cash(promo.budget))}</div><div class="split"><div class="panel"><span class="badge">DOANH NGHIỆP CHẠY QUẢNG CÁO</span><h2>Kết quả từ hai nguồn</h2><div class="line"><span>Kênh của chính doanh nghiệp</span><b>Chưa kết nối</b></div><div class="line"><span>Mạng lưới OneQR</span><b>${clicks} click mẫu</b></div><p>Production tách hiển thị, click, gọi/chỉ đường/booking và giao dịch xác minh. Không hiển thị doanh thu giả khi chưa có POS.</p><button onclick="go(4)">Quản lý hạn mức</button></div><div class="panel"><span class="badge">CHỦ QR / NGƯỜI KIẾM TIỀN</span><h2>Thưởng từ nguồn QR</h2><div class="line"><span>Dự kiến chờ xác minh</span><b>${cash(rewardCents/100)}</b></div><div class="line"><span>Có thể nhận</span><b>$0.00</b></div><p>Tỷ lệ 50% chỉ để minh họa phép chia. Chưa là chính sách. Click phát sinh lúc tắt kiếm tiền không được cộng thưởng hồi tố.</p><div class="callout">Số lượng bản in không quyết định thu nhập; nguồn truy cập và sự kiện hợp lệ mới quyết định.</div></div></div><div class="panel"><h2>Bài học trong 30 ngày</h2><div class="flow"><div><b>Khách có quét?</b>Đếm phiên truy cập hợp lệ.</div><div><b>Khách có quan tâm?</b>Đếm mở deal và hành động.</div><div><b>Merchant có chạy tiếp?</b>Đánh giá kết quả và chi phí.</div><div><b>Chủ QR có tham gia tiếp?</b>Đánh giá thu nhập và trải nghiệm.</div></div></div>`}
function pilot(){return heading('Một mô hình để thử trước','CPC là phương án thử mới. Chưa thay thế hay kích hoạt chính sách tính phí thật.')+`<div class="split"><div class="panel"><h2>Hạn mức chiến dịch mẫu</h2><form class="form" onsubmit="budget(event)"><label>Ngân sách tổng ($)<input id="budget" type="number" min="${Math.max(.2,clicks*promo.cpc)}" step=".01" required value="${promo.budget}"></label><label>Đơn giá minh họa / click<input value="$0.20 — chưa chốt" disabled></label><button class="primary">Cập nhật hạn mức mẫu</button></form><div class="tabs"><button onclick="paused=!paused;render()">${paused?'Tiếp tục mô phỏng':'Tạm dừng mô phỏng'}</button><button onclick="resetDemo()">Đặt lại lượt thử</button></div><span class="badge">${paused?'Tạm dừng':'Đang nhận click mẫu'}</span><p class="mini muted">Không nạp tiền, không thu tiền, không tự gia hạn. Có thể thử ngân sách $0.20 để thấy click thứ hai không được tính phí.</p></div><div class="panel"><h2>Trước khi thu tiền thật</h2><div class="steps"><div class="step">Chốt đơn giá, phần chia, thời gian đối soát và điều khoản CPC riêng.</div><div class="step">Định nghĩa click hợp lệ, cửa sổ trùng, bot, tự click và xử lý khiếu nại.</div><div class="step">Kiểm tra số dư ở server, chống thu trùng và dừng khi hết hạn mức.</div><div class="step">Nghiệm thu dashboard hai phía trước pilot có trả phí.</div></div><p>Không thu thêm phí giao dịch trên cùng chiến dịch CPC nếu chưa có thỏa thuận riêng. Mua voucher trực tiếp để giai đoạn sau.</p></div></div><div class="panel"><h2>Định vị được giữ xuyên suốt</h2><p>OneQR gom nhiều menu và tiện ích vào một mã. Kiếm tiền là tùy chọn. Nearby/Search luôn có; bật kiếm tiền tăng mức nổi bật. QR doanh nghiệp lọc đối thủ dựa ngành/dịch vụ; QR cá nhân và truy cập độc lập khám phá toàn mạng.</p><p>Không xét duyệt từng nơi đặt hoặc số bản in. Người phân phối tự chịu trách nhiệm sử dụng; có xử lý báo cáo lạm dụng và thu hồi mã vi phạm.</p></div>`}
function budget(e){e.preventDefault();promo.budget=Number(document.getElementById('budget').value);render()}function resetDemo(){clicks=0;duplicates=0;rewardCents=0;seen.clear();render()}
function poster(){modal(`<div id="poster" class="poster"><small>BITCOIN NAIL BAR × ONEQR</small><h1>Tiện ích của tiệm.<br>Ưu đãi dành cho bạn.</h1><p>Check-in · Dịch vụ & giá · Đặt lịch<br>Khám phá thêm chương trình hiện có</p><div class="qrplaceholder">VỊ TRÍ QR<br>Chưa phát hành mã thật<br>Không dùng bản mẫu để dán</div><h3>Quét để bắt đầu</h3><small>Không cần cài app để xem</small></div><p class="mini muted">Bản phác thảo bố cục. Khi triển khai, hệ thống chèn QR đã kiểm tra đích đến và độ đọc.</p><button onclick="window.print()">In bố cục mẫu</button>`)}
function modal(s){document.getElementById('content').innerHTML=s;document.getElementById('dialog').showModal()}

let placements={shop:true,public:false,paid:false};
function setPlacement(k,val){placements[k]=val;if(k==='paid'&&val)placements.public=true;if(k==='public'&&!val)placements.paid=false;submitted=false;render()}
function destinations(){return [['shop','1. OneQR của tiệm','Banner trên trang sau quét + mục Promotion của tiệm. Không tính phí quảng cáo.'],['public','2. Công khai trên mạng lưới','Thẻ ưu đãi trong Nearby / Search Deals khi phù hợp; không bảo đảm vị trí đầu.'],['paid','3. Quảng bá trả phí','Banner hoặc thẻ Được tài trợ trong Nearby / Search Deals. Cần thiết lập ngân sách; vẫn lọc đối thủ.']].map(([k,t,d])=>`<div class="panel" style="margin:10px 0;padding:14px"><label style="display:flex;gap:10px"><input type="checkbox" ${placements[k]?'checked':''} onchange="setPlacement('${k}',this.checked)"><b>${t}</b></label><p>${d}</p><button onclick="previewPlacement('${k}')">Xem vị trí hiển thị →</button>${k==='paid'&&placements.paid?'<button onclick="go(4)">Thiết lập ngân sách →</button>':''}</div>`).join('')}
function previewPlacement(k){const label=k==='shop'?'OneQR của tiệm':k==='public'?'Nearby / Search Deals · công khai':'Nearby / Search Deals · được tài trợ';modal(`<h2>${label}</h2><p>${placements[k]?'Đã chọn kênh này':'Chưa chọn kênh này — chỉ xem thử'}. Nội dung minh họa, chưa phát hành.</p><div style="border:1px solid #ddd;border-radius:20px;padding:20px;max-width:420px;margin:auto;background:#faf8ff"><b>${k==='shop'?'BITCOIN NAIL BAR':'NEXORA · KHÁM PHÁ ƯU ĐÃI'}</b><p>${k==='shop'?'Giới thiệu tiệm · Nearby · Search Deals':'Tìm ưu đãi… · Tất cả · Ăn uống · Nail · Chăm sóc xe'}</p><small>${k==='shop'?'VỊ TRÍ 1 · BANNER TRÊN ONEQR':k==='public'?'VỊ TRÍ · THẺ TRONG KẾT QUẢ PHÙ HỢP':'VỊ TRÍ · BANNER / THẺ ĐƯỢC TÀI TRỢ'}</small>${k==='paid'?'<p class="badge">Được tài trợ · minh họa</p>':''}${banner()}<button onclick="previewPromotionDetail('${k}')">Xem chương trình →</button>${k==='shop'?'<p>Check-in · Đặt lịch · Dịch vụ · Tip</p><b>VỊ TRÍ 2 · MENU PROMOTION</b><p>'+esc(promo.title)+' · '+cash(promo.price)+'</p>':''}</div><p>${k==='shop'?'Khách quét QR tiệm sẽ thấy banner và tìm lại trong Promotion.':'Chỉ phân phối khi đủ điều kiện, đúng vị trí/ngành; QR doanh nghiệp khác vẫn loại đối thủ. Hình này minh họa vị trí, không cam kết lượt hiển thị.'}</p><button onclick="document.getElementById('dialog').close()">← Về chọn nơi hiển thị</button>`)}
function previewPromotionDetail(k){modal(`<h2>${esc(promo.title)}</h2>${banner()}<p>Chi tiết chương trình: ${esc(promo.description)}</p><p>Điều kiện, thời hạn và lịch trống cần merchant xác nhận. Chưa đặt lịch hoặc thanh toán thật.</p><button onclick="previewPlacement('${k}')">← Về vị trí hiển thị</button><button onclick="document.getElementById('dialog').close()">Về chọn nơi đăng</button>`)}
function render(){document.getElementById('nav').innerHTML=labels.map((s,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})">${s}</button>`).join('');document.getElementById('main').innerHTML='<div class="notice">PHÁC THẢO MỚI · Dữ liệu và giá CPC minh họa. Không kết nối production. Bản này thể hiện hướng thử nghiệm mới sau chính sách chỉ tính phí giao dịch trước đó.</div>'+[form,network,guest,dashboard,pilot][tab]();}render();
</script><script>window.addEventListener('message',e=>{if(e.source!==parent||e.data?.kind!=='pilot-section')return;if(Number.isInteger(e.data.section)&&e.data.section>=0&&e.data.section<5)go(e.data.section);});</script><style id="oq-nav">body{padding-bottom:80px!important}.oq-nav{position:fixed;bottom:0;left:0;right:0;z-index:999999;display:flex;justify-content:center;gap:8px;background:white;padding:12px;border-top:1px solid #ddd}.oq-nav button,.oq-modalnav button{font:600 13px system-ui;padding:10px;border:1px solid #ddd;border-radius:10px;color:#5935ad;background:#f2edff;cursor:pointer}.oq-modalnav{display:flex;gap:8px;margin:10px 0}@media print{.oq-nav,.oq-modalnav{display:none}}</style><nav class="oq-nav" aria-label="Điều hướng OneQR"><button onclick="oqBack()">← Quay lại</button><button onclick="oqHome()">⌂ Menu chính</button><button onclick="oqHelp()">? Hướng dẫn</button></nav><script>
function oqClose(){document.querySelectorAll('dialog[open]').forEach(d=>d.close())}
function oqHelp(){let t=Array.from(document.querySelectorAll('h1,h2')).filter(e=>e.offsetParent!==null).map(e=>e.textContent).slice(0,2).join(' · ');alert('Hướng dẫn: '+t+'\nChọn chức năng hoặc điền thông tin trên màn hình rồi kiểm tra trước khi tiếp tục.\nQuay lại: về bước trước hoặc đóng chi tiết. Menu chính: về OneQR, không cần quét lại.\nDữ liệu trong bản thử nghiệm không tạo giao dịch thật.')}
function oqHome(){oqClose();if(typeof oqLocalHome==='function')return oqLocalHome();if(parent!==window)parent.postMessage({kind:'oq-nav',action:'home'},'*');else{location.hash='';scrollTo(0,0)}}
function oqBack(){let d=document.querySelector('dialog[open]');if(d){d.close();return}if(typeof oqLocalBack==='function')return oqLocalBack();if(parent!==window)parent.postMessage({kind:'oq-nav',action:'back'},'*');else oqHome()}
function oqDecorate(){document.querySelectorAll('dialog').forEach(d=>{if(d.querySelector('.oq-modalnav'))return;let n=document.createElement('div');n.className='oq-modalnav';[['← Quay lại',()=>d.close()],['⌂ Menu chính',oqHome],['? Hướng dẫn',oqHelp]].forEach(([text,fn])=>{let b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=fn;n.append(b)});d.prepend(n)})}oqDecorate();new MutationObserver(oqDecorate).observe(document.body,{childList:true,subtree:true});
</script><script>function oqLocalHome(){screen='home';go(2)}function oqLocalBack(){if(tab===2&&screen!=='home'){screen='home';render()}else if(tab===0&&step>0){step--;render()}else oqLocalHome()}</script></body></html>
