<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Limited Access - OneQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef0f6;
      color: #0b1220;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .oneqr-scan-page {
      display: flex;
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
    }

    .oneqr-scan-banner {
      height: 92px;
      background: linear-gradient(90deg, #d0762f 0%, #de8e4d 50%, #eb632f 100%);
    }

    .oneqr-limited-icon {
      display: flex;
      width: 88px;
      height: 88px;
      margin: -44px auto 0;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.18);
      color: #de8e4d;
    }

    .oneqr-limited-icon svg {
      width: 40px;
      height: 40px;
    }

    .oneqr-limited-copy {
      margin: 20px 0 0;
      padding: 0 28px;
      text-align: center;
    }

    .oneqr-limited-copy h1 {
      margin: 0;
      color: #0b1220;
      font-size: 22px;
      font-weight: 900;
    }

    .oneqr-limited-copy p {
      margin: 8px 0 0;
      color: #6d7688;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
    }

    .oneqr-limited-actions {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      padding: 20px 20px 32px;
    }

    .oneqr-limited-btn {
      display: flex;
      width: 100%;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      border: 1px solid #e7e6f5;
      border-radius: 14px;
      background: #fff;
      color: #17182b;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .oneqr-limited-btn.is-primary {
      border-color: transparent;
      background: linear-gradient(90deg, #8b2fd0 0%, #6d4de0 50%, #2f6feb 100%);
      box-shadow: 0 10px 22px rgba(109, 77, 224, 0.24);
      color: #fff;
    }

    .oneqr-limited-btn.is-link {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      color: #6d7688;
    }
  </style>
</head>
<body>
  <main class="oneqr-scan-page">
    <header class="oneqr-scan-banner"></header>

    <div class="oneqr-limited-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </div>

    <div class="oneqr-limited-copy">
      <h1>Limited Access</h1>
      <p>This feature needs a verified identity or extra permission from Bitcoin Nail Bar. Verify to continue, or request access from staff.</p>
    </div>

    <div class="oneqr-limited-actions">
      <a class="oneqr-limited-btn is-primary" id="oneqrLimitedVerify" href="oneqr-otp.html">Verify Identity</a>
      <button class="oneqr-limited-btn" type="button" id="oneqrLimitedRequest">Request Access</button>
      <a class="oneqr-limited-btn is-link" id="oneqrLimitedHome" href="oneqr-landing.html">Return Home</a>
    </div>
  </main>

  <script>
    (function () {
      var params = new URL(window.location.href).searchParams;
      var returnUrl = params.get('return') || 'oneqr-landing.html';

      document.getElementById('oneqrLimitedVerify').href = 'oneqr-otp.html?return=' + encodeURIComponent(returnUrl);
      document.getElementById('oneqrLimitedHome').href = returnUrl;

      document.getElementById('oneqrLimitedRequest').addEventListener('click', function (event) {
        var btn = event.currentTarget;
        var original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Request sent';
        setTimeout(function () {
          btn.textContent = original;
          btn.disabled = false;
        }, 1800);
      });
    })();
  </script>
</body>
</html>
