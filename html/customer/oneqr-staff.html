<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Staff Portal - OneQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/oneqr-header.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef0f6;
      color: #0b1220;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .oneqr-scan-page {
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
    }


    .oneqr-scan-welcome {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 20px 20px;
      border-radius: 14px;
      background: #f1edfc;
      padding: 12px 14px;
      color: #4a3aa0;
      font-size: 13px;
      font-weight: 700;
    }

    .oneqr-scan-welcome-icon {
      display: flex;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #fff;
      color: #6d4de0;
    }

    .oneqr-scan-welcome-icon svg {
      width: 15px;
      height: 15px;
    }

    .oneqr-scan-welcome strong {
      display: block;
      color: #0b1220;
      font-size: 15px;
      font-weight: 900;
    }

    .oneqr-scan-welcome small {
      display: block;
      margin-top: 2px;
      color: #6d7688;
      font-size: 12px;
      font-weight: 600;
    }

    .oneqr-scan-menu {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 20px 20px;
    }

    .oneqr-scan-item {
      appearance: none;
      display: flex;
      flex: 0 0 calc(50% - 6px);
      min-height: 92px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #e7e6f5;
      border-radius: 16px;
      background: #fff;
      padding: 14px 10px;
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      text-align: center;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .oneqr-scan-item:hover {
      border-color: #cabdf7;
      box-shadow: 0 10px 22px rgba(109, 77, 224, 0.14);
      transform: translateY(-1px);
    }

    .oneqr-scan-item.is-active {
      border-color: #6d4de0;
      box-shadow: 0 10px 22px rgba(109, 77, 224, 0.18);
    }

    .oneqr-scan-item[aria-pressed="true"] {
      border-color: #6d4de0;
      box-shadow: 0 10px 22px rgba(109, 77, 224, 0.18);
    }

    .oneqr-scan-icon {
      display: flex;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #f1edfc;
      color: #6d4de0;
    }

    .oneqr-scan-icon svg {
      width: 17px;
      height: 17px;
    }

    .oneqr-scan-item span:last-child {
      color: #17182b;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: capitalize;
    }

    .oneqr-staff-status {
      margin: 0 20px 18px;
      border: 1px solid #e7e6f5;
      border-radius: 16px;
      background: #fafaff;
      padding: 15px;
    }

    .oneqr-staff-status-kicker {
      margin: 0 0 6px;
      color: #6d4de0;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .oneqr-staff-status h2 {
      margin: 0;
      color: #0b1220;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .oneqr-staff-status p:last-of-type {
      margin: 6px 0 0;
      color: #596579;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }

    .oneqr-staff-activity {
      display: grid;
      gap: 6px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .oneqr-staff-activity li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 10px;
      background: #fff;
      padding: 8px 10px;
      color: #4a5568;
      font-size: 12px;
      font-weight: 700;
    }

    .oneqr-staff-activity time {
      flex: 0 0 auto;
      color: #8792a2;
      font-size: 11px;
      font-weight: 800;
    }

    .oneqr-staff-panel {
      margin: 0 20px 32px;
      border-radius: 16px;
      border: 1px solid #e7e6f5;
      background: #fafaff;
      padding: 16px;
    }

    .oneqr-staff-panel[hidden] {
      display: none;
    }

    .oneqr-staff-panel-title {
      margin: 0 0 12px;
      color: #0b1220;
      font-size: 13px;
      font-weight: 800;
    }

    .oneqr-staff-choices {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
    }

    .oneqr-staff-choice {
      display: flex;
      flex: 0 0 calc(50% - 6px);
      min-height: 84px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      border: 1px solid #e7e6f5;
      border-radius: 14px;
      background: #fff;
      padding: 14px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }

    .oneqr-staff-choice:hover {
      border-color: #cabdf7;
    }

    .oneqr-staff-choice.is-selected,
    .oneqr-staff-choice[aria-pressed="true"] {
      border-color: #6d4de0;
      box-shadow: 0 10px 22px rgba(109, 77, 224, 0.12);
    }

    .oneqr-staff-choice-num {
      display: flex;
      width: 26px;
      height: 26px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f1edfc;
      color: #6d4de0;
      font-size: 13px;
      font-weight: 800;
    }

    .oneqr-staff-choice span:last-child {
      color: #17182b;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="oneqr-scan-page">
    <div data-oneqr-header data-back-href="oneqr-landing.html"></div>
    <script src="../assets/oneqr-header.js"></script>

    <div class="oneqr-scan-welcome">
      <span class="oneqr-scan-welcome-icon"><i data-lucide="sparkles" aria-hidden="true"></i></span>
      <span>
        <strong id="oneqrStaffName">Hi Chloe</strong>
        <small>Shift 10:00 AM&ndash;7:00 PM</small>
      </span>
    </div>

    <section class="oneqr-staff-status" id="oneqrStaffStatus" aria-live="polite">
      <p class="oneqr-staff-status-kicker">Current action</p>
      <h2 id="oneqrStaffActionTitle">Ready for staff action</h2>
      <p id="oneqrStaffActionMessage">Clock in, receive a customer, or request approval from this staff portal.</p>
      <ul class="oneqr-staff-activity" id="oneqrStaffActivityList" aria-label="Recent staff activity"></ul>
    </section>

    <nav class="oneqr-scan-menu" aria-label="Staff quick actions">
      <button class="oneqr-scan-item" type="button" data-staff-action="clock-in" aria-pressed="false">
        <span class="oneqr-scan-icon"><i data-lucide="check-circle-2" aria-hidden="true"></i></span>
        <span data-staff-label>Clock-in</span>
      </button>
      <button class="oneqr-scan-item" type="button" data-staff-action="turn">
        <span class="oneqr-scan-icon"><i data-lucide="user-cog" aria-hidden="true"></i></span>
        <span data-staff-label>Turn 2</span>
      </button>
      <button class="oneqr-scan-item" type="button" id="oneqrReceiveCustomerBtn" data-staff-action="receive-customer" aria-expanded="false" aria-controls="oneqrReceiveCustomerPanel">
        <span class="oneqr-scan-icon"><i data-lucide="check" aria-hidden="true"></i></span>
        <span>Receive Customer</span>
      </button>
      <button class="oneqr-scan-item" type="button" data-staff-action="complete-service">
        <span class="oneqr-scan-icon"><i data-lucide="star" aria-hidden="true"></i></span>
        <span>Complete Service</span>
      </button>
      <button class="oneqr-scan-item" type="button" data-staff-action="tip">
        <span class="oneqr-scan-icon"><i data-lucide="dollar-sign" aria-hidden="true"></i></span>
        <span>Tip</span>
      </button>
      <button class="oneqr-scan-item" type="button" data-staff-action="request-approval">
        <span class="oneqr-scan-icon"><i data-lucide="external-link" aria-hidden="true"></i></span>
        <span>Request Approval</span>
      </button>
    </nav>

    <div class="oneqr-staff-panel" id="oneqrReceiveCustomerPanel" hidden>
      <p class="oneqr-staff-panel-title">How is this customer arriving?</p>
      <div class="oneqr-staff-choices">
        <button class="oneqr-staff-choice" type="button" data-choice="Appointment">
          <span class="oneqr-staff-choice-num">1</span>
          <span>Appointment</span>
        </button>
        <button class="oneqr-staff-choice" type="button" data-choice="Walk-in">
          <span class="oneqr-staff-choice-num">2</span>
          <span>Walk-in</span>
        </button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = 'taxiq:oneqr-staff-state';
      var DEFAULT_STATE = {
        clockedIn: false,
        turnNumber: 2,
        arrivalType: '',
        activeService: false,
        approvalStatus: '',
        lastTitle: 'Ready for staff action',
        lastMessage: 'Clock in, receive a customer, or request approval from this staff portal.',
        activity: []
      };

      function readState() {
        try {
          var saved = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || '{}');
          return {
            clockedIn: Boolean(saved.clockedIn),
            turnNumber: Number(saved.turnNumber) > 0 ? Number(saved.turnNumber) : DEFAULT_STATE.turnNumber,
            arrivalType: typeof saved.arrivalType === 'string' ? saved.arrivalType : '',
            activeService: Boolean(saved.activeService),
            approvalStatus: typeof saved.approvalStatus === 'string' ? saved.approvalStatus : '',
            lastTitle: typeof saved.lastTitle === 'string' && saved.lastTitle ? saved.lastTitle : DEFAULT_STATE.lastTitle,
            lastMessage: typeof saved.lastMessage === 'string' && saved.lastMessage ? saved.lastMessage : DEFAULT_STATE.lastMessage,
            activity: Array.isArray(saved.activity) ? saved.activity.slice(0, 4) : []
          };
        } catch (error) {
          return {
            clockedIn: DEFAULT_STATE.clockedIn,
            turnNumber: DEFAULT_STATE.turnNumber,
            arrivalType: DEFAULT_STATE.arrivalType,
            activeService: DEFAULT_STATE.activeService,
            approvalStatus: DEFAULT_STATE.approvalStatus,
            lastTitle: DEFAULT_STATE.lastTitle,
            lastMessage: DEFAULT_STATE.lastMessage,
            activity: []
          };
        }
      }

      function saveState() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) { /* storage unavailable */ }
      }

      function setText(id, value) {
        var element = document.getElementById(id);
        if (element) element.textContent = value;
      }

      function nowLabel() {
        return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }

      function addActivity(label) {
        state.activity.unshift({ label: label, time: nowLabel() });
        state.activity = state.activity.slice(0, 4);
      }

      function showStatus(title, message, activityLabel) {
        state.lastTitle = title;
        state.lastMessage = message;
        if (activityLabel) addActivity(activityLabel);
        renderStatus();
        saveState();
      }

      function renderStatus() {
        setText('oneqrStaffActionTitle', state.lastTitle);
        setText('oneqrStaffActionMessage', state.lastMessage);

        var list = document.getElementById('oneqrStaffActivityList');
        if (list) {
          var items = state.activity.map(function (entry) {
            var item = document.createElement('li');
            var label = document.createElement('span');
            var time = document.createElement('time');
            label.textContent = entry.label;
            time.textContent = entry.time;
            item.append(label, time);
            return item;
          });
          list.replaceChildren.apply(list, items);
        }
      }

      function setButtonStates() {
        document.querySelectorAll('[data-staff-action]').forEach(function (control) {
          var action = control.dataset.staffAction;
          var label = control.querySelector ? control.querySelector('[data-staff-label]') : null;
          var pressed = action === 'clock-in' && state.clockedIn;

          if (action === 'clock-in' && label) label.textContent = state.clockedIn ? 'Clock-out' : 'Clock-in';
          if (action === 'turn' && label) label.textContent = 'Turn ' + state.turnNumber;

          control.classList.toggle('is-active', pressed);
          if (action === 'clock-in') control.setAttribute('aria-pressed', String(pressed));
        });

        document.querySelectorAll('.oneqr-staff-choice').forEach(function (choice) {
          var selected = choice.dataset.choice === state.arrivalType;
          choice.classList.toggle('is-selected', selected);
          choice.setAttribute('aria-pressed', String(selected));
        });
      }

      function openReceivePanel() {
        var receiveBtn = document.getElementById('oneqrReceiveCustomerBtn');
        var panel = document.getElementById('oneqrReceiveCustomerPanel');
        if (!receiveBtn || !panel) return;

        var expanded = receiveBtn.getAttribute('aria-expanded') === 'true';
        var nextExpanded = !expanded;
        receiveBtn.setAttribute('aria-expanded', String(nextExpanded));
        receiveBtn.classList.toggle('is-active', nextExpanded);
        panel.hidden = !nextExpanded;
        if (nextExpanded) {
          panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          showStatus('Choose arrival type', 'Select Appointment or Walk-in to attach the next customer to your station.');
        } else {
          showStatus('Receive customer closed', 'Customer intake is hidden. Open it again when the next guest arrives.');
        }
      }

      function handleStaffAction(action) {
        if (action === 'clock-in') {
          state.clockedIn = !state.clockedIn;
          setButtonStates();
          showStatus(
            state.clockedIn ? 'Clocked in' : 'Clocked out',
            state.clockedIn ? 'Your shift is active and ready for assigned services.' : 'Your shift is paused for this demo.',
            state.clockedIn ? 'Clocked in' : 'Clocked out'
          );
          return;
        }

        if (action === 'turn') {
          state.turnNumber += 1;
          setButtonStates();
          showStatus('Turn updated', 'You are now on turn ' + state.turnNumber + '.', 'Turn ' + state.turnNumber);
          return;
        }

        if (action === 'receive-customer') {
          openReceivePanel();
          return;
        }

        if (action === 'complete-service') {
          if (!state.activeService) {
            showStatus('No active service', 'Receive a customer before marking a service complete.');
            return;
          }
          state.activeService = false;
          state.arrivalType = '';
          setButtonStates();
          showStatus('Service completed', 'Ticket marked complete. The customer can continue to tip and review.', 'Service completed');
          return;
        }

        if (action === 'tip') {
          showStatus('Tip prompt ready', 'Show the customer this OneQR so they can choose Tip & Pay from their phone.', 'Tip prompt opened');
          return;
        }

        if (action === 'request-approval') {
          state.approvalStatus = 'pending';
          showStatus('Approval requested', 'Discount approval was sent to the owner queue. Status: pending.', 'Approval pending');
        }
      }

      var state = readState();
      var nameEl = document.getElementById('oneqrStaffName');
      try {
        var name = (window.localStorage.getItem('taxiq:customer-name') || '').trim();
        if (name && nameEl) nameEl.textContent = 'Hi ' + name;
      } catch (error) { /* storage unavailable */ }

      document.querySelectorAll('[data-staff-action]').forEach(function (control) {
        control.addEventListener('click', function () {
          handleStaffAction(control.dataset.staffAction);
        });
      });

      document.querySelectorAll('.oneqr-staff-choice').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.arrivalType = btn.dataset.choice || '';
          state.activeService = true;
          var receiveBtn = document.getElementById('oneqrReceiveCustomerBtn');
          if (receiveBtn) receiveBtn.classList.remove('is-active');
          setButtonStates();
          showStatus('Customer received', state.arrivalType + ' customer assigned to your station.', state.arrivalType + ' customer received');
        });
      });

      renderStatus();
      setButtonStates();

      var iconApi = window.lucide || (typeof lucide !== 'undefined' ? lucide : null);
      if (iconApi && typeof iconApi.createIcons === 'function') iconApi.createIcons();
    })();
  </script>
</body>
</html>
