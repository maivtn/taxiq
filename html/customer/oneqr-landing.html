<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bitcoin Nail Bar - OneQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/oneqr-header.css">
  <link rel="stylesheet" href="../assets/oneqr-experience.css?v=1">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #0b1220;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .oneqr-scan-page {
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    .oneqr-scan-welcome {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 20px 14px;
      border-radius: 14px;
      background: #f1edfc;
      padding: 12px 14px;
      color: #4a3aa0;
      font-size: 13px;
      font-weight: 700;
    }

    .oneqr-scan-welcome[hidden] {
      display: none;
    }

    .oneqr-scan-welcome-icon {
      display: flex;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #fff;
      color: #6d4de0;
    }

    .oneqr-scan-welcome-icon svg {
      width: 15px;
      height: 15px;
    }

    .oneqr-scan-welcome p {
      margin: 0;
    }

    .oneqr-scan-menu {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
      padding: 20px 20px 32px;
    }

    .oneqr-scan-item {
      display: flex;
      flex: 0 0 calc(50% - 6px);
      min-height: 92px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #e7e6f5;
      border-radius: 16px;
      background: #fff;
      padding: 14px 10px;
      color: inherit;
      text-align: center;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .oneqr-scan-item:hover {
      border-color: #cabdf7;
      box-shadow: 0 10px 22px rgba(109, 77, 224, 0.14);
      transform: translateY(-1px);
    }

    .oneqr-scan-icon {
      display: flex;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #f1edfc;
      color: #6d4de0;
    }

    .oneqr-scan-icon svg {
      width: 17px;
      height: 17px;
    }

    .oneqr-scan-item span:last-child {
      color: #17182b;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: capitalize;
    }

    .oneqr-scan-footer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0 20px 20px;
      border-top: 1px solid #e7e6f5;
      padding: 14px 0 0;
    }

    .oneqr-scan-footer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #4a5568;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
    }

    .oneqr-scan-footer-icon {
      display: flex;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      color: #6d4de0;
    }

    .oneqr-scan-footer-icon svg {
      width: 13px;
      height: 13px;
    }
  </style>
</head>
<body>
  <main class="oneqr-scan-page" data-oneqr-public>
    <div data-oneqr-header></div>
    <script src="../assets/oneqr-header.js"></script>

    <div class="oneqr-scan-welcome" id="oneqrWelcome" hidden>
      <span class="oneqr-scan-welcome-icon"><i data-lucide="sparkles" aria-hidden="true"></i></span>
      <p>Welcome back, <strong id="oneqrWelcomeName"></strong> &#128075;</p>
    </div>

    <div class="oneqr-public-actions" aria-label="Business contact actions">
      <button type="button" data-oneqr-action="call"><i data-lucide="phone" aria-hidden="true"></i>Call</button>
      <button type="button" data-oneqr-action="text"><i data-lucide="message-square" aria-hidden="true"></i>Text</button>
      <button type="button" data-oneqr-action="save"><i data-lucide="contact-round" aria-hidden="true"></i>Save contact</button>
      <button type="button" data-oneqr-action="wallet"><i data-lucide="wallet-cards" aria-hidden="true"></i>Add to Wallet</button>
      <button type="button" data-oneqr-action="directions"><i data-lucide="navigation" aria-hidden="true"></i>Directions</button>
      <button type="button" data-oneqr-action="exchange"><i data-lucide="user-plus" aria-hidden="true"></i>Send yours</button>
      <button type="button" data-oneqr-action="share"><i data-lucide="share-2" aria-hidden="true"></i>Share card</button>
    </div>
    <nav class="oneqr-scan-menu" aria-label="Business quick links">
      <a class="oneqr-scan-item" href="booking.html">
        <span class="oneqr-scan-icon"><i data-lucide="calendar-check" aria-hidden="true"></i></span>
        <span>Book Appointment</span>
      </a>
      <a class="oneqr-scan-item" href="check-in-mobile.html">
        <span class="oneqr-scan-icon"><i data-lucide="check" aria-hidden="true"></i></span>
        <span>Smart Check-in</span>
      </a>
      <a class="oneqr-scan-item" href="../menu/menu.html">
        <span class="oneqr-scan-icon"><i data-lucide="list" aria-hidden="true"></i></span>
        <span>Services &amp; Prices</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="percent" aria-hidden="true"></i></span>
        <span>Today&rsquo;s Promotion</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="dollar-sign" aria-hidden="true"></i></span>
        <span>Tip &amp; Pay</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="star" aria-hidden="true"></i></span>
        <span>Leave a Google Review</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="gift" aria-hidden="true"></i></span>
        <span>Rewards</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="crown" aria-hidden="true"></i></span>
        <span>Membership</span>
      </a>
      <a class="oneqr-scan-item" href="oneqr-otp.html?return=oneqr-staff.html">
        <span class="oneqr-scan-icon"><i data-lucide="user-cog" aria-hidden="true"></i></span>
        <span>Staff Portal</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="bot" aria-hidden="true"></i></span>
        <span>AI Assistant</span>
      </a>
    </nav>

    <footer class="oneqr-public-details">
      <section class="oneqr-about" data-oneqr-about aria-label="About this page"></section>
      <button class="oneqr-home-button" type="button" data-oneqr-action="home"><i data-lucide="circle-plus" aria-hidden="true"></i>Add to Home Screen</button>
      <p class="oneqr-page-feedback" data-oneqr-feedback role="status" aria-live="polite"></p>
      <small><span data-oneqr-page-url></span> · QR &amp; NFC</small>
    </footer>
  </main>

  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
  <script src="../assets/oneqr-experience.js?v=1"></script>
  <script>
    (function () {
      var welcomeEl = document.getElementById('oneqrWelcome');
      var nameEl = document.getElementById('oneqrWelcomeName');
      if (!welcomeEl || !nameEl) return;
      var name = '';
      try {
        name = (window.localStorage.getItem('taxiq:customer-name') || '').trim();
      } catch (error) {
        name = '';
      }
      if (name) {
        nameEl.textContent = name;
        welcomeEl.hidden = false;
      }
    })();

    lucide.createIcons();
  </script>
</body>
</html>
