<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bitcoin Nail Bar - OneQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef0f6;
      color: #0b1220;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .oneqr-scan-page {
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
    }

    .oneqr-scan-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e7e6f5;
      padding: 14px 20px;
    }

    .oneqr-scan-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .oneqr-scan-mark {
      display: flex;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #8b2fd0 0%, #6d4de0 50%, #2f6feb 100%);
    }

    .oneqr-scan-mark img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .oneqr-scan-brand-name {
      color: #0b1220;
      font-size: 16px;
      font-weight: 900;
    }

    .oneqr-scan-intro p {
      margin: 4px 0 0;
      color: #6d7688;
      font-size: 13px;
      font-weight: 600;
    }

    .oneqr-scan-welcome {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 20px 14px;
      border-radius: 14px;
      background: #f1edfc;
      padding: 12px 14px;
      color: #4a3aa0;
      font-size: 13px;
      font-weight: 700;
    }

    .oneqr-scan-welcome[hidden] {
      display: none;
    }

    .oneqr-scan-welcome-icon {
      display: flex;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #fff;
      color: #6d4de0;
    }

    .oneqr-scan-welcome-icon svg {
      width: 15px;
      height: 15px;
    }

    .oneqr-scan-welcome p {
      margin: 0;
    }

    .oneqr-scan-menu {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 20px 32px;
    }

    .oneqr-scan-item {
      display: flex;
      flex: 0 0 calc(50% - 6px);
      min-height: 92px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #e7e6f5;
      border-radius: 16px;
      background: #fff;
      padding: 14px 10px;
      color: inherit;
      text-align: center;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .oneqr-scan-item:hover {
      border-color: #cabdf7;
      box-shadow: 0 10px 22px rgba(109, 77, 224, 0.14);
      transform: translateY(-1px);
    }

    .oneqr-scan-icon {
      display: flex;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #f1edfc;
      color: #6d4de0;
    }

    .oneqr-scan-icon svg {
      width: 17px;
      height: 17px;
    }

    .oneqr-scan-item span:last-child {
      color: #17182b;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: capitalize;
    }

    .oneqr-scan-footer {
      margin: 0 20px 28px;
      border-top: 1px solid #e7e6f5;
      padding: 16px 0 0;
      text-align: center;
    }

    .oneqr-scan-footer p {
      margin: 4px 0 0;
      color: #6d7688;
      font-size: 12px;
      font-weight: 600;
    }

    .oneqr-scan-footer p:first-child {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <main class="oneqr-scan-page">
    <header class="oneqr-scan-top">
      <div class="oneqr-scan-brand">
        <span class="oneqr-scan-mark"><img src="../pages/assets/icon-nexora.png" alt="Nexora Touch"></span>
        <span class="oneqr-scan-brand-name">Bitcoin Nail Bar</span>
      </div>
    </header>

    <div class="oneqr-scan-welcome" id="oneqrWelcome" hidden>
      <span class="oneqr-scan-welcome-icon"><i data-lucide="sparkles" aria-hidden="true"></i></span>
      <p>Welcome back, <strong id="oneqrWelcomeName"></strong> &#128075;</p>
    </div>

    <nav class="oneqr-scan-menu" aria-label="Bitcoin Nail Bar quick links">
      <a class="oneqr-scan-item" href="booking.html">
        <span class="oneqr-scan-icon"><i data-lucide="calendar-check" aria-hidden="true"></i></span>
        <span>Book Appointment</span>
      </a>
      <a class="oneqr-scan-item" href="check-in-mobile.html">
        <span class="oneqr-scan-icon"><i data-lucide="check" aria-hidden="true"></i></span>
        <span>Smart Check-in</span>
      </a>
      <a class="oneqr-scan-item" href="../menu/menu.html">
        <span class="oneqr-scan-icon"><i data-lucide="list" aria-hidden="true"></i></span>
        <span>Services &amp; Prices</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="percent" aria-hidden="true"></i></span>
        <span>Today&rsquo;s Promotion</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="dollar-sign" aria-hidden="true"></i></span>
        <span>Tip &amp; Pay</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="star" aria-hidden="true"></i></span>
        <span>Leave a Google Review</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="gift" aria-hidden="true"></i></span>
        <span>Rewards</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="crown" aria-hidden="true"></i></span>
        <span>Membership</span>
      </a>
      <a class="oneqr-scan-item" href="oneqr-otp.html?return=oneqr-staff.html">
        <span class="oneqr-scan-icon"><i data-lucide="user-cog" aria-hidden="true"></i></span>
        <span>Staff Portal</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="bot" aria-hidden="true"></i></span>
        <span>AI Assistant</span>
      </a>
    </nav>

    <footer class="oneqr-scan-footer">
      <p>9793 Westheimer Rd Suite A, Houston, TX 77042</p>
      <p>9:30 AM&ndash;7:00 PM</p>
      <p>11:00 AM&ndash;5:00 PM</p>
    </footer>
  </main>

  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
  <script>
    (function () {
      var welcomeEl = document.getElementById('oneqrWelcome');
      var nameEl = document.getElementById('oneqrWelcomeName');
      if (!welcomeEl || !nameEl) return;
      var name = '';
      try {
        name = (window.localStorage.getItem('taxiq:customer-name') || '').trim();
      } catch (error) {
        name = '';
      }
      if (name) {
        nameEl.textContent = name;
        welcomeEl.hidden = false;
      }
    })();

    lucide.createIcons();
  </script>
</body>
</html>
