<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bitcoin Nail Bar - OneQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef0f6;
      color: #0b1220;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .oneqr-scan-page {
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
    }

    .oneqr-scan-banner {
      height: 92px;
      background: linear-gradient(90deg, #8b2fd0 0%, #6d4de0 50%, #2f6feb 100%);
    }

    .oneqr-scan-tag {
      margin: 0;
      padding: 18px 22px 0;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .oneqr-scan-badge {
      display: flex;
      width: 76px;
      height: 76px;
      margin: -38px auto 0;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.18);
    }

    .oneqr-scan-badge img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .oneqr-scan-intro {
      margin: 14px 0 20px;
      padding: 0 24px;
      text-align: center;
    }

    .oneqr-scan-intro h1 {
      margin: 0;
      color: #0b1220;
      font-size: 21px;
      font-weight: 900;
    }

    .oneqr-scan-intro p {
      margin: 4px 0 0;
      color: #6d7688;
      font-size: 13px;
      font-weight: 600;
    }

    .oneqr-scan-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 20px 32px;
    }

    .oneqr-scan-item {
      display: flex;
      min-height: 56px;
      align-items: center;
      gap: 12px;
      border: 1px solid #e7e6f5;
      border-radius: 16px;
      background: #fff;
      padding: 0 16px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .oneqr-scan-item:hover {
      border-color: #cabdf7;
      box-shadow: 0 10px 22px rgba(109, 77, 224, 0.14);
      transform: translateY(-1px);
    }

    .oneqr-scan-icon {
      display: flex;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #f1edfc;
      color: #6d4de0;
    }

    .oneqr-scan-icon svg {
      width: 17px;
      height: 17px;
    }

    .oneqr-scan-item span:last-child {
      color: #17182b;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="oneqr-scan-page">
    <header class="oneqr-scan-banner">
      <p class="oneqr-scan-tag">One QR &middot; Every Connection</p>
    </header>

    <div class="oneqr-scan-badge">
      <img src="../pages/assets/icon-nexora.png" alt="Nexora Touch">
    </div>

    <div class="oneqr-scan-intro">
      <h1>Bitcoin Nail Bar</h1>
      <p>Houston&rsquo;s modern nail &amp; beauty destination</p>
    </div>

    <nav class="oneqr-scan-menu" aria-label="Bitcoin Nail Bar quick links">
      <a class="oneqr-scan-item" href="booking.html">
        <span class="oneqr-scan-icon"><i data-lucide="calendar-check" aria-hidden="true"></i></span>
        <span>Book Appointment</span>
      </a>
      <a class="oneqr-scan-item" href="https://pos-nexoratouch.vercel.app/mockups/phase1/check-in-mobile.html">
        <span class="oneqr-scan-icon"><i data-lucide="check" aria-hidden="true"></i></span>
        <span>Smart Check-in</span>
      </a>
      <a class="oneqr-scan-item" href="../menu/menu.html">
        <span class="oneqr-scan-icon"><i data-lucide="list" aria-hidden="true"></i></span>
        <span>Services &amp; Prices</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="percent" aria-hidden="true"></i></span>
        <span>Today&rsquo;s Promotion</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="dollar-sign" aria-hidden="true"></i></span>
        <span>Tip &amp; Pay</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="star" aria-hidden="true"></i></span>
        <span>Leave a Google Review</span>
      </a>
      <a class="oneqr-scan-item" href="#">
        <span class="oneqr-scan-icon"><i data-lucide="share-2" aria-hidden="true"></i></span>
        <span>Social Media</span>
      </a>
    </nav>
  </main>

  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
