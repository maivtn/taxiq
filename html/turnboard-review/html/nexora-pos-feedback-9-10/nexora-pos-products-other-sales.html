  function validate(){if(digits(state.phone).length!==10)return 'Enter a 10-digit customer phone number.';if(!['existing','new','ticket'].includes(state.customerStatus))return 'Find the customer by phone first.';if(!state.customerName.trim())return 'Enter the new customer’s name.';if(!allServices().length)return 'Add at least one main service.';if(state.groups.some(g=>!g.tech))return 'Select a technician for each group.';if(state.groups.some(g=>g.services.some(s=>s.coTech&&s.coTech===g.tech)))return 'The shared technician must be different from the primary technician.';if(state.groups.some(g=>!g.services.length&&!g.extras.length))return 'Add work for each technician, or remove the empty group.';if(allItems().some(i=>!i.name.trim()))return 'Name each custom service or add-on.';if(state.groups.some(g=>g.extras.some(a=>!allServices().some(s=>s.uid===Number(a.parentUid)))))return 'Link each add-on by another technician to a main service.';if(allItems().some(i=>!Number.isFinite(Number(i.price))||Number(i.price)<0))return 'Enter valid prices.';if(allItems().some(i=>!Number.isFinite(Number(i.discountValue))||Number(i.discountValue)<0||itemDiscount(i)>Number(i.price)||i.discountMode==='percent'&&Number(i.discountValue)>100||i.discountMode==='amount'&&Number(i.discountValue)>Number(i.price)))return 'Service discounts cannot exceed the item price or 100%.';if(Number(state.discount)>subtotal())return 'Order discount cannot exceed the discounted service total.';if(state.payment==='split'&&(Number(state.creditPortion)<=0||Number(state.creditPortion)>=serviceDue()))return 'For Split Pay, enter a Credit Card service portion greater than $0 and less than the service total.';if(state.payment==='split'&&(!Number.isFinite(Number(state.splitCashPortion))||Number(state.splitCashPortion)<0||state.splitOtherMethod==='cash'&&Number(state.splitCashPortion)>0||Number(state.splitCashPortion)>=serviceDue()-cardBase('split')))return 'Cash portion must leave a positive amount for the other method.';if(tipRemainingCents()!==0)return 'Allocate the full guest tip across the technicians.';if(!serviceWalletConfirmed())return 'Wait for the customer wallet payment to be confirmed.';if(giftNeeded()>0&&Number(state.giftCardBalances[String(state.giftCardCode||'').trim().toUpperCase()]||0)+.001<giftNeeded())return 'Enter a demo gift card with enough balance.';return ''}
  function approvalChangesHtml(){const rows=[];if(Number(state.discount)>0)rows.push(`<span>Order discount</span><strong>−${money(state.discount)}</strong>`);allItems().forEach(item=>{if(item.custom)rows.push(`<span>Custom item · ${esc(item.name)}</span><strong>${money(item.price)}</strong>`);else if(Number(item.price)!==Number(item.originalPrice))rows.push(`<span>${esc(item.name)} · price changed</span><strong>${money(item.originalPrice)} → ${money(item.price)}</strong>`);if(itemDiscount(item)>0)rows.push(`<span>${esc(item.name)} · discount</span><strong>−${money(itemDiscount(item))}</strong>`)});return `<div class="approval-changes"><b>Changes requiring approval</b><div>${rows.map(row=>`<div>${row}</div>`).join('')}</div><p>Total after changes · ${money(total())}</p></div>`}
  function roleLoginHtml(){const ownerRequired=['accessrules','salonsettings'].includes(state.pendingNav);return `<div class="modal-backdrop"><div class="modal auth-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><p class="eyebrow">POS ACCOUNT</p><h2 id="modal-title">${ownerRequired?'Enter Owner Mode':'Sign in with PIN'}</h2><p class="muted">${ownerRequired?'Only the salon owner can configure approval rules and payment fees.':'Choose your individual manager or owner account for this workstation.'}</p></div><button type="button" class="modal-close" data-action="close-modal" aria-label="Close">${icon('x')}</button></div><div class="auth-role-options" role="group" aria-label="Account role">${ownerRequired?'':`<button type="button" class="${state.loginRole==='manager'?'selected':''}" data-action="choose-login-role" data-value="manager" aria-pressed="${state.loginRole==='manager'}">Manager</button>`}<button type="button" class="${state.loginRole==='owner'?'selected':''}" data-action="choose-login-role" data-value="owner" aria-pressed="${state.loginRole==='owner'}">Owner</button></div><label class="auth-pin-label" for="role-pin">${roleLabel(state.loginRole)} PIN</label><input class="input auth-pin-input" id="role-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="4–6 digits" value="${esc(state.pinValue)}"><p class="auth-pin-error" role="status">${esc(state.pinError)}</p><p class="auth-demo-note">Prototype preview: any 4–6 digits work. Production must verify an individual account and PIN on the server, then end Owner Mode after inactivity.</p><div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="use-frontdesk">Use Front Desk</button><button type="button" class="btn btn-primary" data-action="confirm-role-login">${ownerRequired?'Enter Owner Mode':`Sign in as ${roleLabel(state.loginRole)}`}</button></div></div></div>`}

  function pinApprovalHtml(){const ownerOnly=state.pinContext==='save-card-fee',privateView=['reveal-contact','view-notes'].includes(state.pinContext),subject=state.approvalSubject,detail=ownerOnly?`Accept: ${state.settingsDraftPaymentMethods.map(id=>esc(draftPaymentCatalog().find(([key])=>key===id)?.[1]||id)).join(', ')}. Overrides: ${Object.entries(state.settingsDraftMethodDiscounts).filter(([id,rule])=>state.settingsDraftPaymentMethods.includes(id)&&['percent','amount'].includes(rule.type)).map(([id,rule])=>esc(draftPaymentCatalog().find(([key])=>key===id)?.[1]||id)+' '+esc(rule.value)+(rule.type==='percent'?'%':' dollars')).join(', ')||'none'}. Credit Card fee ${state.settingsDraftEnabled?esc(state.settingsDraftPercent)+'%':'disabled'}, wallet discount ${state.settingsDraftWalletEnabled?esc(state.settingsDraftWalletPercent)+'% on '+state.settingsDraftWalletMethods.map(id=>paymentLabel(id)).join(', '):'disabled'}, default tip split ${esc(state.tipSplitDraft)}.`:privateView?`Approve ${state.pinContext==='reveal-contact'?'full contact details':'private notes'} for ${esc(subject?.name||'customer')} (${esc(maskPhone(subject?.phone))}). This approval is for one record and expires after 30 seconds.`:state.pinContext==='cancel-ticket'?`Approve cancellation of ticket #${state.cancelTicketId}. Reason: ${esc(state.cancelReason)}.${state.cancelReleaseTurn?' Uncompleted turn credits return to the queue.':''}`:state.pinContext==='refund-demo'?`Approve demo refund of ${money(Number(state.refundAmount)||0)} on receipt ${esc(state.refundReceiptId)}. Reason: ${esc(state.refundReason)}. No live money moves.`:state.pinContext==='sale-complete'?`Approve ${esc(saleDraft().lines.length)} sale items for ${esc(saleDraft().customerName)} · ${money(saleTotal())}. Required for a custom service, guest worker, manager, other charge, price override, or discount.`:`Review the changes for ${esc(state.customerName)} before entering the approver PIN.`;return `<div class="modal-backdrop"><div clas   function cancelTicketModalHtml(ticket){const services=ticketServices(ticket).map(({service})=>ticketServiceName(service)).join(', ')||'No service assigned',status=ticketStatus(ticket)==='ready'?'Ready to pay':ticketStatus(ticket)==='inservice'?'In service':'Waiting';return `<div class="modal-backdrop"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="cancel-ticket-warning"><div class="modal-head"><div><p class="eyebrow">Cancel open ticket</p><h2 id="modal-title">Cancel ticket #${ticket.id}?</h2><p class="muted">${esc(ticket.name)} · ${status}</p></div><button type="button" class="modal-close" data-action="close-modal" aria-label="Keep ticket">${icon('x')}</button></div><div class="cancel-ticket-details"><strong>${esc(services)}</strong>Technician: ${esc(ticket.groups.map(group=>group.tech).filter(Boolean).join(', ')||'Not assigned')}</div><p class="cancel-ticket-warning" id="cancel-ticket-warning">${ticketStatus(ticket)==='inservice'?'This guest is in service. Confirm with the technician before cancelling. ':''}This removes the ticket from open work and checkout. ${ticket.checkedIn?'Its check-in remains in history as Cancelled.':'It will no longer appear in the open ticket list.'} No payment or refund is processed.</p><label class="form-field">Reason · required<select class="select" id="cancel-reason"><option value="">Choose reason</option>${['Guest left','Duplicate ticket','Service declined','Created in error','Other'].map(reason=>`<option value="${reason}" ${state.cancelReason===reason?'selected':''}>${reason}</option>`).join('')}</select></label>${state.turnLog.some(entry=>entry.ticketId===ticket.id&&!turnEntryReversed(entry)&&!entry.reverses)&&!ticketServicesDone(ticket)?`<label class="cancel-turn-choice"><input type="checkbox" id="cancel-release-turn" ${state.cancelReleaseTurn?'checked':''}> Return uncompleted turn credits to the technician queue</label>`:''}<p class="flow-notice">${esc(state.warning)}</p><div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Keep ticket</button><button type="button" class="btn btn-danger-confirm" data-action="confirm-cancel-ticket" data-id="${ticket.id}">Yes, cancel ticket</button></div></div></div>`}
  function performCancelTicket(){const ticket=activeTickets().find(entry=>entry.id===state.cancelTicketId);if(!ticket)return;ticket.status='cancelled';ticket.cancelledAt=new Date().toLocaleString('en-US');ticket.cancelledBy=roleLabel(state.authRole);ticket.cancelReason=state.cancelReason;if(state.cancelReleaseTurn){const entries=state.turnLog.filter(entry=>entry.ticketId===ticket.id&&!turnEntryReversed(entry)&&!entry.reverses);entries.forEach(entry=>{if(state.turnShifts[entry.tech])state.turnShifts[entry.tech].turnsToday=Math.max(0,Math.round((Number(state.turnShifts[entry.tech].turnsToday)-Number(entry.delta))*100)/100);state.turnLog.push({id:'reversal-'+uid(),reverses:entry.id,ticketId:ticket.id,tech:entry.tech,service:'Cancelled ticket reversal · '+entry.service,delta:-entry.delta,mode:entry.mode,skipped:[],at:new Date().toLocaleTimeString(),reversed:true})})}state.auditEvents.unshift({action:'Cancelled ticket #'+ticket.id,name:ticket.name,operator:roleLabel(state.authRole),approver:state.lastApproval||'—',reason:state.cancelReason,at:new Date().toLocaleTimeString()});state.auditEvents=state.auditEvents.slice(0,20);if(state.frontSelectedTicket===ticket.id)state.frontSelectedTicket=activeTickets()[0]?.id||null;if(state.frontSearchResult?.ticketId===ticket.id)state.frontSearchResult=null;if(state.ticketId===ticket.id){state.ticketId=null;state.editor=false}state.cancelTicketId=null;state.cancelReason='';state.cancelReleaseTurn=false;state.lastApproval='';state.modal=null;state.warning='';render()}
  function performDemoRefund(){const record=state.completedSales.find(entry=>entry.id===state.refundReceiptId);const amount=Number(state.refundAmount);if(!record||!state.refundReason||!Number.isFinite(amount)||amount<=0||amount>record.total-Number(record.refundedAmount||0))return;record.refundedAmount=Math.round((Number(record.refundedAmount||0)+amount)*100)/100;if(record.payment.giftCardCode){const code=record.payment.giftCardCode,restored=Math.min(amount,Math.max(0,Number(record.payment.giftCardAmount||0)-Number(record.giftCardRestored||0)));state.giftCardBalances[code]=Math.round((Number(state.giftCardBalances[code]||0)+restored)*100)/100;record.giftCardRestored=Math.round((Number(record.giftCardRestored||0)+restored)*100)/100}record.refundReason=state.refundReason;record.refundedAt=new Date().toLocaleString('en-US');record.refundApprovedBy=state.lastApproval;record.status=record.refundedAmount===record.total?'refunded-demo':'partially-refunded-demo';state.auditEvents.unshift({action:'Demo refund '+record.id,name:record.customer.name,operator:roleLabel(state.authRole),approver:state.lastApproval,reason:state.refundReason,at:new Date().toLocaleTimeString()});state.auditEvents=state.auditEvents.slice(0,20);state.refundReceiptId=null;state.refundAmount='';state.refundReason='';state.lastApproval='';state.modal=null;render()}
  function renderModal(){if(!state.modal){modalRoot.innerHTML='';return}if(state.modal==='role-login')modalRoot.innerHTML=roleLoginHtml();else if(state.modal==='pin-approval')modalRoot.innerHTML=pinApprovalHtml();else if(state.modal==='cancel-ticket'){const ticket=activeTickets().find(entry=>entry.id===state.cancelTicketId);if(!ticket){state.modal=null;state.cancelTicketId=null;modalRoot.innerHTML='';return}modalRoot.innerHTML=cancelTicketModalHtml(ticket)}else if(state.modal==='refund-demo'){const record=state.completedSales.find(entry=>entry.id===state.refundReceiptId);if(!record){state.modal=null;modalRoot.innerHTML='';return}modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><p class="eyebrow">Refund · demo record</p><h2 id="modal-title">Refund receipt ${esc(record.id)}?</h2><p>${esc(record.customer.name)} · paid ${money(record.total)}</p></div><button class="modal-close" data-action="close-modal" aria-label="Keep receipt">${icon('x')}</button></div><p class="cancel-ticket-warning">A real refund requires payment provider confirmation. This action only records a demo refund; no money moves.</p><label class="form-field">Amount<input class="input" id="refund-amount" type="number" min="0.01" max="${record.total-Number(record.refundedAmount||0)}" step="0.01" value="${esc(state.refundAmount)}"></label><label class="form-field">Reason · required<select class="select" id="refund-reason"><option value="">Choose reason</option>${['Guest request','Service issue','Duplicate payment','Payment error','Other'].map(reason=>`<option value="${reason}" ${state.refundReason===reason?'selected':''}>${reason}</option>`).join('')}</select></label><p class="flow-notice">${esc(state.refundNotice)}</p><div class="modal-actions"><button class="btn btn-secondary" data-action="close-modal">Keep payment</button><button class="btn btn-danger-confirm" data-action="confirm-refund-demo">Continue with Manager PIN</button></div></div></div>`}else if(state.modal==='review'){modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><p class="eyebrow">Final review</p><h2 id="modal-title">Review checkout</h2><p class="muted">${esc(state.customerName)} · ${esc(displayPhone(state.phone))}</p></div><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('x')}</button></div><div class="review-items">${summaryRowsHtml()}</div>${tipReviewHtml()}${state.lastApproval&&sensitiveCheckout()?`<p class="approval-note">${esc(state.lastApproval)} · prototype approval</p>`:''}<div class="summary-line"><span>Payment method</span><strong>${esc(paymentName(state.payment))}</strong></div><div class="summary-line"><span>Payment discount</span><strong>−${money(walletDiscount())}</strong></div><div class="summary-line"><span>Credit Card fee (${feeLabel()})</span><strong>${money(paymentFee())}</strong></div><div class="total-line"><span>Total</span><span>${money(total())}</span></div><p class="safe-note">${icon('info')} This completes the prototype demo only. It does not process payment.</p><div class="modal-actions"><button class="btn btn-secondary" data-action="close-modal">Edit checkout</button><button class="btn btn-primary" data-action="complete-demo">Complete demo</button></div></div></div>`}else{const record=receiptRecord();if(!record){state.modal=null;modalRoot.innerHTML='';return}if(state.modal==='sms-preview'){modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal receipt-confirm" role="dialog" aria-modal="true" aria-labelledby="modal-title"><p class="eyebrow">SMS receipt preview</p><h2 id="modal-title">Send receipt to ${esc(record.customer.phoneMasked)}</h2><p class="muted">Preview the message and confirm the customer's phone before sending in the live POS.</p><div class="receipt-sms-preview">${esc(record.customer.name)}, thank y
