  function productPanelHtml(){const item=deskUtilities.find(entry=>entry.id===state.productMenuOpen);if(item?.id==='support')return supportPanelHtml();if(!item?.sections)return '';const dailyIds=productDailyOrder[item.id]||[],daily=dailyIds.map(id=>item.sections.find(section=>section.id===id)).filter(Boolean),more=item.sections.filter(section=>!dailyIds.includes(section.id));const link=(section,primary)=>`<a class="product-tool-link ${primary?'product-tool-primary':'product-tool-secondary'}" href="${esc(section.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(item.label)} ${esc(section.label)} in a new tab">${primary?`<span class="product-tool-icon">${icon(productToolIcons[section.id]||'grid')}</span>`:''}<span class="product-tool-copy"><b>${esc(section.label)}</b><small>${esc(section.desc)}</small></span><span class="product-tool-arrow" aria-hidden="true">↗</span></a>`;return `<div class="ai-hub-tools product-priority-panel" id="product-tools-panel"><div class="ai-hub-tools-head"><div><strong>${esc(item.label)}</strong><span>Frequently used tools first · ${item.sections.length} tools</span></div><button type="button" data-action="utility-product-toggle" data-id="${item.id}" aria-label="Close ${esc(item.label)} menu">×</button></div><div class="ai-hub-section-grid"><div class="product-group-heading"><strong>DAILY FRONT DESK</strong><span>Booking, guest service, and payments</span></div>${daily.map(section=>link(section,true)).join('')}<div class="product-group-heading product-group-secondary"><strong>MORE TOOLS</strong><span>Campaigns, reports, and setup</span></div>${more.map(section=>link(section,false)).join('')}</div><p>Priority reflects the front desk workflow. Nexora can refine the order using real usage data; account permissions still apply.</p></div>`}

  function utilityTriggerHtml(){return `<button type="button" class="pos-header-products ${state.utilityMenuOpen?'active':''}" data-action="utility-toggle" aria-expanded="${state.utilityMenuOpen}" aria-controls="nexora-products-panel">${icon('grid')}<span>Nexora products</span><small>${deskUtilities.length}</small><span aria-hidden="true">${state.utilityMenuOpen?'⌃':'⌄'}</span></button>`}
  function utilityHtml(){if(!state.utilityMenuOpen)return '<section id="nexora-products-panel" hidden></section>';const ordered=state.utilityOrder.map(id=>deskUtilities.find(item=>item.id===id)).filter(Boolean);return `<section class="desk-utilities panel is-open" id="nexora-products-panel" aria-label="Nexora products inside POS"><div class="desk-utilities-body"><div class="desk-utilities-head"><div><p class="desk-kicker">QUICK ACCESS</p><h2>Products at your POS</h2><p>Open tools here while keeping this POS ticket in place.</p></div><div class="pos-nav-tools"><div class="pos-layout-toggle" role="group" aria-label="Products menu layout"><button type="button" class="${state.utilityLayout==='cards'?'selected':''}" data-action="utility-layout" data-value="cards" aria-pressed="${state.utilityLayout==='cards'}">${icon('grid')} Cards</button><button type="button" class="${state.utilityLayout==='compact'?'selected':''}" data-action="utility-layout" data-value="compact" aria-pressed="${state.utilityLayout==='compact'}">${icon('menu')} Compact</button></div></div></div><div class="desk-utility-grid ${state.utilityLayout}">${ordered.map((item,index)=>utilityTileHtml(item,index,ordered.length)).join('')}</div>${productPanelHtml()}</div></section>`}

  function floorTicketCard(ticket){const status=ticketStatus(ticket),selected=state.frontSelectedTicket===ticket.id,services=ticketServices(ticket);return `<article class="floor-ticket ${status} ${selected?'selected':''}"><button type="button" class="floor-ticket-select" data-action="front-select-ticket" data-id="${ticket.id}" aria-pressed="${selected}"><span class="floor-ticket-top"><b>#${ticket.id} · ${esc(ticket.name)}</b><span>${esc(ticket.arrivedAt||'Today')}</span></span><span class="floor-ticket-service">${esc(services.map(({service})=>ticketServiceName(service)).join(', ')||'Service to be assigned')}</span><span class="floor-ticket-foot">${esc([...new Set(ticket.groups.map(group=>group.tech).filter(Boolean))].join(' + ')||'No technician yet')}<strong>${money(ticketSubtotal(ticket))}</strong></span></button></article>`}

  function checkinSummaryHtml(){const checkins=state.tickets.filter(ticket=>ticket.checkedIn),average=checkins.length?Math.round(checkins.reduce((total,ticket)=>total+Number(ticket.waitMinutes||0),0)/checkins.length):0;return `<section class="checkin-summary" aria-label="Today's check-in summary"><div class="checkin-summary-label"><strong>Today's Check-in Overview</strong><span>Guest flow and new-customer acquisition · demo data</span></div><div class="floor-insight-grid checkin-metrics"><div><small>TOTAL CHECK-INS</small><strong>${checkins.length}</strong></div><div><small>NEW GUESTS</small><strong>${checkins.filter(ticket=>ticket.newGuest).length}</strong></div><div><small>RETURNING GUESTS</small><strong>${checkins.filter(ticket=>!ticket.newGuest).length}</strong></div><div><small>AVERAGE WAIT</small><strong>${average}m</strong></div></div></section>`}
  function checkinOverviewHtml(){const checkins=state.tickets.filter(ticket=>ticket.checkedIn),sources=Object.entries(checkins.reduce((result,ticket)=>{const source=ticket.checkInSource||'Front Desk';result[source]=(result[source]||0)+1;return result},{})),average=checkins.length?Math.round(checkins.reduce((total,ticket)=>total+Number(ticket.waitMinutes||0),0)/checkins.length):0,detail=checkins.find(ticket=>ticket.id===state.frontCheckinDetail),filters=[['all','All'],['waiting','Waiting'],['inservice','In Service'],['ready','Ready to Pay'],['paid','Completed'],['cancelled','Cancelled']];return `<section class="checkin-overview" aria-label="Check-in sources and history"><div class="checkin-overview-head"><div><p class="tech-screen-eyebrow">TODAY · CHECK-IN DETAIL</p><h3>Guest sources & check-ins</h3></div></div><div class="checkin-context"><div class="panel checkin-sources"><h4>Guest Sources</h4>${sources.length?sources.map(([source,count])=>`<div class="checkin-source"><span>${esc(source)}</span><div><i style="width:${Math.round(count/checkins.length*100)}%"></i></div><strong>${count}</strong></div>`).join(''):'<p>No check-ins yet today.</p>'}</div><div class="panel checkin-order"><h4>Guest Order Summary</h4><p>Each guest keeps their original check-in number through waiting, service, checkout, or cancellation.</p></div></div><div class="panel checkin-list"><div class="checkin-list-head"><h4>All Check-ins Today <span>${checkins.length}</span></h4></div><div class="checkin-controls" role="group" aria-label="Filter check-ins by status">${filters.map(([id,label])=>`<button type="button" class="${state.frontCheckinFilter===id?'selected':''}" data-action="front-checkin-filter" data-value="${id}" aria-pressed="${state.frontCheckinFilter===id}">${label}</button>`).join('')}<label class="checkin-search"><span class="sr-only">Search check-ins</span><input class="input" id="front-checkin-search" type="search" placeholder="Search name, phone, or #" value="${esc(state.frontCheck   function checkoutHtml(){return `<section class="checkout-hero"><div><div class="hero-kicker">${icon('card')} Payment workspace</div><h2>Checkout Customer</h2><p class="hero-copy">Look up the guest by phone, then assign work by technician. Check-in is optional.</p></div><div class="hero-actions"><span class="count-chip">${activeTickets().length} open tickets</span><button type="button" class="btn btn-secondary" data-action="nav" data-id="quicksale">Products &amp; Other Sales</button><button type="button" class="btn btn-primary" data-action="new-checkout">${icon('plus')} New checkout</button></div></section><div class="list-heading"><div><h3>Open customer tickets</h3><p class="muted">Existing tickets remain one tap away.</p></div></div><div class="ticket-grid">${orderedWorkspace('tickets',activeTickets(),t=>t.id).map((t,index,ordered)=>`<article class="ticket-card panel"><div class="ticket-top"><div><span class="ticket-id">TICKET #${t.id}</span><h4 class="ticket-name">${esc(t.name)}</h4></div><span class="status">${ticketStatus(t)==='waiting'?'Waiting':ticketStatus(t)==='ready'?'Ready to pay':'In service'}</span></div><div class="ticket-details"><div class="field-label">Services</div><p>${esc(t.groups.flatMap(g=>g.services.map(s=>baseCatalog.find(c=>c.id===s.id)?.name||s.name||'Custom service')).join(', '))}</p><div class="field-label">Technician</div><p>${esc(t.groups.map(g=>g.tech).join(', '))}</p></div><div class="ticket-actions"><button type="button" class="btn btn-secondary btn-wide" data-action="open-ticket" data-id="${t.id}">${icon('card')} Checkout</button><button type="button" class="btn btn-secondary ticket-cancel" data-action="request-cancel-ticket" data-id="${t.id}" aria-label="Cancel ticket #${t.id} for ${esc(t.name)}">Cancel ticket</button></div>${reorderControls('tickets',String(t.id),`ticket ${t.id}`,index,ordered.length)}</article>`).join('')||'<p class="panel ticket-empty">No open tickets. Start a new checkout when the next guest is ready.</p>'}</d   function ticketWorkForTech(tech){return activeTickets().filter(ticket=>ticketStatus(ticket)==='inservice').flatMap(ticket=>ticket.groups.flatMap(group=>group.services.filter(service=>group.tech===tech||service.coTech===tech).map(service=>({ticket,service,role:group.tech===tech?'lead':'with '+group.tech}))))}

  function accessRulesHtml(){const rules=[['Customer data','Customer name, status, assigned visits','Assigned only','Allowed','Allowed','Allowed'],['Customer data','Full phone and email','Blocked','Ask approval','Own PIN','Own PIN'],['Customer data','Private notes, forms, files','Blocked','Ask approval','Own PIN','Own PIN'],['Customer data','Edit customer contact details','Blocked','Ask approval','Own PIN','Own PIN'],['Customer data','Export customer list','Blocked','Blocked','Blocked','Owner PIN'],['Ticket and payment','Guest worker attribution and other charges','Blocked','Ask approval','Own PIN','Own PIN'],['Ticket and payment','Discounts and custom price overrides','Blocked','Ask approval','Own PIN','Own PIN'],['Ticket and payment','Void or refund payment','Blocked','Ask approval','Own PIN','Own PIN'],['Ticket and payment','Change tip after payment','Blocked','Ask approval','Own PIN','Own PIN'],['Ticket and payment','Manual gift balance or cash adjustment','Blocked','Ask approval','Own PIN','Own PIN'],['Business controls','Sales reports','Blocked','Blocked','Allowed','Allowed'],['Business controls','Payout and payroll details','Blocked','Blocked','Blocked','Owner PIN'],['Business controls','Payment fees, roles, PIN rules/reset','Blocked','Blocked','Blocked','Owner PIN']];const groups=[...new Set(rules.map(row=>row[0]))];return `<section class="access-head"><div><span class="tech-screen-eyebrow">SALON SETTINGS · PROPOSED FEATURE</span><h2>Owner Mode & permissions</h2><p class="muted">A role permits the action; sensitive data and changes still require a fresh approval for that action.</p></div><button type="button" class="btn btn-primary" data-action="open-role-login">Switch POS account</button></section><section class="panel owner-mode-card"><div><span class="settings-eyebrow">OWNER MODE</span><h3>${state.authRole==='owner'?'Owner Mode active':'Owner Mode required'}</h3><p>Owner configures role rules, payment fees, PIN policy, and access to business data. Each person uses their own account and PIN. Approval is limited to the record or transaction shown.</p></div><span class="access-current">Current session · ${roleLabel(state.authRole)}</span></section><div class="access-role-grid"><div class="access-role-card"><span>01 · Assigned work</span><strong>Technician</strong><p>See their own assigned visits and services. Customer contact and private notes stay hidden.</p></div><div class="access-role-card"><span>02 · Daily operations</span><strong>Front Desk</strong><p>Check in, assign work, and take standard payment. Sensitive actions request approval.</p></div><div class="access-role-card"><span>03 · Operations approval</span><strong>Manager</strong><p>Approve customer contact access, discounts, refunds, and adjustments with a personal PIN.</p></div><div class="access-role-card ${state.authRole==='owner'?'active':''}"><span>04 · Salon control</span><strong>Owner</strong><p>Manage permissions, financial settings, and customer exports with Owner PIN.</p></div></div><section class="panel permission-matrix"><div class="access-rule-title"><div><h3>Proposed permission matrix</h3><p>“Ask approval” calls a Manager or Owner. “Own PIN” and “Owner PIN” require a fresh code for the listed action.</p></div><span class="access-current">Default deny</span></div><div class="permission-table-wrap"><table><thead><tr><th scope="col">Action or information</th><th scope="col">Technician</th><th scope="col">Front Desk</th><th scope="col">Manager</th><th scope="col">Owner</th></tr></thead><tbody>${groups.map(group=>`<tr class="permission-group"><th colspan="5" scope="rowgroup">${esc(group)}</th></tr>${rules.filter(row=>row[0]===group).map(([,task,...levels])=>`<tr><th scope="row">${esc(task)}</th>${levels.map(level=>`<td><span class="permission-status ${level==='Blocked'?'blocked':level.includes('PIN')||level==='Ask approval'?'approval':'allowed'}">${esc(level)}</span></td>`).join('')}</tr>`).join('')}`).join('')}</tbody></table></div><p class="permission-footnote">Full payment card numbers are never shown in POS. A customer lookup may use a phone number the guest gives the operator, but stored contact details stay masked until approved. The server must apply these permissions to search, receipts, APIs, exports, and prints.</p></section><section class="panel access-audit"><h3>Approval activity · demo</h3>${state.auditEvents.length?state.auditEvents.map(event=>`<div class="audit-row"><strong>${esc(event.action)} · ${esc(event.name)}</strong><span>${esc(event.operator)} requested · ${esc(event.approver)} approved · ${esc(event.reason)} · ${esc(event.at)}</span></div>`).join(''):`<p>No protected customer information has been opened in this demo session.</p>`}</section><section class="panel access-build-note"><h3>Developer handoff</h3><p>Connect permissions to individual staff accounts and locations. Verify role and PIN on the server, scope a reveal to one customer for 30 seconds, rate-limit attempts, clear data on role change, and audit operator, approver, action, subject, reason, and time. Demo PINs in this file accept any 4–6 digits.</p></section>`}

  const settingsTabs=[['settingsoverview','Salon Information',false],['settingssms','SMS Settings',false],['settingsstaff','Staff',false],['settingsservices','Services',false],['settingsroles','Roles & Permissions',false],['accessrules','Access & PIN',true],['settingslevels','Staff Levels',false],['salonsettings','Payment Methods & Fees',true]];

  function accessSettingsHtml(){return `${settingsPageHeadingHtml()}<div class="settings-layout">${settingsNavHtml('accessrules')}<div class="settings-main"><div class="settings-head"><div><h2>Access & PIN</h2><p class="muted">Proposed new setting beside the existing Roles & Permissions page.</p></div><div class="settings-head-actions"><button type="button" class="btn btn-secondary" data-action="nav" data-id="salonsettings">Payment Methods & Fees</button><button type="button" class="btn btn-secondary" data-action="nav" data-id="overview">Back to Front Desk</button></div></div><section class="panel access-build-note"><h3>Owner setup · 3 steps</h3><p><b>1.</b> Assign each person's POS Role in Staff. <b>2.</b> Have each owner or manager create their own PIN. <b>3.</b> Choose which actions require manager or owner approval, then save with Owner PIN. PIN creation and saving rules need production account verification; this local prototype only shows the proposed flow.</p></section>${accessRulesHtml()}</div></div>`}
  function draftMethodDiscount(id,base){const rule=state.settingsDraftMethodDiscounts[id],amount=Math.max(0,cents(base)/100);if(rule?.type==='percent')return Math.min(amount,cents(amount*Number(rule.value||0)/100)/100);if(rule?.type==='amount')return Math.min(amount,cents(rule.value)/100);if(rule?.type==='none')return 0;return state.settingsDraftWalletEnabled&&state.settingsDraftWalletMethods.includes(id)?Math.min(amount,cents(amount*Number(state.settingsDraftWalletPercent||0)/100)/100):0}
  function draftHundredTotal(id){const discount=draftMethodDiscount(id,100),fee=id==='credit'&&state.settingsDraftEnabled?cents((100-discount)*Number(state.settingsDraftPercent||0)/100)/100:0;return Math.max(0,cents(100-discount+fee)/100)}
  function updateSettingsPreview(){document.querySelectorAll('[data-settings-example]').forEach(el=>el.textContent=money(draftHundredTotal(el.dataset.settingsExample)))}
  function paymentMethodSettingsHtml(){return `<section class="panel settings-card"><div class="settings-card-title"><div><span class="settings-eyebrow">ACCEPTED PAYMENTS · OWNER PIN REQUIRED</span><h3>Payment methods</h3><p class="muted">Choose what the salon accepts. Set a discount for each method, or use the default wallet rule below.</p></div><span class="settings-count">${state.settingsDraftPaymentMethods.length} enabled</span></div><div class="payment-method-rows">${draftPaymentCatalog().map(([id,label])=>{const rule=state.settingsDraftMethodDiscounts[id]||{type:walletMethodIds.includes(id)?'inherit':'none',value:0},enabled=state.settingsDraftPaymentMethods.includes(id);return `<div class="payment-method-row"><label class="settings-switch"><input type="checkbox" data-field="payment-enabled" value="${esc(id)}" ${enabled?'checked':''}><strong>${esc(label)}</strong></label><label class="payment-rule-label">Discount<select class="select" data-field="method-discount-type" data-id="${esc(id)}" ${id==='split'?'disabled':''}>${walletMethodIds.includes(id)?`<option value="inherit" ${rule.type==='inherit'?'selected':''}>Wallet default</option>`:''}<option value="none" ${rule.type==='none'?'selected':''}>None</option><option value="percent" ${rule.type==='percent'?'selected':''}>Percent (%)</option><option value="amount" ${rule.type==='amount'?'selected':''}>Fixed amount ($)</option></select></label><input class="input payment-rule-value" type="number" min="0" ${rule.type==='percent'?'max="100"':''} step="0.01" value="${esc(rule.value??0)}" data-field="method-discount-value" data-id="${esc(id)}" aria-label="Discount value for ${esc(label)}" ${['percent','amount'].includes(rule.type)?'':'disabled'}>${id.startsWith('custom-')?`<button type="button" class="btn btn-secondary" data-action="remove-payment-method" data-id="${esc(id)}" aria-label="Remove ${esc(label)}">Remove</button>`:id==='split'?'<small>Uses each portion’s rule</small>':''}</div>`}).join('')}</div><div class="payment-add-method"><input class="input" id="custom-payment-name" maxlength="32" placeholder="New method, e.g. ACH transfer" aria-label="New payment method name"><button type="button" class="btn btn-secondary" data-action="add-payment-method">+ Add method</button></div><p class="hint">Discounts apply to the discounted item subtotal before tip. Split Pay applies each method’s rule to its own portion. Changes take effect after Owner PIN approval.</p></section>`}
  function salonSettingsHtml(){

  function filteredPriceCatalog(){const search=state.priceSearch.trim().toLowerCase();return fullCatalog.filter(item=>(search||item.category===state.priceCategory)&&`${item.name} ${item.category}`.toLowerCase().includes(search))}
  function priceRowsHtml(){const items=filteredPriceCatalog(),categories=orderedIds(state.workspaceOrder.price,[...new Set(items.map(item=>item.category))]).filter(category=>items.some(item=>item.category===category)),staff=state.priceView==='staff';return items.length?categories.map((category,index)=>`<section class="price-section panel"><div class="price-section-heading"><h3>${esc(category)}</h3>${reorderControls('price',category,category,state.workspaceOrder.price.indexOf(category),state.workspaceOrder.price.length)}</div><div class="price-table-wrap"><table class="price-table ${staff?'staff-prices':'customer-prices'}"><thead><tr><th scope="col">Service</th><th scope="col">Time</th><th scope="col">${staff?'Menu price · no card fee':'Menu price'}</th>${staff?`<th scope="col">Credit Card (+${feeLabel()})</th>`:''}</tr></thead><tbody>${items.filter(item=>item.category===category).map(item=>`<tr><td>${esc(item.name)}</td><td>${item.duration} min</td><td>${money(item.price)}</td>${staff?`<td>${money(menuCardPrice(item.price))}</td>`:''}</tr>`).join('')}</tbody></table></div></section>`).join(''):`<div class="empty">No matching services</div>`}
  function priceMenuHtml(){const categories=state.workspaceOrder.price,staff=state.priceView==='staff';return `<section class="price-menu-head"><div><h2>Service Price Menu</h2><p class="muted">${staff?'Compare what customers pay at menu price and by Credit Card.':'Standard service prices shown to customers.'}</p></div><span class="count-chip"><span id="price-count">${filteredPriceCatalog().length}</span> services</span></section><div class="price-view-toggle" role="group" aria-label="Price menu view"><button type="button" class="price-view-button ${staff?'':'selected'}" data-action="price-view" data-value="customer" aria-pressed="${!staff}">Menu prices</button><button type="button" class="price-view-button ${staff?'selected':''}" data-action="price-view" data-value="staff" aria-pressed="${staff}">Menu vs Credit Card</button></div><div class="pricing-rule panel"><span class="pricing-rule-icon">${icon('info')}</span><div><strong>${staff?'Customer payment prices':'Standard menu prices'}</strong><p>${staff?`Cash uses the menu price. Eligible wallets receive the salon's configured discount at checkout. Credit Card adds the salon's configured ${feeLabel()} rate. At checkout, the fee is calculated after discounts and before tip. <button type="button" class="inline-settings-link" data-action="nav" data-id="salonsettings">Edit payment settings</button>`:`Services show the salon's standard menu price. The final amount depends on services, discounts, tip, and payment method. <button type="button" class="inline-settings-link" data-action="nav" data-id="checkout">Compare payment totals at checkout</button>`}</p></div></div><div class="price-catalog-layout"><nav class="price-category-tabs" aria-label="Service categories"><strong>Categories</strong>${categories.map(category=>`<button type="button" class="price-category-tab ${!state.priceSearch.trim()&&state.priceCategory===category?'selected':''}" data-action="price-category" data-value="${esc(category)}" aria-pressed="${!state.priceSearch.trim()&&state.priceCategory===category}"><span>${esc(category)}</span><small>${fullCatalog.filter(item=>item.category===category).length}</small></button>`).join('')}</nav><div class="price-catalog-main"><div class="price-catalog-search"><input class="input" id="price-search" type="search" aria-label="Search all services" placeholder="Search all services..." value="${esc(state.priceSearch)}"><span class="price-search-status" id="price-search-status">${state.priceSearch.trim()?'Search results across all categories':`Showing ${esc(state.priceCategory)}`}</span></div><div id="price-list" class="price-list">${priceRowsHtml()}</div></div></div><p class="gift-note">Prices shown are a prototype snapshot of the salon's current service list. The production menu should read from the live service catalog.</p>`}
  function customerResultHtml(){if(['existing','ticket'].includes(state.customerStatus)){const ticket=state.customerStatus==='ticket';return `<div class="identity-card found"><b>${ticket?`Customer on ticket #${state.ticketId}`:'Existing customer found'}</b><strong>${esc(state.customerName)}</strong><span class="sensitive-phone">${esc(displayPhone(state.phone))} · ${contactVisible(state.phone)?'Contact approved for this record':'Phone hidden by permission'}</span><div class="customer-private-actions"><button type="button" class="btn btn-secondary" data-action="request-sensitive" data-type="reveal-contact" data-id="current">${contactVisible(state.phone)?'Renew contact access':'View full contact · approval required'}</button>${contactVisible(state.phone)?`<button type="button" class="btn btn-secondary" data-action="hide-sensitive" data-type="contact" data-id="current">Hide</button>`:''}${!ticket?`<button type="button" class="btn btn-secondary" data-action="change-customer">Different customer</button>`:''}</div></div>`}if(state.customerStatus==='new')return `<div class="identity-card new"><b>New customer</b><p>No matching phone number. Enter the guest's name to continue.</p><label for="customer-name">Customer name · required</label><input class="input" id="customer-name" autocomplete="off" placeholder="Enter first and last name" value="${esc(state.customerName)}"><button type="button" class="btn btn-primary" data-action="confirm-new" style="margin-top:9px;justify-self:start">Continue to services</button></div>`;return `<p class="hint">Demo: enter <b>202-555-0101</b> for an existing customer, or <b>202-555-0199</b> for a new customer.</p>`}

  function customerHtml(){return `<section class="panel form-panel"><h3 class="panel-title"><span class="step">1</span> Find customer</h3><label class="inline-label" for="customer-phone">Customer phone · required</label><div class="lookup-row"><input class="input" id="customer-phone" inputmode="tel" autocomplete="off" placeholder="(000) 000-0000" value="${esc(['existing','ticket'].includes(state.customerStatus)?displayPhone(state.phone):formatPhone(state.phone))}" ${['existing','ticket'].includes(state.customerStatus)?'readonly':''}><button type="button" class="btn btn-secondary" data-action="lookup" ${['existing','ticket'].includes(state.customerStatus)?'disabled':''}>Find customer</button></div><div id="customer-result" aria-live="polite">${customerResultHtml()}</div></section>`}
  function itemEditor(item,type,groupId,serviceId){return `<div class="item-editor"><div class="item-line ${type==='addon'||type==='extra'?'addon-line':''}"><div class="item-name">${item.custom?`<input class="input" aria-label="Custom ${type} name" placeholder="Custom ${type} name" data-field="name" data-type="${type}" data-group="${groupId}" data-service="${serviceId||''}" data-item="${item.uid}" value="${esc(item.name)}">`:`<strong>${esc(item.name)}</strong>`}</div><div class="item-price"><span>$</span><input type="number" min="0" step="0.01" aria-label="Price for ${esc(item.name||type)}" data-field="price" data-type="${type}" data-group="${groupId}" data-service="${serviceId||''}" data-item="${item.uid}" value="${Number(item.price)}"></div><button type="button" class="remove" data-action="remove-item" data-group="${groupId}" data-service="${serviceId||''}" data-item="${item.uid}" data-type="${type}" aria-label="Remove ${esc(item.name||type)}">${icon('x')}</button></div><div class="discount-under"><button type="button" class="discount-toggle" data-action="toggle-discount" data-type="${type}" data-group="${groupId}" data-service="${serviceId||''}" data-item="${item.uid}">${item.showDiscount?'▾':'▸'} Discount ${itemDiscount(item)>0?`(${money(itemDiscount(item))} off)`:''}</button><span class="item-net" id="net-${item.uid}">Net ${money(netPrice(item))}</span></div>${item.showDiscount?`<div class="discount-panel"><label for="discount-mode-${item.uid}">Service discount</label><select class="select" id="discount-mode-${item.uid}" data-field="discount-mode" data-type="${type}" data-group="${groupId}" data-service="${serviceId||''}" data-item="${item.uid}"><option value="amount" ${item.discountMode==='amount'?'selected':''}>Amount ($)</option><option value="percent" ${item.discountMode==='percent'?'selected':''}>Percent (%)</option></select><input class="input" type="number" min="0" step="0.01" aria-label="Discount value for ${esc(item.name||type)}" data-field="discount-value" data-type="${type}" data-group="${groupId}" data-service="${serviceId||''}" data-item="${item.uid}" value="${item.discountValue}"></div>`:''}</div>`}
  function extraEditor(group,item){return `<div class="extra-item">${itemEditor(item,'extra',group.uid,'')}<label class="inline-label" for="parent-${item.uid}">Related main service · required</label><select class="select" id="parent-${item.uid}" data-field="parent" data-group="${group.uid}" data-item="${item.uid}"><option value="">Choose related service</option>${state.groups.flatMap(g=>g.services.map(s=>`<option value="${s.uid}" ${Number(item.parentUid)===s.uid?'selected':''}>${esc(g.tech||'Unassigned')} · ${esc(s.name||'Custom service')}</option>`)).join('')}</select></div>`}
  function serviceHtml(group,service){return `<div class="service-block"><div class="service-block-top"><span class="service-tag">MAIN SERVICE</span><span class="inherit-tag">${service.coTech?`${esc(group.tech||'Lead technician')} + ${esc(service.coTech)} share this service; add-ons stay with ${esc(group.tech||'the lead')}`:`${esc(group.tech||'Select technician')} performs this service and its add-ons`}</span></div>${itemEditor(service,'service',group.uid,'')}<div class="co-tech-field"><label for="co-tech-${service.uid}">Working together on this service</label><select class="select" id="co-tech-${service.uid}" data-field="co-tech" data-group="${group.uid}" data-service="${service.uid}"><option value="">Only ${esc(group.tech||'selected technician')}</option>${techs.filter(tech=>tech!==group.tech).map(tech=>`<option value="${esc(tech)}" ${service.coTech===tech?'selected':''}>${esc(tech)} · shared service</option>`).join('')}</select></div><div class="addons-area"><div class="addons-head"><strong>Add-ons for this service</strong><span>Technician inherited automatically</span></div>${service.addons.length?service.addons.map(a=>itemEditor(a,'addon',group.uid,service.uid)).join(''):`<p class="addon-empty">No add-ons yet. Add as many as needed without choosing the technician again.</p>`}<div class="button-row"><button type="button" class="btn btn-secondary" data-action="toggle-addon-picker" data-group="${group.uid}" data-service="${service.uid}">${icon('plus')} Add-on</button><button type="button" class="btn btn-quiet" data-action="custom-addon" data-group="${group.uid}" data-service="${service.uid}">+ Custom add-on</button></div>${service.picker?`<div class="picker-grid" aria-label="Available add-ons">${addonCatalog.map(a=>`<button type="button" class="service-choice" data-action="add-addon" data-id="${a.id}" data-group="${group.uid}" data-service="${service.uid}"><span><b>${esc(a.name)}</b><small>${esc(a.duration)}</small></span><strong>${money(a.price)} +</strong></button>`).join('')}</div>`:''}</div></div>`}
  function groupHtml(group,index){return `<div class="tech-group"><div class="group-head"><div><span class="group-number">TECHNICIAN ${index+1}</span><h4>${esc(group.tech||'Choose technician')}</h4></div>${reorderControls('groups',String(group.uid),group.tech||`technician ${index+1}`,index,state.groups.length)}${state.groups.length>1?`<button type="button" class="text-button danger-text" data-action="remove-group" data-group="${group.uid}">Remove technician</button>`:''}</div><div class="form-field"><label for="tech-${group.uid}">Who performed this work? · required</label><select class="select" id="tech-${group.uid}" data-field="tech" data-group="${group.uid}"><option value="">Select technician</option>${techs.map(t=>`<option value="${esc(t)}" ${group.tech===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="group-services">${group.services.length?group.services.map(s=>serviceHtml(group,s)).join(''):`<div class="empty">Add a main service, or record an add-on by this technician below.</div>`}</div><div class="button-row group-buttons"><button type="button" class="btn btn-secondary" data-action="toggle-service-picker" data-group="${group.uid}">${icon('plus')} Add main service</button><button type="button" class="btn btn-quiet" data-action="custom-service" data-group="${group.uid}">+ Custom service</button></div>${group.picker?`<div class="form-field"><label for="picker-category-${group.uid}">Service category</label><select class="select" id="picker-category-${group.uid}" data-field="picker-category" data-group="${group.uid}">${defaultPriceOrder.map(category=>`<option value="${esc(category)}" ${category===(group.pickerCategory||defaultPriceOrder[0])?'selected':''}>${esc(category)}</option>`).join('')}</select></div><div class="picker-grid" aria-label="Available main services">${catalogServices.filter(s=>s.category===(group.pickerCategory||defaultPriceOrder[0])).map(s=>`<button type="button" class="service-choice" data-action="add-service" data-id="${s.id}" data-group="${group.uid}"><span><b>${esc(s.name)}</b><small>${s.duration}</small></span><strong>${money(s.price)} +</strong></button>`).join('')}</div>`:''}${(index>0||group.extras.length>0)?`<div class="other-tech-work"><div class="addons-head"><strong>Add-on by this technician</strong><span>Link it to the main service</span></div>${group.extras.length?group.extras.map(item=>extraEditor(group,item)).join(''):`<p class="addon-empty">Use this when another technician performs an add-on for a service above.</p>`}<div class="button-row"><button type="button" class="btn btn-secondary" data-action="toggle-extra-picker" data-group="${group.uid}">${icon('plus')} Add their add-on</button><button type="button" class="btn btn-quiet" data-action="custom-extra" data-group="${group.uid}">+ Custom work</button></div>${group.extraPicker?`<div class="picker-grid" aria-label="Add-ons by this technician">${addonCatalog.map(a=>`<button type="button" class="service-choice" data-action="add-extra" data-id="${a.id}" data-group="${group.uid}"><span><b>${esc(a.name)}</b><small>${esc(a.duration)}</small></span><strong>${money(a.price)} +</strong></button>`).join('')}</div>`:''}</div>`:''}</div>`}
  function servicesHtml(){if(!customerReady())return `<section class="panel form-panel lock-card"><h3 class="panel-title"><span class="step">2</span> Technician & services</h3><p class="muted">${state.customerStatus==='new'?'Enter the new customer’s name and continue.':'Find the customer by phone first.'} Then add the technician, their main service, and any add-ons under that service.</p></section>`;return `<section class="panel form-panel"><h3 class="panel-title"><span class="step">2</span> Technician & services</h3><p class="hint" style="margin:-7px 0 16px">Choose the technician once. Add-ons and custom items under their service inherit that technician. Service choices show standard menu prices; payment estimates appear in step 3.</p><div class="tech-groups">${state.groups.map(groupHtml).join('')}</div><button type="button" class="add-tech" data-action="add-group">${icon('plus')} Add another technician & their work</button><p class="hint">If a different technician performs an add-on, add that technician above and record the work under them.</p></section>`}
  function summaryRowsHtml(){return state.groups.map(g=>`${g.services.map(s=>`<div class="summary-service"><div class="summary-line"><span>${esc(s.name||'Custom service')}<small>${esc(g.tech||'Technician needed')}${s.coTech?` + ${esc(s.coTech)} · shared service`:''}</small></span>${priceHtml(s)}</div>${s.addons.map(a=>`<div class="summary-line addon-summary"><span>↳ ${esc(a.name||'Custom add-on')}</span>${priceHtml(a)}</div>`).join('')}</div>`).join('')}${g.extras.map(a=>`<div class="summary-service"><div class="summary-line"><span>${esc(a.name||'Custom work')}<small>${esc(g.tech||'Technician needed')} · for ${esc(relatedLabel(a.parentUid))}</small></span>${priceHtml(a)}</div></div>`).join('')}`).join('')||`<div class="summary-empty">No services added yet.</div>`}

  function tipCalculationLabel(){return state.tipMode==='percent'?`${state.tipPercent}% × ${money(serviceDue())} services`:state.tipMode==='amount'?'Selected dollar tip':'Entered dollar tip'}
  function tipPickerHtml(){const percent=[0,10,15,18,20,25],amount=[0,5,10,20];return `<div class="tip-picker"><div class="tip-picker-head"><strong>Guest tip</strong></div><div class="tip-mode" role="group" aria-label="Choose tip entry type">${[['percent','% of services'],['amount','Dollar amount'],['custom','Custom']].map(([id,label])=>`<button type="button" data-action="tip-mode" data-value="${id}" class="${state.tipMode===id?'selected':''}" aria-pressed="${state.tipMode===id}">${label}</button>`).join('')}</div>${state.tipMode==='percent'?`<div class="tip-presets" role="group" aria-label="Tip percent">${percent.map(value=>`<button type="button" data-action="tip-percent" data-value="${value}" class="${Number(state.tipPercent)===value?'selected':''}" aria-pressed="${Number(state.tipPercent)===value}">${value===0?'No tip':value+'%'}</button>`).join('')}</div><p class="hint">Percent uses discounted services before wallet discounts, card fees, or tax.</p>`:state.tipMode==='amount'?`<div class="tip-presets" role="group" aria-label="Tip dollar amount">${amount.map(value=>`<button type="button" data-action="tip-amount" data-value="${value}" class="${Number(state.tipAmount)===value?'selected':''}" aria-pressed="${Number(state.tipAmount)===value}">${value===0?'No tip':money(value)}</button>`).join('')}</div>`:''}${tipAmountEntryHtml()}</div>`}

-status">${tipStatusText()}</p></div>`}
  function tipStatusText(){const rem=tipRemainingCents();return rem===0?`Allocated ${money(state.tip)} of ${money(state.tip)}`:rem>0?`${money(rem/100)} still to allocate`:`${money(-rem/100)} over the guest's tip`}

  const livePaymentMethodIds=['cash','credit','gift','crypto','split','zelle','cashapp','vlinkpay','applecash'];
  function paymentOptionsHtml(scope){
    const d=scope==='sale'?saleDraft():state,action=scope==='sale'?'sale-payment':'payment';
    if(!livePaymentMethodIds.includes(d.payment))d.payment='cash';
    const enabled=acceptedPaymentMethods().filter(([id])=>livePaymentMethodIds.includes(id));
    const primary=enabled.filter(([id])=>primaryPaymentIds.includes(id));
    const other=enabled.filter(([id])=>!primaryPaymentIds.includes(id));
    const chip=([id,label])=>`<button type="button" class="live-method live-method-${id} ${d.payment===id?'selected':''}" data-action="${action}" data-value="${id}" aria-pressed="${d.payment===id}"><img src="${livePaymentIconSources[id]}" alt="" width="20" height="20"><span>${esc(label)}</span></button>`;
    return `<div class="live-method-options"><div class="live-method-row" role="group" aria-label="Payment methods">${primary.map(chip).join('')}${other.length?`<button type="button" class="live-method live-method-more" data-action="${scope==='sale'?'sale-payment-more':'payment-more'}" aria-expanded="${Boolean(d.paymentMoreOpen)}">··· ${d.paymentMoreOpen?'Less':'More'}</button>`:''}</div>${other.length&&d.paymentMoreOpen?`<div class="live-method-row live-method-extra" role="group" aria-label="More payment methods">${other.map(chip).join('')}</div>`:''}</div>`;
  }
  function paymentEstimateHtml(){return `<div class="estimate-intro"><strong>Compare payment totals</strong><span>Choose an accepted Nexora payment method. The amount under each name is the estimate for this ticket.</span></div>${paymentOptionsHtml('service')}<p class="estimate-footnote">Discounts and card fees apply to the selected method. Tip is included; tax is not calculated in this prototype.</p>`}

  function paymentNoteHtml(){if(state.payment==='vlinkpay')return `<p class="payment-note">The guest pays from their VLINKPAY Wallet using a QR or app approval. The configured payment discount applies; wait for confirmed payment before finishing.</p>`;if(state.payment==='credit')return `<p class="payment-note">Credit Card adds ${feeLabel()} to its service amount after any configured payment discount. Tip is excluded from the fee base.</p>`;if(walletEligible(state.payment))return `<p class="payment-note">This method saves ${money(walletDiscount())} on discounted services. Tip is added afterward. Confirm the external transfer before completing payment.</p>`;if(state.payment==='crypto')return `<p class="payment-note">Crypto is available in Nexora POS. This prototype shows the estimate only; the live system must confirm the transfer before a sale is paid.</p>`;if(state.payment==='gift')return `<p class="payment-note">Gift Card follows the existing gift card flow. Any salon discount is shown in the estimate; confirm the gift card balance.</p>`;if(state.payment==='split')return `<div class="form-field split-field"><label for="credit-portion">Credit Card portion of discounted services</label><input class="input" id="credit-portion" type="number" min="0" step="0.01" value="${state.creditPortion}"><label for="split-cash-portion">Cash portion (optional, when other method is not Cash)</label><input class="input" id="split-cash-portion" type="number" min="0" step="0.01" value="${state.splitCashPortion||0}"><label for="split-other-method" class="split-other-label">Other payment method</label><select class="select" id="split-other-method">${splitAlternatives().map(([id,label])=>`<option value="${id}" ${state.splitOtherMethod===id?'selected':''}>${label}</option>`).join('')}</select><p class="hint">The card fee applies only to the card service portion. A payment discount applies to its configured portion. Tip is excluded from both bases.</p></div>`;return `<p class="payment-note">Any salon payment discount is included in the estimate. Tip is added afterward.</p>`}
  function summaryHtml(){return `<aside class="panel summary-panel" aria-label="Checkout summary"><h3 class="panel-title"><span class="step">3</span> Payment &amp; checkout</h3><div class="summary-block"><p class="summary-title">Customer</p><div class="summary-customer" id="summary-customer">${esc(customerReady()?state.customerName:'Find customer by phone')}</div><p class="hint" id="summary-phone">${state.phone?esc(displayPhone(state.phone)):''}</p></div><div class="summary-block"><p class="summary-title">Work by technician</p><div id="summary-lines">${summaryRowsHtml()}</div></div><div class="summary-block"><div id="tip-picker-controls">${tipPickerHtml()}</div><div class="form-field tip-order-discount"><label for="discount">Order discount</label><input class="input" type="number" id="discount" min="0" step="0.01" value="${state.discount}"></div>${sensitiveCheckout()?`<p class="approval-note">Manager PIN required to approve discounts or changed prices.</p>`:''}<div class="summary-line"><span>Services & add-ons</span><strong id="gross">${money(gross())}</strong></div><div class="summary-line"><span>Service discounts</span><strong id="line-discounts">−${money(lineDiscountTotal())}</strong></div><div class="summary-line"><span>Order discount</span><strong id="discount-value">−${money(state.discount)}</strong></div><div class="summary-line"><span>Guest tip</span><strong id="tip-value">${money(state.tip)}</strong></div></div><div class="summary-block"><p class="summary-title">Tip allocation</p><div id="tip-allocation">${tipAllocationHtml()}</div></div><div class="summary-block"><p class="summary-title">Payment method & estimate</p><div id="payment-estimates">${paymentEstimateHtml()}</div><div id="payment-note">${paymentNoteHtml()}</div><div id="service-customer-wallet-panel">${serviceWalletPanelHtml()}</div>${giftPanelHtml()}<div class="summary-line wallet-line"><span>Payment discount</span><strong id="wallet-discount-value">−${money(walletDiscount())}</strong></div><div class="summary-line fee-line"><span>Credit Card fee (${feeLabel()})</span><strong id="payment-fee">${money(paymentFee())}</strong></div><div class="total-line"><span>Total due</span><span id="total">${money(total())}</span></div></div><p class="review-warning" role="status" id="review-warning">${esc(state.warning)}</p><button type="button" class="btn btn-primary btn-wide" data-action="review">Review checkout · <span id="button-total">${money(total())}</span></button><p class="safe-note">${icon('info')} Demo only. No payment is collected and no salon data is changed.</p></aside>`}
  function checkoutStage(){const maximum=!customerReady()?1:!allServices().length||state.groups.some(group=>!group.tech)?2:3;state.checkoutStep=Math.min(Math.max(1,Number(state.checkoutStep)||1),maximum);return state.checkoutStep}
  function checkoutPreviewHtml(){return `<aside class="panel summary-panel checkout-preview" aria-label="Ticket preview"><div class="preview-heading"><span class="preview-icon">${icon('ticket')}</span><div><p class="summary-title">TICKET PREVIEW</p><h3>${esc(state.customerName)}</h3><span>${esc(displayPhone(state.phone))}</span></div></div><div class="preview-progress"><span class="done">${icon('check')} Customer found</span><span class="current">2 &nbsp; Assign technician and service</span><span>3 &nbsp; Payment and checkout</span></div><p class="preview-message">Choose a technician and add a main service. The price, discount, tip, and payment choices will appear here.</p></aside>`}
  function editorHtml(){const stage=checkoutStage();return `<section class="checkout-frame panel checkout-stage-${stage}" aria-label="Checkout flow"><div class="builder-head"><div><button type="button" class="back-link" data-action="back">${icon('arrow')} Back to ${state.checkoutReturn==='checkout'?'checkout list':state.checkoutReturn==='turn'?'Turn Board':state.checkoutReturn==='tickets'?'Tickets':state.checkoutReturn==='technicians'?'Technicians':'Overview'}</button><h2>${state.ticketId?`Checkout ticket #${state.ticketId}`:'New direct checkout'}</h2><p class="muted">${state.ticketId?'Review the ticket, adjust work, and choose payment.':'Find the customer, assign the work, and finish payment.'}</p></div><div class="flow-actions"><span class="direct-note">${icon('check')} ${state.ticketId?'Existing ticket':'No check-in required'}</span>${state.ticketId?`<button type="button" class="btn btn-secondary ticket-cancel" data-action="request-cancel-ticket" data-id="${state.ticketId}">Cancel ticket</button>`:''}</div></div><div class="checkout-progress" aria-label="Three checkout steps"><span class="${stage===1?'active':'done'}" ${stage===1?'aria-current="step"':''}><b>${stage>1?'✓':'1'}</b><span class="step-copy">Find customer</span></span><span class="${stage===2?'active':stage>2?'done':''}" ${stage===2?'aria-current="step"':''}><b>${stage>2?'✓':'2'}</b><span class="step-copy">Technician & services</span></span><span class="${stage===3?'active':''}" ${stage===3?'aria-current="step"':''}><b>3</b><span class="step-copy">Payment & checkout</span></span></div><div class="builder-grid"><div class="stack">${customerHtml()}${stage>=2?servicesHtml():''}</div>${stage===3?summaryHtml():stage===2?checkoutPreviewHtml():''}</div><div class="checkout-step-actions"><button type="button" class="btn btn-secondary" data-action="checkout-step-back">← ${stage===1?'Checkout list':stage===2?'Customer':'Services'}</button>${stage<3?`<p class="review-warning" role="status" id="review-warning">${esc(state.warning)}</p><button type="button" class="btn btn-primary" data-action="checkout-step-next">${stage===1?'Next · Services':'Next · Payment'} →</button>`:`<p class="checkout-next-hint">Review the total and payment method, then complete the demo checkout.</p>`}</div></section>`}

  function devNotesHtml(){return `<details class="dev-details"><summary>Developer handoff · updated flow and acceptance criteria</summary><div class="dev-content"><p><a href="./nexora-pos-developer-spec.md" target="_blank" rel="noopener">Open the full developer specification</a> for menu preferences, backend contracts, Turn Board, checkout, permissions, and acceptance checks.</p><h3>Connected demo flows · V33 continuation</h3><ul><li>Check-in creates or marks the same ticket used by Tickets, Turn Board, and Checkout. Direct checkout remains possible without check-in.</li><li>Turn Board uses checked-in staff, fewest turns and shift sequence, owner-configured rule and skill level, a manual skip trail, and reversal of the latest assignment. Production must perform assignment atomically and keep an immutable ledger.</li><li>Tickets tracks completed main services. The checkout picker uses the same full service catalog as Price Menu. Cancellation requires a reason and Manager approval for work in service or ready to pay.</li><li>Gift card lookup, issuance, split payment, refund, and wallet confirmation are demo states. Provider responses, PIN verification, receipt delivery, tax, and financial posting still require backend services.</li><li>sessionStorage restores demo work after a refresh in the same tab. Production must use authenticated, server-managed records and avoid storing real customer or payment data in browser storage.</li></ul><h3>Overview parity · V33</h3><p>Keep the live Nexora check-in metrics, guest sources, original check-in number, and searchable status table beneath the daily operation board. Only checked-in guests appear in this snapshot; direct checkout does not create a check-in. Mask customer phone numbers by default. The prototype uses illustrative data and does not import live Nexora customers.</p><h3>Checkout navigation and receipts · V32</h3><ul><li>Keep the three checkout steps explicit. Back and Next preserve the unsaved ticket; Next requires a named customer at step 1 and an assigned technician with a main service at step 2. Review validates final prices, allocations, and payment.</li><li>After a successful payment, keep the operator on a receipt confirmation screen. Provide Print receipt, SMS receipt, View saved receipt, and Done. Done returns to Checkout Customer for the next guest.</li><li>The local prototype opens the browser print dialog and previews SMS text without sending it. Production must use the configured receipt printer and SMS provider, verify the customer's delivery number and consent, report delivery failures, and allow later reprint or resend from Completed Services.</li></ul><h3>Nexora products placement · V31</h3><p>Put the Nexora products control in the Front Desk heading beside the quick checkout action. Keep the product panel hidden until opened so it takes no vertical space in daily POS work.</p><h3>Checkout Customer entry · V30</h3><p>Place + New checkout beside the open ticket count within Checkout Customer. Keep the global header shortcut on other Front Desk workspaces and use the same direct checkout flow for both entry points.</p><h3>Nexora payment choices · V28</h3><ul><li>Match the current Nexora POS checkout hierarchy: Cash, Card, Gift Card, Crypto, and Split Pay are primary. More reveals Zelle, Cash App, and Venmo. Keep VLINKPAY Wallet and salon-added methods in More when enabled.</li><li>Both checkout screens use the same salon enabled-method configuration and show an estimate on each choice. Crypto is a preview method; production must verify the transfer before completion.</li><li>The live Nexora Quick Split dialog supports multiple tenders. This prototype models Card plus optional Cash plus one other method, including a demo Gift Card. The live system still needs provider-backed settlement for each tender.</li></ul><h3>Progressive checkout layout · V27</h3><ul><li>Show one balanced frame with three fixed steps. Before phone lookup, center the customer form and keep service and payment controls hidden. After customer identification, show technician and service entry beside a compact ticket preview.</li><li>Show tip, discounts, payment estimates, and Review Checkout only after a main service is added. The progress indicator highlights the active step; the checkout calculation and validation remain shared across direct and existing-ticket flows.</li><li>When starting a new checkout or opening a ticket, select an enabled salon payment method as the default.</li></ul><h3>Salon payment configuration · V26</h3><ul><li>Owner configures accepted methods, custom method names, and per-method percentage or fixed-amount discounts in POS → Salon Settings → Payment Methods & Fees. The existing wallet discount is the inherited default for eligible wallets; explicit method rules override it without stacking.</li><li>Save requires Owner PIN. Both service checkout and Products & Other Sales show only enabled methods. If the selected method is disabled, switch the draft to another accepted method. Split Pay requires Credit Card plus another enabled method and applies each rule only to its portion.</li><li>Apply payment discounts after service and order discounts, before card fee and tip. Card fee uses the Credit Card portion after its configured payment discount. Record applied rates and amounts on paid receipts; production must validate settings and totals on the server.</li></ul><h3>Customer wallet payment · V25</h3><ul><li>Add VLINKPAY Wallet as its own payment method in service checkout and Products &amp; Other Sales. Keep Zelle, Venmo, and Cash App separate. The salon may include VLINKPAY in its configured wallet discount.</li><li>Show the amount payable from the customer's wallet, including the wallet share of Split Pay. Create a payment request only after the customer is identified. In production, present the real VLINKPAY QR/app approval and use a verified provider callback or server status to confirm it; cashier input cannot settle a real payment.</li><li>Block checkout and receipt creation while the wallet request is pending or stale. Recalculate the amount when items, discounts, tip, customer, or split portion change, and require a fresh request. Persist provider reference, amount, status, and applied discount on the paid order. Provide declined and insufficient-funds handling and another payment method in production.</li><li>The QR and confirmation controls here are demo placeholders. This file does not query a real wallet balance, initiate a real charge, or transfer funds.</li></ul><h3>Collapsible Nexora products · V24</h3><ul><li>Show a single compact Nexora products bar by default. Expand it only when the operator selects the bar; the 11 product shortcuts, layout choices, and product submenus live inside.</li><li>Closing the bar closes any product submenu. Opening and closing it must leave the customer, ticket, and checkout draft untouched. Keep the control keyboard accessible with an accurate expanded state.</li></ul><h3>Front desk header · V23</h3><ul><li>Remove the duplicate Salon Settings shortcut from the Front Desk page header. Salon Settings remains in POS → Salon Settings and keeps its Manager/Owner access checks.</li><li>Use that header position for New checkout. It opens the existing direct checkout flow from any non-editor Front Desk screen. While a checkout editor is open, show Checkout in progress instead so this shortcut cannot reset an active draft. The checkout list no longer repeats the New checkout button.</li></ul><h3>Product menu priority · V22</h3><ul><li>Show the three daily front desk actions first in each expanded product menu: AI Hub → Booking, Call Log, Customers; One QR → OneQR, Accept Payment, Receive Tips; Payments &amp; Payouts → Receive Payments, Payment Activity, Tips. Put campaigns, plans, setup, and reporting in a quieter secondary row.</li><li>These are workflow assumptions for the prototype, not measured usage. Validate order with salon operators and product analytics. Keep routes, account permissions, and POS draft state unchanged. Move the default top-level product order to POS, AI Hub, Payments, One QR, Gift Card Center, Support, then less frequent tools. Migrate only the previous unmodified default order; preserve any previously saved shortcut order.</li></ul><h3>Support channels at POS · V21</h3><ul><li>The Support product opens an in-POS panel. Operators choose POS, AI Voice, Credit Card, One QR, or Account &amp; Billing, then Call, Email / support ticket, or Live chat. Keep the active POS ticket visible and untouched.</li><li>The current Nexora Support page has a support-ticket form, issue-type picker, and FAQ. The form offers an average response time of within 24 business hours. Direct team phone numbers, live chat, and topic-specific email routes were not visible there; connect and verify them before enabling real Call or Chat actions. Never invent a phone number or email address.</li><li>Production should route each topic to its assigned support queue, show business hours and callback or ticket fallback, create a reference number, and require operator consent before sending customer details or diagnostics. Card support must not collect full card numbers in ordinary tickets or chat.</li></ul><h3>Nexora products inside POS · V20</h3><ul><li>The POS launcher exposes all observed top-level Nexora products: POS, One QR, AI Hub, Payments & Payouts, Reviews, Gift Card Center, Dashboard, Analytics, Settings, News & Library, and Support. One QR, AI Hub, and Payments & Payouts open grouped submenus using observed live routes.</li><li>External products open in new tabs without customer or ticket data in the URL. POS opens the local POS menu. Cards and Compact preferences persist in this prototype. Production should use named internal routes, preserve draft checkout state, and apply server-side access permissions to sensitive pages.</li></ul><h3>Products & Other Sales · V17</h3><ul><li>Quick sale supports retail products, services by salon staff, owner or manager, visiting technician, guest helper, and house charges. A service can name a distinct assistant. The customer is found by phone and named before completion.</li><li>Each line snapshots type, catalog ID/SKU where applicable, quantity, unit price, performer type and name, assistant, and line total. The receipt snapshots customer, operator, time, payment breakdown, tip, wallet savings, card fee, and total.</li><li>Manager PIN is requested for custom services, manager/guest-worker attribution, other charges, discounts, and product price overrides; production should log approval with individual identity and reason. Use stable staff and guest-worker IDs in production and snapshot names/roles on each line. Tip allocations and separate payout status must be stored with the paid order. Production must save a paid order atomically with payment confirmation, inventory movements for products, and an audit trail. Visiting workers and assistants must not silently enter staff payroll; their settlement requires a separate workflow. Validate gift card balance and external transfer confirmation. Reversals need a linked refund record.</li></ul><h3>Front Desk Overview · V16</h3><ul><li>Front Desk Overview opens on a guest status board: Waiting, In service, and Ready to pay. Each guest card shows name, ticket, arrival time, service, assigned technician, and a base service estimate.</li><li>Keep POS shortcuts inside a compact expandable menu. Cards and Compact remain available. Show the technician roster and selected ticket beside the guest board.</li><li>Reception can find an open ticket by phone, name, or ticket number; identify a returning guest; create a named new guest; or start direct checkout without check-in. Stored customer phone details stay masked in Overview results.</li><li>Guest arrival creates a waiting demo ticket only after phone lookup and name confirmation. Selecting a technician can add service to the selected ticket or create a new ticket. Assignment moves a waiting ticket into service.</li><li>A ticket may move from In service to Ready to pay and back. Checkout can open from the selected ticket. Completing a demo checkout removes it from active tickets. Production must persist status transitions, audit changes, and prevent duplicate payment on the server.</li><li>On narrow screens the three status lanes become tabs. Status uses color plus text. The prototype changes session data only.</li></ul><h3>Wallet discount & tip choices · V16</h3><ul><li>Owner configures the wallet discount percentage and which of Zelle, Venmo, and Cash App qualify under POS → Salon Settings → Payment Methods & Fees. Saving also sets the salon default tip allocation rule and requires Owner PIN in production.</li><li>Apply wallet discount after service and order discounts to the eligible wallet service amount, before tip. Do not discount Cash, Gift Card, or Credit Card. For Split Pay, discount only the eligible wallet portion and apply the card fee only to the card portion. Show wallet savings as a separate line in estimates and final review.</li><li>Guest tip entry offers percent presets, dollar presets, and custom amount. Percent uses discounted services before wallet savings, card fee, or tax, and recalculates when service or order discounts change.</li><li>For multiple technicians, calculate tip shares by discounted service value, 50/50 for two, equal per technician, or manual amounts. A shared main service gives half of its value to each participating technician; its add-ons remain with the technician who performed them. Allocate rounding cents deterministically and require manual entries to match the guest tip exactly.</li><li>The 50/50 rule uses equal division if a ticket has more than two technicians. Production must verify an external wallet transfer before marking a payment complete, and preserve the applied wallet rate, savings, selected tip entry, split rule, and each technician's tip amount on the completed transaction and receipt.</li></ul><h3>Tóm tắt yêu cầu</h3><p>Cash dùng giá menu; Zelle, Venmo và Cash App có thể được giảm giá wallet theo cấu hình tiệm; Credit Card cộng mức phí cấu hình trong Salon Settings (mặc định 3%) trên tiền dịch vụ sau giảm giá trước tip. Menu giá hiển thị hai mức giá cho toàn bộ danh mục dịch vụ. Tip khách có thể chọn phần trăm, số tiền preset hoặc custom; tip cho nhiều thợ có thể chia theo giá trị dịch vụ, 50/50, chia đều, hoặc nhập tay. Tổng chia phải bằng tip khách trả. Mỗi dịch vụ và add-on có thể giảm giá riêng theo số tiền hoặc phần trăm, bên cạnh giảm giá toàn hóa đơn. Checkout trực tiếp bắt đầu bằng số điện thoại. Khách cũ: hiện sẵn đúng tên từ hồ sơ, còn số điện thoại lưu trong hồ sơ được che đến khi có phê duyệt. Khách mới: báo khách mới và bắt buộc nhập tên. Chọn thợ một lần cho nhóm dịch vụ; add-on/custom đặt ngay dưới dịch vụ chính và tự dùng thợ đó. Nếu thợ khác làm add-on, thêm nhóm thợ mới, ghi rõ phần việc và liên kết với dịch vụ chính. Không tạo check-in giả.</p><h3>Ticket cancellation</h3><ul><li>Show Cancel ticket on each unpaid open ticket in Checkout Customer. Open a confirmation dialog naming the ticket and customer, and warn when service is in progress.</li><li>Confirmation changes the ticket status to Cancelled and removes it from open queues. Preserve its check-in history and an audit record. Cancelling a ticket does not collect payment or issue a refund. Paid transactions require a separate refund flow.</li></ul><h3>Checkout layout</h3><ul><li>Present checkout inside one framed workspace with three steps: customer, technician and services, and payment and checkout.</li><li>Payment comparison and final review action belong to step 3. Use internal dividers instead of separate top-level cards for each step.</li></ul><h3>Technician workspace</h3><ul><li>Use a compact full-width selected-technician strip above the assignment form. Lay customer and service inputs side by side on wide screens, with preview and ticket actions in one footer row. Stack these sections on narrow screens.</li><li>Add a Technicians shortcut inside the POS menu, separate from Turn Board and Staffs Clock.</li><li>Show the salon roster with working or available state derived from open ticket assignments. Clicking the technician opens a new-ticket flow: required phone lookup, customer name for new guests, service selection, and optional second technician sharing the same service.</li><li>Create Ticket saves a prototype ticket without check-in. Create Ticket &amp; Checkout opens that ticket in the checkout builder with customer, service, lead technician, and co-worker loaded. A shared service is charged once and both technicians are eligible for manual tip allocation.</li><li>Keep Add to Existing Ticket as a separate tab for selecting an open ticket and a service from the shared catalog.</li><li>Assigning work adds the service to the selected technician's group on the ticket. The checkout view must preload the assigned service, price, customer, and technician. This prototype does not write to live tickets.</li></ul><h3>Owner Mode, customer privacy, and PIN</h3><p>Research and full acceptance checklist: <span>Nexora POS security handoff — tài liệu chưa có trong bộ nguồn</span>. The matrix below is a proposed policy for developer review.</p><ul><li>Customer History and checkout mask stored phone numbers and emails by default. Full contact and private notes require a record-specific Manager/Owner PIN plus a reason; the demo reveal expires after 30 seconds and clears on navigation.</li><li>Owner Mode is a separate POS account state, not a shared manager code. Only Owner Mode can open Access & PIN and Payment Methods & Fees. Manager can approve configured operational actions.</li><li>Production must withhold protected fields from unauthorized API responses, search results, printouts, exports, and browser caches; visual masking alone is insufficient.</li><li>Place the proposed Access & PIN page under POS → Salon Settings, directly after the existing Roles & Permissions item. Nexora already lets the owner assign a POS Role in Salon Settings → Staff and edit role permissions in Roles & Permissions. PIN setup and action-specific PIN rules still need to be built.</li><li>Owner setup: assign each staff member a POS Role, invite owners and managers to create their own individual PIN, then select action approval rules and save them with Owner approval. Do not expose anyone’s PIN to the salon owner or other staff.</li><li>Use individual Owner and Manager accounts and time-limited sessions. Front Desk can run routine check-in, assignment, and unchanged checkout.</li><li>Discounts, custom services, and price changes request a Manager or Owner PIN at checkout review. Saving a Credit Card fee requires Owner PIN. A PIN approval applies only to the action and values shown; changing the action or values requires a new approval.</li><li>Production must verify authentication, permissions, approval, and transaction values on the server. Rate-limit PIN attempts, audit operator and approver identities, and never store a PIN in browser storage. This local prototype accepts any 4–6 digits only to demonstrate the flow.</li><li>A demo refund uses Manager PIN and records a reversal for review; no live money moves. Production needs provider-verified refunds, voids, cash adjustments, and manual gift card balance changes. Owner PIN applies to salon-wide pricing, role changes, and PIN reset.</li></ul><h3>POS shortcut menu</h3><ul><li>Mirror Nexora’s existing structure: Front Desk opens on Overview and contains Check-in, Tickets, Turn Board, Checkout Customer, Gift Card Center, Completed Services, Appointments, Estimate, Staffs Clock, and Customer History. Keep the proposed Technicians and Price Menu shortcuts in that same Front Desk menu.</li><li>Under POS → Salon Settings, render the existing sections as horizontal tabs: Salon Information, SMS Settings, Staff, Services, Roles & Permissions, and Staff Levels. Add proposed Access & PIN beside Roles & Permissions and proposed Payment Methods & Fees in the same tab bar. Existing tab content in this local file is a reference preview; live Nexora remains the source of truth.</li><li>Show responsive icon cards with distinct colors based on the NEXORA palette. Keep Checkout Customer prominent.</li><li>Provide Cards and Compact layout choices for POS shortcuts and Nexora products. Keep the shortcut menu visible without an Arrange button or reorder controls. Preserve the three checkout steps in order.</li><li>Make navigation operable with keyboard, visible focus, reduced motion support, and responsive wrapping. Avoid nested buttons.</li></ul><h3>Customer identification</h3><ul><li>Direct checkout starts with a required phone lookup. Normalize the phone number and search the current customer directory.</li><li>If there is a match, show the stored customer name automatically. If there is no match, show <b>New customer</b> and require a name before payment. Save the new customer through the normal customer creation flow.</li><li>Do not create a check-in event just to make checkout work. Existing tickets retain their linked customer information.</li></ul><h3>Technician and add-on model</h3><ul><li>Group work by technician. Select a technician once, then add one or more main services under that technician.</li><li>Put add-ons and custom add-ons inside the relevant main service. They inherit that service’s technician. Adding six or seven add-ons must not prompt for technician six or seven times.</li><li>When a different technician performs an add-on, use <b>Add another technician & their work</b>, record the add-on in their group, and link it to the main service. A second technician can have only an add-on; do not create a fake main service.</li><li>Represent each line with its service or custom description, price, parent service (if add-on), and effective technician. The backend must validate prices and totals.</li></ul><h3>Payment pricing and price menu</h3><ul><li>At checkout show estimated totals for each payment method before the operator selects one. Recompute them on changes to services, add-ons, service or order discounts, tip, card fee configuration, and the Split Pay card portion.</li><li>Each estimate shows the proposed total and any card fee. Selecting an estimate sets the payment method for review; review and receipt use the same selected calculation. Split Pay estimates must identify card and other service portions and allow choosing the fee-free method. Tip is excluded from the card fee base. The prototype omits tax; production must use the salon's configured tax calculation consistently in every estimate.</li><li>Place the salon-level setting at POS → Salon Settings → Payment Methods &amp; Fees. Store enabled status and decimal fee percentage per salon. Both checkout and Price Menu must read the same saved setting, not a hard-coded value.</li><li>Changing the setting updates new checkout calculations and menu card prices. Keep the applied rate and amount on the completed payment for audit and refunds; do not recalculate completed transactions.</li><li>Cash, Zelle, Venmo, and Cash App have no card fee. Eligible Zelle, Venmo, and Cash App payments receive the configured wallet discount on discounted services before tip. Credit Card adds the configured percentage to discounted service charges before tip in this prototype. A split payment adds the configured card percentage only to its Credit Card service portion and applies any wallet discount only to its eligible wallet service portion.</li><li>Show the card fee as a separate line before the final total. Recalculate when payment method, services, or discounts change. Gift Card follows the existing gift card flow.</li><li>The customer-facing service list shows only standard salon menu prices, plus a short note that the final amount is compared at checkout. The Menu vs Credit Card view shows both the standard menu price and estimated Credit Card price for each service. Production prices must come from the shared service catalog, not a copied list.</li></ul><h3>Gift Card Center</h3><p>Add Gift Card Center to the same POS action menu as Checkout Customer, Tickets, and the other Front Desk tabs. The Gift Card payment method in checkout should use the existing gift card module; this prototype uses demo balances for lookup, issue, redemption, and refund display only.</p><h3>Discount and tip rules</h3><ul><li>Allow an amount or percentage discount on each service and add-on during service selection. Keep the optional order discount at payment summary. Show original price, discount, and final amount.</li><li>When multiple technicians worked on the guest, offer proportional service value, 50/50 for two technicians, equal per technician, and manual amounts. The salon selects a default. Manual amounts must total the guest tip to the cent before review.</li><li>With one technician, assign the full tip to that technician. Attribute add-ons to their effective technician for reporting and payout.</li><li>Validate discount bounds and recompute totals, tax, and commission on the server. Prevent negative line totals.</li></ul><h3>Acceptance checks</h3><ul><li>Phone lookup → returning customer’s name appears; unknown phone → new customer name is required.</li><li>Cannot review without a matched/new named customer, a technician, and at least one main service. Same-technician add-ons inherit the main service's technician. Add-ons by another technician explicitly name that technician and link to the main service.</li><li>Existing tickets preload the customer, technicians, services, and add-ons. Direct and existing ticket checkout share payment, receipt, reporting, and commission handling.</li><li>Customer Price Menu and the service picker show only base menu prices; Menu vs Credit Card shows base and card price. Checkout compares payment methods before review.</li><li>Compare Cash, wallet, Credit Card, and Split Pay estimates on the same ticket. Verify that changing discounts or tip updates every estimate, and Split Pay adds the fee only to the card portion.</li><li>Prevent duplicate payment and retain draft state if the operator leaves mid-checkout. Test keyboard use, mobile layout, touch targets, and contrast.</li></ul><p><b>Prototype boundaries:</b> Phone numbers, customers, technicians, and tickets are demo data. The lookup is simulated. This file keeps demo tickets, receipts, settings, and an active checkout draft in this browser tab using sessionStorage. It does not sync across devices or process payment.</p></div></details>`}
  function render(){if(state.editor)recomputeTip();main.innerHTML=shellHtml();saveDemoSession();document.querySelectorAll('.side-sub button[data-id]').forEach(button=>{button.classList.toggle('current',button.dataset.id===(isSettingsSection(state.section)?'settingsoverview':'overview'))});const roleButton=document.getElementById('session-role');if(roleButton)roleButton.textContent=`${state.authRole==='owner'?'Owner Mode':roleLabel(state.authRole)} · Switch`;renderModal()}
  function startNew(prefill){clearSensitiveView();state.checkoutReturn=['overview','tickets','turn','technicians'].includes(state.section)?state.section:'checkout';state.section='checkout';state.editor=true;state.checkoutStep=prefill?.status==='existing'?2:1;state.ticketId=null;state.phone=prefill?.phone||'';state.customerStatus=prefill?.status||'idle';state.customerName=prefill?.name||'';state.groups=[newGroup()];state.tip=0;state.tipMode='percent';state.tipPercent=0;state.tipAmount=0;state.tipSplits={};state.tipAllocationMode=state.tipSplitDefault;state.discount=0;state.payment=acceptedPaymentMethods().find(([id])=>id!=='split')?.[0]||'cash';state.paymentMoreOpen=!primaryPaymentIds.includes(state.payment);state.creditPortion=0;state.splitCashPortion=0;state.giftCardCode='';state.splitOtherMethod=splitAlternatives()[0]?.[0]||'cash';state.walletRequest=null;state.warning='';state.receiptNotice='';render()}
