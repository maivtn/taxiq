<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chọn nhân viên - Bitcoin Nail Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }

    .staff-card { transition: all 0.18s ease; cursor: pointer; }
    .staff-card:hover { border-color: #c4b5fd; background: #faf7ff; transform: translateY(-1px); }
    .staff-card.selected { border-color: #6c4df6; background: #f5f3ff; box-shadow: 0 0 0 3px #ede9fe; }
    .staff-card .check-icon {
      width: 18px; height: 18px;
      border: 2px solid #d1d5db;
      border-radius: 50%;
      transition: all 0.15s ease;
      display: flex; align-items: center; justify-content: center;
      position: absolute; top: 8px; right: 8px;
    }
    .staff-card.selected .check-icon { border-color: #6c4df6; background: #6c4df6; }
    .staff-card.selected .check-icon svg { display: block; }
    .staff-card .check-icon svg { display: none; }

    .btn-glow-pulse { position: relative; }
    .btn-glow-pulse::after {
      content: '';
      position: absolute;
      inset: -2.5px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #6c4df6, #16b7ff);
      z-index: -1;
      opacity: 0.55;
      filter: blur(6px);
      animation: pulseGlow 2.5s infinite alternate;
    }
    @keyframes pulseGlow {
      from { opacity: 0.4; filter: blur(5px); }
      to   { opacity: 0.75; filter: blur(9px); }
    }

    .list-scroll::-webkit-scrollbar { width: 3px; }
    .list-scroll::-webkit-scrollbar-track { background: transparent; }
    .list-scroll::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 99px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-teal-50">

  <div class="max-w-md mx-auto px-3 py-4">

    <!-- Title -->
    <div class="text-center mb-4">
      <h1 class="text-lg font-extrabold text-gray-800 tracking-wide">Select the staff member you'd like to tip.</h1>
    </div>

    <!-- Search -->
    <div class="relative mb-3">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        id="searchInput"
        type="text"
        placeholder="Search staff..."
        oninput="filterStaff()"
        class="w-full pl-9 pr-3 py-2.5 text-sm text-gray-700 bg-white border border-gray-200 rounded-xl focus:outline-none focus:border-violet-400 placeholder-gray-300 transition"
      />
    </div>

    <!-- Multi-tip notice (shown when shop has no payout and user tries to select 2+) -->
    <div id="noPayoutNotice" class="hidden mb-2 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 flex items-start gap-2">
      <svg class="w-4 h-4 text-amber-500 shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
      </svg>
      <p class="text-xs text-amber-700 leading-relaxed">Tiệm chưa cài đặt tài khoản nhận tip — chỉ có thể tip từng thợ riêng lẻ.</p>
    </div>

    <!-- Staff List -->
    <div id="staffList" class="grid grid-cols-2 gap-2 pr-0.5">
      <!-- rendered by JS -->
    </div>

    <!-- NEXT Button -->
    <div class="mt-3">
      <button
        id="nextBtn"
        onclick="goNext()"
        class="w-full py-3 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-all duration-200"
        style="background: linear-gradient(to right, #10b981, #0d9488); font-size: 0.85rem;"
      >
        <span id="nextBtnLabel">NEXT</span>
      </button>
    </div>
  </div>

  <script>
    const PAGE_PARAMS = new URLSearchParams(window.location.search);
    // Multi-select enabled by default, disabled only when URL has ?isMulti=0
    const SHOP_HAS_PAYOUT = PAGE_PARAMS.get('isMulti') !== '0';

    const STAFF = [
      { name: 'David L.',  role: 'Nail Technician',         initial: 'D', from: '#7c3aed', to: '#6d28d9' },
      { name: 'Sunny K.',  role: 'Senior Gel Specialist',   initial: 'S', from: '#0ea5e9', to: '#3b82f6' },
      { name: 'Jenny T.',  role: 'Senior Nail Technician',  initial: 'J', from: '#ec4899', to: '#be185d' },
      { name: 'Kevin V.',  role: 'Acrylic & Gel Specialist', initial: 'K', from: '#f59e0b', to: '#d97706' },
      { name: 'Mary S.',   role: 'Nail Technician',         initial: 'M', from: '#6c4df6', to: '#4f46e5' },
      { name: 'Lisa N.',   role: 'Gel & Extensions',        initial: 'L', from: '#10b981', to: '#0d9488' },
    ];

    const PRESELECTED_STAFF = (() => {
      try { return JSON.parse(PAGE_PARAMS.get('staffList') || '[]'); } catch { return []; }
    })();

    let selectedIndices = new Set(
      PRESELECTED_STAFF
        .map(selected => STAFF.findIndex(s => s.name === selected.name && (!selected.role || s.role === selected.role)))
        .filter(idx => idx >= 0)
    );
    let filteredStaff = [...STAFF];

    function renderList(list) {
      const container = document.getElementById('staffList');
      if (list.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-center text-sm text-gray-300 py-8">Không tìm thấy nhân viên</p>`;
        return;
      }
      container.innerHTML = list.map((s) => {
        const origIdx = STAFF.indexOf(s);
        const isSel = selectedIndices.has(origIdx);
        return `
          <div class="staff-card relative ${isSel ? 'selected' : ''} bg-white border-2 border-gray-100 rounded-xl p-2.5 flex flex-col items-center text-center gap-1.5"
               onclick="toggleStaff(${origIdx})">
            <div class="check-icon">
              <svg class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white text-lg font-bold shadow-md select-none"
                 style="background: linear-gradient(135deg, ${s.from}, ${s.to})">
              ${s.initial}
            </div>
            <div class="min-w-0 w-full">
              <p class="text-sm font-bold text-gray-800 leading-tight truncate">${s.name}</p>
              <p class="text-xs text-gray-400 leading-tight mt-0.5 truncate">${s.role}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateNextBtn() {
      const count = selectedIndices.size;
      document.getElementById('nextBtnLabel').textContent = count > 1 ? `NEXT (${count})` : 'NEXT';
    }

    function toggleStaff(idx) {
      const isMultiAttempt = !selectedIndices.has(idx) && selectedIndices.size >= 1;

      if (isMultiAttempt && !SHOP_HAS_PAYOUT) {
        // Show notice, don't allow adding
        const notice = document.getElementById('noPayoutNotice');
        notice.classList.remove('hidden');
        notice.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: 250 });
        return;
      }

      // Hide notice if valid selection
      document.getElementById('noPayoutNotice').classList.add('hidden');

      if (selectedIndices.has(idx)) {
        selectedIndices.delete(idx);
      } else {
        selectedIndices.add(idx);
      }

      renderList(filteredStaff);
      updateNextBtn();
    }

    function filterStaff() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      filteredStaff = q
        ? STAFF.filter(s => s.name.toLowerCase().includes(q) || s.role.toLowerCase().includes(q))
        : [...STAFF];
      renderList(filteredStaff);
    }

    function goNext() {
      if (selectedIndices.size === 0) {
        document.getElementById('staffList').animate(
          [{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }],
          { duration: 300 }
        );
        return;
      }

      const selected = [...selectedIndices].map(i => STAFF[i]);
      const isMulti = selected.length > 1;

      const params = new URLSearchParams();
      params.set('isMulti', isMulti ? '1' : '0');
      params.set('staffList', JSON.stringify(selected));

      window.location.href = 'tip.html?' + params.toString();
    }

    renderList(STAFF);
    updateNextBtn();
  </script>
</body>
</html>
