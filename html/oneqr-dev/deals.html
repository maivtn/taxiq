<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>HTML One QR Dev — Search Deals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/tom-select/tom-select.css">
  <link rel="stylesheet" href="assets/discovery.css">
  <link rel="stylesheet" href="assets/nearby.css">
  <link rel="stylesheet" href="assets/search-deals.css">
  <link rel="stylesheet" href="assets/bottom-nav.css">
  <link rel="stylesheet" href="assets/icons.css">
  <link rel="stylesheet" href="assets/discovery-filters.css">
  <script src="assets/vendor/tom-select/tom-select.complete.min.js" defer></script>
  <script src="assets/icons.js" defer></script>
  <script src="assets/deal-catalog.js" defer></script>
  <script src="assets/search-deals.js" defer></script>
  <script src="assets/discovery.js" defer></script>
  <script src="assets/bottom-nav.js" defer></script>
</head>
<body class="nearby-page search-page" data-discovery-page="deals">
  <!-- Reference: https://test-web.nexoratouch.com/o/bitcoin-nail-bar-3/deals -->

  <main class="page">
    <div class="shop">
      <header class="nearby-toolbar">
        <a class="nearby-back" href="index.html" data-local-page="index.html"><span class="icon icon-back" aria-hidden="true"></span><span data-search-copy="mainMenu">Main Menu</span></a>
        <h1>Search Deals</h1>
        <div class="language" hidden>
          <button class="language-toggle" id="languageToggle" type="button" aria-label="Language" data-copy-aria="language" aria-haspopup="listbox" aria-controls="languageMenu" aria-expanded="false"><img class="icon" src="assets/icons/oneqr/issue-2040-oneqr-globe-2-3d.png" alt="" draggable="false"><span class="language-code" id="languageCode">EN</span></button>
          <div class="language-menu" id="languageMenu" role="listbox" aria-label="Language" data-copy-aria="language" hidden>
            <button class="language-option" type="button" role="option" data-language="en" aria-selected="true"><span>English</span><img class="icon" src="assets/icons/oneqr/issue-2040-oneqr-check-3d.png" alt="" draggable="false"></button>
            <button class="language-option" type="button" role="option" data-language="vi" aria-selected="false"><span>Tiếng Việt</span><img class="icon" src="assets/icons/oneqr/issue-2040-oneqr-check-3d.png" alt="" draggable="false"></button>
          </div>
        </div>
      </header>

      <div class="discovery-content">
        <form class="search-form" id="searchForm" role="search">
          <label class="sr-only" for="dealSearch" data-search-copy="searchPlaceholder">What would you like? e.g. milk tea nearby</label>
          <input id="dealSearch" name="q" type="search" maxlength="100" autocomplete="off" enterkeyhint="search" placeholder="What would you like? e.g. milk tea nearby" data-search-placeholder="searchPlaceholder">
          <button class="search-submit" type="submit" data-search-copy="find">Find</button>
        </form>
        <div class="search-suggestions" id="searchSuggestions" aria-label="Search suggestions" data-search-aria="suggestions"></div>
        <p class="nearby-competitors search-guide" id="searchGuide"></p>
        <div class="search-parsed" id="searchParsed" hidden></div>
        <p class="nearby-competitors" id="searchCompetitors" role="status" hidden></p>
        <p class="sr-only" id="searchCount" role="status" aria-live="polite"></p>
        <ul class="nearby-offers" id="searchOffers"></ul>
        <form class="search-wish" id="searchWish" novalidate hidden>
          <h2 id="searchWishTitle"></h2>
          <p data-search-copy="wishHint">Leave your phone number — when a nearby business has a matching deal, you receive one message. Nearby businesses also see this request.</p>
          <label class="sr-only" for="wishPhone" data-search-copy="phone">Phone number</label>
          <input id="wishPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="(713) 555-0142" aria-describedby="wishPhoneError">
          <p class="search-phone-error" id="wishPhoneError" role="alert" data-search-copy="phoneError" hidden>Enter a valid phone number.</p>
          <button class="search-submit" type="submit" id="wishSubmit"><img class="icon" src="assets/icons/oneqr/issue-2040-oneqr-wand-2-3d.png" alt="" draggable="false"><span id="wishSubmitLabel" data-search-copy="wish">Post a request</span></button>
          <p class="search-wish-status" id="wishStatus" role="status" hidden></p>
        </form>
        <details class="area-filters">
          <summary data-copy="areaRadius">Area &amp; radius</summary>
          <div class="location-filters">
            <nav class="discovery-tabs" aria-label="Explore" data-copy-aria="nav">
              <a class="discovery-tab nearby-tab" href="nearby.html" data-local-page="nearby.html"><img class="icon" src="assets/icons/oneqr/issue-2040-oneqr-map-pin-3d.png" alt="" draggable="false"><span data-copy="nearbyNav">Nearby</span></a>
              <a class="discovery-tab" href="deals.html" data-local-page="deals.html" aria-current="page"><img class="icon" src="assets/icons/oneqr/issue-2040-oneqr-ticket-3d.png" alt="" draggable="false"><span data-copy="dealsNav">Search Deals</span></a>
            </nav>
            <div class="filter-row">
              <span class="filter-label" data-copy="distancesFrom">Distances from</span>
              <button class="chip origin-shop" type="button" data-origin="shop" aria-pressed="true"><img class="icon" src="assets/icons/oneqr/issue-2040-oneqr-map-pin-3d.png" alt="" draggable="false"><span>Bitcoin Nail Bar</span></button>
              <button class="chip" type="button" data-origin="mine" aria-pressed="false"><img class="icon" src="assets/icons/oneqr/issue-2040-oneqr-map-pin-3d.png" alt="" draggable="false"><span data-copy="myLocation">My location</span></button>
            </div>
            <div class="discovery-selects">
              <div class="discovery-select-radius">
                <label class="sr-only" id="radiusFilterLabel" for="radiusFilter" data-copy="radius">Radius</label>
                <select id="radiusFilter">
                  <option value="" data-copy="radius">Radius</option>
                  <option value="1">1 mi</option>
                  <option value="3">3 mi</option>
                  <option value="5">5 mi</option>
                  <option value="10">10 mi</option>
                  <option value="25">25 mi</option>
                  <option value="50">50 mi</option>
                </select>
              </div>
              <div class="discovery-select-industry">
                <label class="sr-only" id="industryFilterLabel" for="industryFilter" data-copy="industryFilter">Industry</label>
                <select id="industryFilter">
                  <option value="all" data-copy="allIndustries" data-icon="store">All industries</option>
                  <option value="food" data-copy="industryFood" data-icon="food">Food &amp; drinks</option>
                  <option value="auto" data-copy="industryAuto" data-icon="auto">Auto</option>
                  <option value="family" data-copy="industryFamily" data-icon="partner">Family &amp; pets</option>
                  <option value="health" data-copy="industryHealth" data-icon="health">Health</option>
                  <option value="shop" data-copy="industryShop" data-icon="shopping">Shopping</option>
                  <option value="fastfood" data-copy="industry" data-icon="food">Fast food &amp; sandwiches</option>
                </select>
              </div>
            </div>
            <p class="location-warning" id="locationWarning" role="status" hidden></p>
          </div>
        </details>
      </div>
    </div>
  </main>
  <dialog class="business-dialog" id="searchOfferDialog" aria-labelledby="searchOfferTitle">
    <div class="dialog-header"><h2 id="searchOfferTitle"></h2><button class="dialog-close" id="searchOfferClose" type="button" aria-label="Close" data-search-aria="close"><span class="icon icon-close" aria-hidden="true"></span></button></div>
    <div class="dialog-content" id="searchOfferDetail"></div>
    <div class="dialog-footer"><a class="outline-link" href="index.html" data-local-page="index.html" data-search-copy="mainMenu">Main Menu</a></div>
  </dialog>
</body>
</html>
