<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services Menu | Bitcoin Nail Bar</title>
  <style>
    :root {
      --ink: #0a0a0c;
      --ink-soft: #1a1510;
      --cream: #fff8ea;
      --muted: #c4b9a5;
      --gold: #c9a15a;
      --gold-light: #f3d995;
      --paper: #fcf7ed;
      --card: #fffcf6;
      --line: rgba(243, 217, 149, .28)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--cream);
      font: 16px Arial, Helvetica, sans-serif
    }

    .wrap {
      max-width: 1440px;
      margin: auto
    }

    .top {
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px clamp(20px, 6vw, 90px)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit
    }

    .mark {
      display: grid;
      place-items: center;
      background: var(--gold);
      color: var(--ink);
      font-size: 25px;
      font-weight: 900;
      border-radius: 50%;
      width: 42px;
      height: 42px
    }

    .brand b,
    .brand small {
      display: block;
      letter-spacing: .16em
    }

    .brand b {
      font-size: 15px
    }

    .brand small {
      font-size: 9px;
      color: var(--gold-light);
      margin-top: 3px
    }

    .top a {
      color: var(--gold-light);
      text-decoration: none;
      font-size: 12px
    }

    .hero {
      padding: clamp(65px, 9vw, 130px) clamp(20px, 10vw, 150px);
      min-height: 450px;
      background: radial-gradient(circle at 78% 20%, rgba(201, 161, 90, .2), transparent 30%)
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      margin: 0 0 18px
    }

    .hero h1,
    .intro h2,
    .visit h2 {
      font-size: clamp(44px, 7vw, 92px);
      letter-spacing: -.065em;
      line-height: .9;
      margin: 0 0 25px
    }

    .hero em,
    .intro em,
    .visit em {
      font-family: Georgia, serif;
      font-weight: 400;
      color: var(--gold-light)
    }

    .hero p:not(.eyebrow) {
      max-width: 540px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 17px
    }

    .menu {
      background: var(--paper);
      color: var(--ink);
      padding: 3vw ;
    }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 40px
    }

    .intro .eyebrow {
      color: #8b5a1c
    }

    .intro h2 {
      font-size: clamp(38px, 5vw, 66px);
      margin: 0
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid rgba(16, 17, 22, .18);
      padding-bottom: 22px;
      margin-bottom: 36px
    }

    .search {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid rgba(16, 17, 22, .24);
      border-radius: 999px;
      padding: 0 14px;
      min-width: min(100%, 340px)
    }

    .search input {
      border: 0;
      background: transparent;
      outline: 0;
      padding: 12px 0;
      width: 100%;
      color: var(--ink)
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .filters button {
      cursor: pointer;
      border: 1px solid rgba(16, 17, 22, .2);
      background: transparent;
      border-radius: 999px;
      padding: 10px 14px;
      color: #655f57;
      font-size: 12px
    }

    .filters button.active,
    .filters button:hover {
      background: var(--ink);
      color: var(--cream);
      border-color: var(--ink)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(161, 116, 41, .18);
      padding: 25px;
      box-shadow: 0 10px 26px rgba(57, 36, 12, .08)
    }

    .card.beverage {
      background: #f5ebdd
    }

    .card.add-on {
      background: #f8e4b9
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(16, 17, 22, .18);
      padding-bottom: 16px
    }

    .card-head small {
      color: #8b5a1c;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase
    }

    .card h3 {
      font-size: clamp(22px, 2.3vw, 31px);
      letter-spacing: -.045em;
      line-height: 1;
      margin: 8px 0 0
    }

    .page {
      color: #756345;
      font-size: 10px
    }

    .item {
      border-bottom: 1px dotted rgba(16, 17, 22, .2);
      padding: 17px 0
    }

    .item:last-child {
      border-bottom: 0;
      padding-bottom: 3px
    }

    .item-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px
    }

    .item h4 {
      font-size: 16px;
      line-height: 1.2;
      margin: 0
    }

    .price {
      color: #825416;
      font-weight: 800;
      white-space: nowrap
    }

    .item p {
      color: #5b554c;
      font-size: 13px;
      line-height: 1.55;
      margin: 8px 0 0
    }

    .tags {
      display: flex;
      gap: 6px;
      margin-top: 10px
    }

    .tags span {
      background: rgba(130, 84, 22, .12);
      color: #825416;
      border-radius: 99px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
      padding: 5px 8px;
      text-transform: uppercase
    }

    .included {
      color: #825416;
      font-size: 11px;
      font-weight: 800;
      margin-top: 12px
    }

    .included ul {
      color: #5b554c;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      margin: 8px 0 0;
      padding-left: 17px
    }

    .empty {
      color: #5b554c;
      text-align: center;
      padding: 60px 0
    }

    .visit {
      background: var(--ink);
      color: var(--gold-light);
      display: flex;
      justify-content: space-between;
      gap: 30px;
      padding: clamp(24px, 7vw, 100px) clamp(20px, 10vw, 150px)
    }

    .visit .eyebrow {
      color: var(--gold)
    }

    .visit h2 {
      font-size: clamp(38px, 5vw, 70px)
    }

    .visit-detail {
      font-size: 14px;
      line-height: 1.6;
      text-align: right;
      color: var(--muted)
    }

    .visit-detail .button {
      background: var(--gold-light);
      color: var(--ink)
    }

    .button {
      display: inline-block;
      background: var(--ink);
      color: var(--gold-light);
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      margin-top: 10px
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 24px clamp(20px, 6vw, 90px);
      color: #b5aa98;
      font-size: 11px
    }

    .footer a {
      color: var(--gold-light)
    }

    @media(max-width:800px) {

      .intro,
      .visit {
        align-items: flex-start;
        flex-direction: column
      }

      .grid {
        grid-template-columns: 1fr
      }

      .visit-detail {
        text-align: left
      }

      .footer {
        flex-direction: column
      }

      
    }
  </style>
  <style>
    .hero {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(360px, 1.1fr);
      gap: clamp(35px, 7vw, 100px);
      min-height: 575px;
      align-items: center
    }

    .hero-copy {
      position: relative;
      z-index: 1
    }

    .hero-brand-lockup {
      color: var(--gold-light);
      letter-spacing: .2em;
      line-height: 1;
      margin: 0 0 28px;
      text-transform: uppercase
    }

    .hero-brand-lockup strong,
    .hero-brand-lockup span {
      display: block
    }

    .hero-brand-lockup strong {
      font-size: clamp(18px, 2.4vw, 26px)
    }

    .hero-brand-lockup span {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      margin-top: 7px
    }

    .hero h1 {
      font-size: clamp(62px, 10vw, 132px);
      margin: 0 0 28px
    }

    .hero-text {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
      max-width: 510px
    }

    .hero-details {
      align-self: center;
      background: rgba(26, 21, 16, .72);
      border: 1px solid rgba(243, 217, 149, .52);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .22);
      padding: clamp(26px, 4vw, 44px)
    }

    .hero-contact,
    .hero-hours {
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
      padding-bottom: 22px
    }

    .hero-contact a {
      color: var(--gold-light);
      text-decoration: none
    }

    .hero-contact p {
      margin: 0 0 7px
    }

    .hero-contact p:last-child {
      margin-bottom: 0
    }

    .hero-hours {
      padding: 22px 0
    }

    .hero-hours p {
      margin: 0
    }

    .hero-detail-label {
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      margin-bottom: 7px !important;
      text-transform: uppercase
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 24px
    }

    .hero-actions .button {
      margin-top: 0
    }

    .hero-actions .button.outline {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold-light)
    }

    @media(max-width:800px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: 0
      }

      .hero-details {
        margin-top: 8px
      }

      .hero-actions {
        flex-direction: column
      }

      .hero-actions .button {
        text-align: center
      }
    }
  </style>
</head>
