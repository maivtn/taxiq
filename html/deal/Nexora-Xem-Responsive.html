<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora · Xem trên thiết bị</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#ebeaf1;color:#282239}header{padding:14px 20px;background:white;border-bottom:1px solid #dcd6e8;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:17px;margin:0 12px 0 0}button,select{font:inherit;border:1px solid #d9cdea;background:white;border-radius:9px;padding:10px 13px;cursor:pointer}button[aria-pressed=true]{background:#693ce6;color:white;border-color:#693ce6}.hint{padding:10px 20px;font-size:12px;color:#776b88}.workspace{height:calc(100vh - 135px);overflow:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start}.stage{flex-shrink:0;position:relative;background:white;box-shadow:0 12px 45px #25193925;border:5px solid #292238;border-radius:18px;overflow:hidden}iframe{display:block;border:0;transform-origin:top left;background:white}#size{font-size:12px;color:#7c6a8e}a{color:#6743be}</style></head><body><header><h1>Nexora · Xem giao diện</h1><button data-device="390,844" aria-pressed="true">Điện thoại</button><button data-device="768,1024" aria-pressed="false">iPad</button><button data-device="1440,900" aria-pressed="false">Máy tính</button><button id="rotate">↻ Xoay màn hình</button><select id="route" aria-label="Chọn trang"><option value="discover">Trang chủ</option><option value="nearby">Ưu đãi gần bạn</option><option value="coupons">Mã giảm theo ngành</option><option value="nail-salons">Beauty</option><option value="requests">Deal Match</option><option value="openings">Khai trương</option><option value="last-minute">Phút chót</option></select><button id="refresh">Tải lại bản mới</button><span id="size"></span></header><div class="hint">Bấm và cuộn bên trong màn hình để thử giao diện. Đây là mô phỏng kích thước, không thay thế kiểm thử trên thiết bị thật. <a href="./Nexora-Xem-Ngay.html#discover" target="_blank">Mở toàn màn hình ↗</a></div><div class="workspace"><div class="stage"><iframe title="Giao diện Nexora theo kích thước thiết bị" src="./Nexora-Xem-Ngay.html#discover"></iframe></div></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('.stage'),space=document.querySelector('.workspace');let width=390,height=844;function fit(){const scale=Math.min(1,(space.clientWidth-55)/width);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';stage.style.width=(width*scale+10)+'px';stage.style.height=(height*scale+10)+'px';document.querySelector('#size').textContent=width+' × '+height+' · '+Math.round(scale*100)+'%'}document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{[width,height]=b.dataset.device.split(',').map(Number);document.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));fit()});document.querySelector('#rotate').onclick=()=>{[width,height]=[height,width];fit()};document.querySelector('#route').onchange=e=>frame.src='./Nexora-Xem-Ngay.html#'+e.target.value;document.querySelector('#refresh').onclick=()=>frame.src='./Nexora-Xem-Ngay.html?review='+Date.now()+'#'+document.querySelector('#route').value;window.addEventListener('resize',fit);fit();</script></body></html>
