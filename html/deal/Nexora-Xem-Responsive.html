<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora · Device preview</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#ebeaf1;color:#282239}button svg{vertical-align:-3px;color:#7153db}header{padding:14px 20px;background:white;border-bottom:1px solid #dcd6e8;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:17px;margin:0 12px 0 0}button,select{font:inherit;border:1px solid #d9cdea;background:white;border-radius:9px;padding:10px 13px;cursor:pointer}button[aria-pressed=true]{background:#693ce6;color:white;border-color:#693ce6}.hint{padding:10px 20px;font-size:12px;color:#776b88}.workspace{height:calc(100vh - 135px);overflow:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start}.stage{flex-shrink:0;position:relative;background:white;box-shadow:0 12px 45px #25193925;border:5px solid #292238;border-radius:18px;overflow:hidden}iframe{display:block;border:0;transform-origin:top left;background:white}#size{font-size:12px;color:#7c6a8e}a{color:#6743be}</style></head><body><header><h1>Nexora · Preview</h1><button data-device="390,844" aria-pressed="true">Phone</button><button data-device="768,1024" aria-pressed="false">iPad</button><button data-device="1440,900" aria-pressed="false">Desktop</button><button id="rotate"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Rotate</button><select id="route" aria-label="Choose a page"><option value="discover">Home</option><option value="nearby">Deals Nearby</option><option value="coupons">Coupons by Category</option><option value="nail-salons">Beauty</option><option value="requests">Deal Match</option><option value="openings">Grand Openings</option><option value="last-minute">Last Minute</option></select><button id="refresh"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 0 1-15.36 6.36L3 16"/><path d="M8 16H3v5"/></svg> Reload latest</button><span id="size"></span></header><div class="hint">Click and scroll inside the screen to explore. This simulates screen sizes and does not replace testing on real devices. <a href="./Nexora-Xem-Ngay.html?v=e09c5e33d5#discover" target="_blank">Open full screen ↗</a></div><div class="workspace"><div class="stage"><iframe title="Nexora · Device preview" src="./Nexora-Xem-Ngay.html?v=e09c5e33d5#discover"></iframe></div></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('.stage'),space=document.querySelector('.workspace');let width=390,height=844;function fit(){const scale=Math.min(1,(space.clientWidth-55)/width);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';stage.style.width=(width*scale+10)+'px';stage.style.height=(height*scale+10)+'px';document.querySelector('#size').textContent=width+' × '+height+' · '+Math.round(scale*100)+'%'}document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{[width,height]=b.dataset.device.split(',').map(Number);document.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));fit()});document.querySelector('#rotate').onclick=()=>{[width,height]=[height,width];fit()};document.querySelector('#route').onchange=e=>frame.src='./Nexora-Xem-Ngay.html?v=e09c5e33d5#'+e.target.value;document.querySelector('#refresh').onclick=()=>frame.src='./Nexora-Xem-Ngay.html?v=e09c5e33d5&review='+Date.now()+'#'+document.querySelector('#route').value;window.addEventListener('resize',fit);fit();</script></body></html>
