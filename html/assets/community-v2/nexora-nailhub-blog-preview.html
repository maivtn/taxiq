<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NailHub.AI · Blog</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202b43;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#172d4d;color:#fff;padding:18px 24px}.top-inner{max-width:1040px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:900;letter-spacing:-.03em}.top a{color:#e4edff;text-decoration:none;font-size:13px;font-weight:700}.wrap{max-width:1040px;margin:auto;padding:32px 20px 70px}.eyebrow{color:#6854cf;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:850}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:0 0 24px}.hero h1{font-size:34px;margin:4px 0 7px}.hero p{color:#65718b;margin:0;line-height:1.5}.btn{border:1px solid #dce2ed;background:#fff;color:#253350;padding:10px 15px;border-radius:10px;font-weight:750}.btn.primary{background:#6154e8;border-color:#6154e8;color:#fff}.btn.small{padding:7px 10px;font-size:12px}.notice{background:#eeeaff;border:1px solid #dcd5ff;border-radius:12px;color:#5044ab;padding:12px 15px;font-size:13px;line-height:1.5;margin-bottom:20px}.toolbar{display:flex;gap:10px;margin-bottom:18px}.field{border:1px solid #d9e0eb;background:#fff;border-radius:10px;padding:11px 13px;color:#202b43;min-width:0}.toolbar input{flex:1}.toolbar select{width:230px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #e0e6f0;border-radius:15px;padding:20px;box-shadow:0 8px 24px #2035570a}.card .tag{display:inline-flex;padding:5px 9px;border-radius:99px;background:#e8f7f4;color:#16765f;font-size:11px;font-weight:800}.card h2{font-size:20px;line-height:1.3;margin:12px 0 8px}.meta{font-size:12px;color:#6b768d}.card p{font-size:14px;color:#4e5a70;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.count{font-size:13px;color:#627087;margin:0 0 12px}.overlay{position:fixed;inset:0;background:#14213eb3;display:grid;place-items:center;padding:14px;z-index:10}.dialog{width:min(660px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 20px 70px #101d3780}.dialog-head{padding:20px 23px;border-bottom:1px solid #e1e6ef;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.dialog-head h2{margin:0;font-size:22px}.dialog-head p{margin:5px 0 0;color:#6c778e;font-size:12px}.dialog-body{padding:20px 23px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.group{display:flex;flex-direction:column;gap:6px}.group.wide{grid-column:1/-1}.group label{font-size:12px;font-weight:800}.group textarea{min-height:86px;resize:vertical}.group textarea.body{min-height:210px}.dialog-footer{padding:0 23px 23px;display:flex;justify-content:flex-end;gap:8px}.article-body{white-space:pre-wrap;line-height:1.7;color:#30394f}.cover{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:10px;margin:10px 0}.cover.full{max-height:390px;margin:0 0 18px}.cover-preview{max-width:240px;max-height:150px;object-fit:cover;border-radius:9px;border:1px solid #dce2ed;margin-top:8px}.cover-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}.image-error{color:#b93c4c;font-size:11px}.close{border:0;background:#f1f3f8;border-radius:8px;width:32px;height:32px;font-size:20px}.empty{padding:32px;text-align:center;background:#fff;border:1px solid #e0e6f0;border-radius:15px;color:#637089}.hidden{display:none!important}@media(max-width:650px){.wrap{padding:24px 14px 50px}.top{padding:15px}.brand{font-size:17px}.hero{align-items:start;flex-direction:column}.hero h1{font-size:27px}.toolbar{flex-direction:column}.toolbar select{width:100%}.grid,.form-grid{grid-template-columns:1fr}.group.wide{grid-column:auto}}
  </style>
  <link rel="stylesheet" href="community-controls.css?v=20261029">
  <link rel="stylesheet" href="community-mobile.css?v=20261029-community-feed-icons-v20">
  <link rel="stylesheet" href="community-layout.css?v=20261029-community-feed-icons-v20">
</head>
<body>
  <header class="top"><div class="top-inner"><div class="brand">NailHub.AI</div><a href="nexora-community-complete.html?view=blog">↗ Xem Blog NEXORA</a></div></header>
  <main class="wrap"><div class="eyebrow">Blog dùng chung</div><div class="hero"><div><h1>Bài viết cho người trong nghề</h1><p>Một bài Blog được hiển thị trên cả NailHub.AI và NEXORA.</p></div><button id="create" class="btn primary">＋ Viết Blog</button></div><div class="toolbar"><input id="search" class="field" type="search" placeholder="Tìm bài Blog..." aria-label="Tìm bài Blog"><select id="topic" class="field" aria-label="Lọc chủ đề"></select></div><div id="count" class="count"></div><div id="posts" class="grid"></div></main>
  <div id="modal"></div>
  <script src="community-demo-data.js?v=20261029-community-feed-icons-v20"></script>
  <script>
  (()=>{
    const KEY='nexora-nailhub-shared-blog-v1',ME='BITCOIN NAIL BAR';
    const topics=['Kỹ thuật Nail','Quản lý tiệm','Kinh doanh','Công nghệ','Nhà hàng','Khác'];
    const demo=[{id:'blog-1',owner:'NailHub.AI',origin:'NailHub.AI',title:'Chọn đèn hơ gel phù hợp cho tiệm đông khách',topic:'Kỹ thuật Nail',summary:'Những điều nên kiểm tra trước khi mua đèn hơ cho một tiệm có nhiều bàn làm việc.',body:'Khi tiệm đông khách, đèn hơ cần dễ vệ sinh, thao tác nhanh và phù hợp với loại gel đang dùng.\n\nHãy kiểm tra kích thước lòng đèn, chế độ hẹn giờ và chính sách bảo hành. Trước khi mua nhiều chiếc, nên dùng thử một chiếc trong quy trình làm việc hằng ngày.',location:'Houston, TX',publishedAt:'2026-10-12T15:00:00Z'},{id:'blog-2',owner:ME,origin:'NEXORA',title:'Sắp xếp khu chờ để khách thấy thoải mái hơn',topic:'Quản lý tiệm',summary:'Một vài cách bố trí ghế, lối đi và thông tin dịch vụ cho khu vực tiếp khách.',body:'Khu chờ gọn giúp khách dễ tìm chỗ ngồi và nhân viên dễ quan sát.\n\nNên để đủ lối đi, bảng giá dễ đọc và ghế sạch trước mỗi ca. Nếu thay nội thất, hãy ghi rõ số lượng và kích thước để chọn món phù hợp.',location:'Houston, TX',publishedAt:'2026-10-11T15:00:00Z'}];
    const $=selector=>document.querySelector(selector);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const norm=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
    function load(){let saved=null;try{const value=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(value))saved=value;}catch{}const catalog=window.NEXORA_COMMUNITY_DEMO;const rows=catalog?catalog.merge(saved,catalog.blogs,demo,'blogs'):(saved||demo).filter(row=>row&&typeof row==='object'&&typeof row.id==='string');try{localStorage.setItem(KEY,JSON.stringify(rows));}catch{}return rows;}
    let articles=load(),editing=null,cover='';
    function save(){localStorage.setItem(KEY,JSON.stringify(articles));}
    function coverUrl(value){return window.NEXORA_COMMUNITY_DEMO?window.NEXORA_COMMUNITY_DEMO.mediaURL(value):(/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(value||'')?value:'');}
    function coverMarkup(article,full=false){const url=coverUrl(article.cover);return url?`<img class="cover ${full?'full':''}" src="${url}" alt="Ảnh bìa: ${esc(article.title)}">`:'';}
    function previewCover(){const preview=$('#coverPreview');if(!preview)return;const url=coverUrl(cover);preview.innerHTML=url?`<img class="cover-preview" src="${url}" alt="Xem trước ảnh bìa"><button type="button" class="btn small" data-remove-cover>Xóa ảnh</button>`:'<span class="meta">Chưa chọn ảnh. Bài vẫn đăng bình thường.</span>';}
    function date(value){return new Date(value).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
    function render(){const query=norm($('#search').value),topic=$('#topic').value;const shown=articles.filter(a=>(!topic||a.topic===topic)&&(!query||norm(a.title+' '+a.summary+' '+a.body).includes(query))).sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));$('#count').textContent=shown.length+' bài Blog';$('#posts').innerHTML=shown.map(a=>`<article class="card"><span class="tag">${esc(a.topic)}</span>${coverMarkup(a)}<h2>${esc(a.title)}</h2><div class="meta">${esc(a.owner)} · ${date(a.publishedAt)} · từ ${esc(a.origin)}</div><p>${esc(a.summary)}</p><div class="meta">↔ NEXORA + NailHub.AI${a.location?' · '+esc(a.location):''}</div><div class="actions"><button class="btn small" data-read="${esc(a.id)}">Đọc bài</button>${a.owner===ME?`<button class="btn small" data-edit="${esc(a.id)}">Sửa bài</button>`:''}</div></article>`).join('')||'<div class="empty">Chưa có bài phù hợp. Hãy thử chủ đề khác.</div>';}
    function close(){editing=null;$('#modal').innerHTML='';}
    function form(article=null){editing=article?.id||null;cover=coverUrl(article?.cover);$('#modal').innerHTML=`<div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="dialog-head"><div><h2 id="formTitle">${article?'Sửa bài Blog':'Viết bài Blog'}</h2><p>Một bài chung cho NailHub.AI và NEXORA.</p></div><button class="close" data-close aria-label="Đóng">×</button></div><form id="blogForm" data-community-editing="${Boolean(article)}"><div class="dialog-body"><div class="form-grid"><div class="group wide"><label for="title">Tiêu đề *</label><input id="title" name="title" class="field" required maxlength="120" value="${esc(article?.title||'')}" placeholder="Ví dụ: Mẹo quản lý tiệm"></div><div class="group"><label for="articleTopic">Chủ đề *</label><select id="articleTopic" name="topic" class="field" required><option value="">Chọn chủ đề</option>${topics.map(t=>`<option value="${esc(t)}" ${article?.topic===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="group"><label for="location">Khu vực (không bắt buộc)</label><input id="location" name="location" class="field" value="${esc(article?.location||'Houston, TX')}" placeholder="Ví dụ: Houston, TX"></div><div class="group wide"><label for="summary">Mô tả ngắn *</label><textarea id="summary" name="summary" class="field" required maxlength="280">${esc(article?.summary||'')}</textarea></div><div class="group wide"><label for="body">Nội dung bài *</label><textarea id="body" name="body" class="field body" required>${esc(article?.body||'')}</textarea></div><div class="group wide"><label for="coverInput">Ảnh bìa (tùy chọn)</label><input id="coverInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="field"><span class="meta">PNG, JPG, WebP hoặc GIF · tối đa 700 KB</span><div id="coverPreview" class="cover-actions"></div><span id="coverError" class="image-error" role="alert"></span></div></div></div><div class="dialog-footer"><button type="button" class="btn" data-close>Hủy</button><button type="submit" class="btn primary">${article?'Lưu bài':'Đăng Blog'}</button></div></form></section></div>`;$('#title').focus();previewCover();}
    function read(article){$('#modal').innerHTML=`<div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="readTitle"><div class="dialog-head"><div><div class="eyebrow">${esc(article.topic)}</div><h2 id="readTitle">${esc(article.title)}</h2><p>${esc(article.owner)} · ${date(article.publishedAt)} · từ ${esc(article.origin)}</p></div><button class="close" data-close aria-label="Đóng">×</button></div><div class="dialog-body">${coverMarkup(article,true)}<p>${esc(article.summary)}</p><div class="article-body">${esc(article.body)}</div></div><div class="dialog-footer"><button class="btn" data-close>Đóng</button>${article.owner===ME?`<button class="btn primary" data-edit="${esc(article.id)}">Sửa bài</button>`:''}</div></section></div>`;}
    $('#topic').replaceChildren(new Option('Tất cả chủ đề',''),...topics.map(topic=>new Option(topic,topic)));
    $('#search').addEventListener('input',render);$('#topic').addEventListener('change',render);$('#create').addEventListener('click',()=>form());
    document.addEventListener('click',event=>{if(event.target.closest('[data-close]')||event.target.id==='overlay'){close();return;}const edit=event.target.closest('[data-edit]');if(edit){const article=articles.find(a=>a.id===edit.dataset.edit);if(article)form(article);return;}const open=event.target.closest('[data-read]');if(open){const article=articles.find(a=>a.id===open.dataset.read);if(article)read(article);}});
    document.addEventListener('submit',event=>{if(event.target.id!=='blogForm')return;event.preventDefault();const data=Object.fromEntries(new FormData(event.target).entries()),previous=editing?articles.find(a=>a.id===editing):null;const article={id:previous?.id||'blog-'+Date.now(),owner:previous?.owner||ME,origin:previous?.origin||'NailHub.AI',title:data.title.trim(),topic:data.topic,summary:data.summary.trim(),body:data.body.trim(),location:data.location.trim(),cover,publishedAt:previous?.publishedAt||new Date().toISOString()};articles=previous?articles.map(a=>a.id===previous.id?article:a):[article,...articles];save();close();render();});
    document.addEventListener('change',event=>{if(event.target.id!=='coverInput')return;const file=event.target.files?.[0],error=$('#coverError');if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>700*1024){error.textContent='Chọn ảnh PNG, JPG, WebP hoặc GIF tối đa 700 KB.';event.target.value='';return;}const reader=new FileReader();reader.onload=()=>{cover=coverUrl(reader.result);error.textContent=cover?'':'Không thể đọc ảnh này.';previewCover();};reader.onerror=()=>{error.textContent='Không thể đọc ảnh này.';};reader.readAsDataURL(file);});
    document.addEventListener('click',event=>{if(!event.target.closest('[data-remove-cover]'))return;cover='';const file=$('#coverInput');if(file)file.value='';previewCover();});
    window.addEventListener('storage',event=>{if(event.key===KEY){articles=load();render();}});render();
  })();
  </script>
  <script src="../vendor/lucide.min.js" defer></script>
  <script src="community-ui.js?v=20261029-community-feed-icons-v20" defer></script>
</body>
</html>
