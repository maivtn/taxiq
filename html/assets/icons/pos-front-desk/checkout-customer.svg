<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Checkout Customer - Card Payment">
<defs>
 <linearGradient id="tile" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF0FE"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#516FE1"/><stop offset=".48" stop-color="#293FAD"/><stop offset="1" stop-color="#132568"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A9FAFE"/><stop offset=".52" stop-color="#37C8E4"/><stop offset="1" stop-color="#087FAF"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FEB5EA"/><stop offset=".47" stop-color="#DF69D7"/><stop offset="1" stop-color="#9148C6"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8D4FE"/></linearGradient>
 <filter id="depth" x="-40%" y="-50%" width="180%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#142969" flood-opacity=".28"/></filter>
 <filter id="smallShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#17275B" flood-opacity=".23"/></filter>
 </defs>
 <rect x="9" y="9" width="78" height="78" rx="22" fill="url(#tile)" stroke="#fff" stroke-width="2"/>
 <path d="M17 37C20 24 28 18 43 17" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>
<g filter="url(#depth)">
<!-- POS payment terminal -->
<rect x="22" y="25" width="43" height="52" rx="9" fill="url(#navy)" transform="rotate(-7 43.5 51)"/>
<rect x="28" y="31" width="30" height="24" rx="4" fill="url(#silver)" transform="rotate(-7 43 43)"/>
<path d="M36 43l5 5 9-12" fill="none" stroke="#0B9BAA" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-7 43 43)"/>
<g fill="#A7C3FF"><circle cx="32" cy="62" r="2"/><circle cx="42" cy="61" r="2"/><circle cx="52" cy="60" r="2"/><circle cx="33" cy="69" r="2"/><circle cx="43" cy="68" r="2"/><circle cx="53" cy="67" r="2"/></g>
<!-- Contactless payment credit card approaching terminal -->
<g filter="url(#smallShadow)" transform="rotate(12 65 44)">
<rect x="49" y="38" width="33" height="23" rx="5" fill="url(#cyan)" stroke="#D1FFFF" stroke-width="1"/>
<rect x="49" y="45" width="33" height="5" fill="#1461A2" opacity=".78"/>
<rect x="55" y="53" width="10" height="3" rx="1.5" fill="white" opacity=".9"/>
</g>
</g>
<!-- NFC wave signal between card and terminal -->
<path d="M65 31q6 5 0 10M69 27q10 9 0 18" fill="none" stroke="url(#pink)" stroke-width="2.5" stroke-linecap="round"/>
</svg>