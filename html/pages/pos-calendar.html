<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexora Touch - My Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/nexora-shell.css">
  <link rel="stylesheet" href="../assets/staff-shell.css">
  <link rel="stylesheet" href="../assets/staff-calendar.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar staff-sidebar" id="nexora-sidebar" data-shell-sidebar></aside>
    <div class="sidebar-overlay" data-shell-overlay></div>
    <div class="app-area">
      <header class="header" data-shell-header></header>
      <main class="main-content staff-calendar-page">
        <section data-calendar>
          <header class="staff-calendar-heading">
            <div>
              <span>MY SCHEDULE · <span data-calendar-person></span></span>
              <h1>My Calendar</h1>
              <p>Your appointments, published hours and schedule requests.</p>
            </div>
            <div class="staff-calendar-tools">
              <label>Salon<select class="staff-calendar-select" data-calendar-salon></select></label>
              <button type="button" data-calendar-today>Today</button>
            </div>
          </header>
          <div class="today-availability" data-today-availability></div>
          <div class="calendar-status">
            <span data-calendar-sync></span>
            <a href="staff-work-orders.html" data-work-orders-link>Back to My Tickets</a>
          </div>
          <nav class="calendar-tabs" role="tablist" aria-label="My Calendar views">
            <button type="button" role="tab" id="calendar-tab-appointments" aria-controls="calendar-view-panel" data-calendar-tab="appointments">Appointments</button>
            <button type="button" role="tab" id="calendar-tab-my-schedule" aria-controls="calendar-view-panel" data-calendar-tab="my-schedule">Work Schedule</button>
            <button type="button" role="tab" id="calendar-tab-requests" aria-controls="calendar-view-panel" data-calendar-tab="requests">Requests</button>
          </nav>
          <div class="calendar-navigation">
            <button type="button" data-calendar-week-step="-1" aria-label="Previous week">‹</button>
            <label class="calendar-date-picker"><span data-calendar-date-caption></span><input type="date" data-calendar-date-picker aria-label="Choose calendar date"></label>
            <button type="button" data-calendar-week-step="1" aria-label="Next week">›</button>
          </div>
          <div class="calendar-week" data-calendar-week aria-label="Select a day"></div>
          <div class="calendar-summary" data-calendar-summary></div>
          <div class="calendar-layout">
            <section class="calendar-panel" id="calendar-view-panel" role="tabpanel" data-calendar-panel>
              <header><h2 data-calendar-heading></h2><span data-calendar-duration></span></header>
              <div data-calendar-timeline></div>
            </section>
            <aside class="calendar-side" data-calendar-side></aside>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script>window.NEXORA_SHELL={activePage:'staff',activeTab:'my-calendar'};</script>
  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
  <script src="../assets/nexora-shell.js"></script>
  <script src="../assets/salon-data.js"></script>
  <script src="../assets/appointment-tickets.js"></script>
  <script src="../assets/appointments-store.js"></script>
  <script src="../assets/staff-schedule-store.js"></script>
  <script src="../assets/staff-schedule-demo.js"></script>
  <script src="../assets/staff-calendar.js"></script>
</body>
</html>
