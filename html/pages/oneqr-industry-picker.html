<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Industry | One QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/nexora-shell.css">
  <link rel="stylesheet" href="../assets/qr-stations.css?v=phone-1">
  <link rel="stylesheet" href="../assets/oneqr-industry-templates.css">
</head>
<body data-oneqr-screen="industry-picker">
  <div class="shell">
    <aside class="sidebar" aria-label="Dashboard sidebar"></aside>

    <div class="app-area">
      <header class="header"></header>

      <main class="content qr-stations-page" aria-labelledby="qr-stations-title">
        <section class="qr-stations-shell">
          <div class="qr-stations-heading">
            <h1 id="qr-stations-title">One QR</h1>
            <p>Create and manage your customer-facing OneQR experience.</p>

            <div class="qr-tabs" role="tablist" aria-label="Stations and QR tabs">
              <a class="qr-tab is-active" href="qr-stations.html?tab=one-qr" role="tab" aria-selected="true"><span class="qr-tab-icon"><i data-lucide="scan-line" aria-hidden="true"></i></span><span>OneQR</span></a>
              <a class="qr-tab" href="qr-stations.html?tab=qr-stations" role="tab" aria-selected="false"><span class="qr-tab-icon"><i data-lucide="hand-coins" aria-hidden="true"></i></span><span>Receive Tips</span></a>
              <a class="qr-tab" href="qr-stations.html?tab=accept-payment" role="tab" aria-selected="false"><span class="qr-tab-icon"><i data-lucide="credit-card" aria-hidden="true"></i></span><span>Accept Payment</span></a>
              <a class="qr-tab" href="qr-stations.html?tab=referral-link" role="tab" aria-selected="false"><span class="qr-tab-icon"><i data-lucide="share-2" aria-hidden="true"></i></span><span>Referral Link</span></a>
              <a class="qr-tab" href="qr-stations.html?tab=staff-invite-qr" role="tab" aria-selected="false"><span class="qr-tab-icon"><i data-lucide="user-plus" aria-hidden="true"></i></span><span>Staff Invite QR</span></a>
            </div>
          </div>

          <div class="industry-page is-picker-page">
            <section class="template-workspace is-picker-mode">
              <div class="template-library">
                <section class="industry-picker-view" id="industry-picker-view">
                  <div class="library-heading">
                    <div>
                      <span class="section-step">Industry templates</span>
                      <div class="picker-title-row"><a class="picker-back-link" href="qr-stations.html?tab=one-qr"><i data-lucide="arrow-left" aria-hidden="true"></i>Back</a><h2>Choose your business industry</h2></div>
                      <p>Select the closest match. Your current custom modules stay in place when you switch templates.</p>
                    </div>
                    <div class="picker-heading-actions">
                      <div class="language-switch" role="group" aria-label="Template language">
                        <button type="button" class="is-active" data-language="en" aria-pressed="true">EN</button>
                        <button type="button" data-language="vi" aria-pressed="false">VI</button>
                      </div>
                    </div>
                  </div>

                  <label class="industry-search" for="industry-search-input">
                    <i data-lucide="search" aria-hidden="true"></i>
                    <input id="industry-search-input" type="search" placeholder="Search by industry, service, or keyword" autocomplete="off">
                    <kbd>/</kbd>
                  </label>

                  <div class="group-tabs-wrap"><div class="group-tabs" role="tablist" aria-label="Industry groups" id="industry-group-tabs"></div></div>
                  <div class="library-result-row">
                    <p id="industry-result-count" aria-live="polite"></p>
                    <button type="button" class="clear-filter" id="clear-industry-filter" hidden>Clear filters</button>
                  </div>
                  <div class="industry-grid" id="industry-grid" aria-live="polite"></div>
                </section>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
  <script>window.NEXORA_SHELL = { activePage: 'stations', activeTab: 'one-qr' };</script>
  <script src="../assets/nexora-shell.js"></script>
  <script src="../assets/oneqr-action-appearance.js"></script>
  <script src="../assets/oneqr-industries.js"></script>
  <script src="../assets/oneqr-industry-picker.js"></script>
</body>
</html>
