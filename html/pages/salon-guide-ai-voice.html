  <style>
.ai-guide-page{--bg:#f4f6fb;--card:#fff;--ink:#111a3c;--mut:#5b6486;--line:#e3e7f3;--blue:#3b5bfd;--blue2:#eef1ff;--ok:#16a34a;--okbg:#ecfdf3;--bad:#dc2626;--badbg:#fdf1f0;--warnbg:#fff9e6;--warnln:#f3df8a;--warntx:#b4531a;--or:#f59e6b;--navy:#111a3c}
.ai-guide-page *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
.ai-guide-page{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.tour .ai-guide-page{padding-bottom:300px}
.ai-guide-page .wrap{max-width:640px;margin:0 auto;padding:12px 12px 90px}
.ai-guide-page .topbar{display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:40;background:var(--bg);padding:6px 0 8px}
.ai-guide-page .tabs{flex:1;display:grid;grid-template-columns:1fr 1fr;background:#e3e8f6;border-radius:16px;padding:5px}
.ai-guide-page .tabs button{border:0;background:none;padding:12px 6px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer;font-family:inherit}
.ai-guide-page .tabs button.on{background:#fff;color:#2b3fb8;box-shadow:0 2px 8px rgba(30,50,120,.15)}
.ai-guide-page .lang{display:flex;background:#e3e8f6;border-radius:999px;padding:3px;flex:none}
.ai-guide-page .lang button{border:0;background:none;padding:7px 10px;border-radius:999px;font-weight:800;font-size:12px;color:var(--mut);cursor:pointer}
.ai-guide-page .lang button.on{background:#fff;color:#2b3fb8}
.ai-guide-page .eyebrow{color:var(--blue);font-weight:800;letter-spacing:1.2px;font-size:13px;margin:14px 0 6px;text-transform:uppercase}
.ai-guide-page h1{font-size:28px;line-height:1.15;margin:0 0 8px;letter-spacing:-.5px}
.ai-guide-page .sub{color:var(--mut);margin:0 0 14px;font-size:16px}
.ai-guide-page .prog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.ai-guide-page .prog i{height:8px;border-radius:6px;background:#dfe4f2}
.ai-guide-page .prog i.on{background:var(--blue)}
.ai-guide-page .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;scroll-margin-top:70px;transition:box-shadow .3s}
.ai-guide-page .card h2{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px;line-height:1.2}
.ai-guide-page .card h2 .n{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.ai-guide-page .hint{color:var(--mut);font-size:15px;margin:0 0 12px}
.ai-guide-page .lbl{font-size:12.5px;font-weight:800;letter-spacing:1px;color:var(--mut);text-transform:uppercase;margin:16px 0 8px}
.ai-guide-page .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ai-guide-page .opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;font-weight:800;font-size:15px;color:var(--ink);font-family:inherit;min-height:62px}
.ai-guide-page .opt small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
.ai-guide-page .opt.on{background:var(--blue2);border-color:var(--blue);color:#2437b5}
.ai-guide-page .optw{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px}
.ai-guide-page .optw small{font-size:14.5px;margin-top:2px;color:var(--mut)}
.ai-guide-page .optw .rec{font-size:11px;background:var(--blue);color:#fff;border-radius:999px;padding:2px 8px;margin-left:8px;font-weight:700;vertical-align:middle}
.ai-guide-page .link{background:none;border:0;color:var(--blue);font-weight:800;font-size:16px;padding:14px 0 6px;cursor:pointer;font-family:inherit;text-align:left}
.ai-guide-page .help{border:2px dashed var(--blue);border-radius:18px;padding:14px;margin:6px 0 4px;background:#f8f9ff}
.ai-guide-page .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ai-guide-page .hgrid h4{margin:8px 0 2px;font-size:16px}
.ai-guide-page .hgrid p{margin:0;color:var(--mut);font-size:14.5px}
.ai-guide-page .mini{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;min-height:60px}
.ai-guide-page .status{background:#111;color:#fff;border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;gap:6px}
.ai-guide-page .carrierbadge{background:#fde68a;color:#7c3a00;border:2px solid var(--or);border-radius:8px;padding:0 8px;font-weight:800;font-size:13px}
.ai-guide-page .codepanel{background:var(--navy);color:#fff;border-radius:18px;padding:16px;text-align:center;margin:12px 0}
.ai-guide-page .codepanel .t{font-size:16px}
.ai-guide-page .badge{display:inline-block;background:#f6e9c8;color:#8b3a0b;border:1px solid #e7cf93;border-radius:8px;padding:1px 10px;font:700 13px ui-monospace,monospace;margin-left:8px}
.ai-guide-page .codebox{background:#2a3358;border-radius:14px;padding:18px 8px;margin:10px 0;font:800 clamp(26px,8vw,38px)/1.1 ui-monospace,Menlo,monospace;word-break:break-all}
.ai-guide-page .codebox b{color:#fbd56a;font-weight:800}
.ai-guide-page .codepanel .copy{background:#fff;color:var(--ink);border:0;border-radius:12px;padding:14px 24px;font-size:20px;font-weight:800;margin:8px 0;cursor:pointer;font-family:inherit}
.ai-guide-page .codepanel .small{color:#c7cff0;font-size:15px}
.ai-guide-page .numrow{margin-top:12px;font-size:13px;color:#aab4e6;text-align:left}
.ai-guide-page .numrow input{width:100%;margin-top:4px;background:#2a3358;border:1px solid #435089;border-radius:10px;color:#fff;padding:10px;font-size:16px;font-weight:700;outline:none}
.ai-guide-page .offline{background:var(--badbg);border:1px solid #f5cdc9;color:var(--bad);border-radius:14px;padding:14px 16px;font-size:18px;margin:10px 0}
.ai-guide-page .offline b{font-size:20px}
.ai-guide-page .noteblue{background:var(--blue2);border-radius:12px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.ai-guide-page .warn{background:var(--warnbg);border:1px solid var(--warnln);color:var(--warntx);border-radius:14px;padding:12px 14px;font-size:15.5px;margin-top:12px}
.ai-guide-page .pics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ai-guide-page .pic{background:#f8f9fe;border:1px solid var(--line);border-radius:18px;padding:10px 8px 12px;text-align:center}
.ai-guide-page .pic .no{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;margin:0 0 6px 4px}
.ai-guide-page .pic p{margin:8px 4px 0;font-size:14.5px;line-height:1.35}
.ai-guide-page .ph{width:100%;max-width:140px;margin:0 auto;aspect-ratio:9/17.5;background:#111;border-radius:22px;padding:6px;position:relative}
.ai-guide-page .ph .scr{height:100%;background:#fff;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ai-guide-page .ph .disp{margin:7px 7px 4px;background:#eef0f6;border-radius:9px;min-height:34px;display:grid;place-items:center;font:700 9.5px ui-monospace,monospace;color:#111;word-break:break-all;padding:2px}
.ai-guide-page .ph .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:2px 9px}
.ai-guide-page .ph .keys span{aspect-ratio:1.45;border-radius:50%;background:#eceef4;display:grid;place-items:center;font-weight:700;font-size:11px;color:#111}
.ai-guide-page .ph .keys.dim span{opacity:.45}
.ai-guide-page .ph .callp{width:62%;height:26px;background:#4caf50;border-radius:14px;margin:7px auto 0;display:grid;place-items:center;font-size:12px}
.ai-guide-page .ph .tab{margin:5px 8px;border-radius:9px;text-align:center;font-size:10px;font-weight:800;color:var(--blue);padding:4px}
.ai-guide-page .hl{outline:3px solid var(--or);outline-offset:1px;border-radius:12px}
.ai-guide-page .ph .calling{margin:auto;text-align:center;font-weight:800;font-size:10.5px}
.ai-guide-page .ph .ic{width:34px;height:34px;border-radius:50%;background:#e7ebff;display:grid;place-items:center;margin:8px auto 4px;font-size:15px}
.ai-guide-page .ph .bn{background:#1c2540;color:#fff;border-radius:10px;margin:6px;padding:7px 5px;font-size:9px;line-height:1.3;text-align:center;font-weight:700}
.ai-guide-page .chk{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;background:#fff}
.ai-guide-page .chk input{width:26px;height:26px;accent-color:var(--blue);flex:none;margin-top:2px}
.ai-guide-page .chk b{display:block;font-size:17px;line-height:1.25}
.ai-guide-page .chk span{color:var(--mut);font-size:14.5px}
.ai-guide-page .connected{background:var(--okbg);border:1px solid #a8e7c0;color:#166534;border-radius:14px;padding:12px 14px;font-weight:700;margin-top:6px}
.ai-guide-page details{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
.ai-guide-page details summary{list-style:none;padding:18px 16px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.ai-guide-page details summary::-webkit-details-marker{display:none}
.ai-guide-page details summary:after{content:"+";color:var(--blue);font-size:26px;line-height:1}
.ai-guide-page details[open] summary:after{content:"–"}
.ai-guide-page details .body{padding:0 16px 16px;color:var(--mut);font-size:15px}
.ai-guide-page details .body li{margin:6px 0}
.ai-guide-page .rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.ai-guide-page .rings div{background:var(--blue2);border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;color:var(--ink)}
.ai-guide-page .stuck{background:var(--navy);color:#fff;border-radius:22px;padding:18px;margin:16px 0}
.ai-guide-page .stuck .k{color:#a9b4ff;font-weight:800;letter-spacing:1.5px;font-size:13px}
.ai-guide-page .stuck .nm{font-size:26px;font-weight:800;margin:2px 0 12px}
.ai-guide-page .stuck a{color:#fff;font-size:22px}
.ai-guide-page .share{display:block;width:100%;border:2px dashed #cfd5ea;background:none;border-radius:20px;padding:18px;font-weight:800;font-size:17px;color:var(--ink);cursor:pointer;font-family:inherit}
.ai-guide-page .dark{background:var(--navy);color:#fff;border-radius:18px;padding:16px;font-size:17px;margin:14px 0}
.ai-guide-page .tabsmini{display:flex;gap:6px;overflow:auto;padding:2px 2px 8px;margin:10px 0 4px}
.ai-guide-page .tabsmini span{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--mut);background:#fff}
.ai-guide-page .tabsmini span.on{border:2px solid var(--blue);color:#2437b5;background:var(--blue2);outline:3px solid var(--or);outline-offset:1px}
.ai-guide-page .crumb{color:#2b3fb8;font-weight:800;font-size:16px;margin:2px 0}
.ai-guide-page .ui{background:#f8f9fe;border:1px solid var(--line);border-radius:16px;padding:10px;font-size:14px}
.ai-guide-page .ui .r{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:6px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai-guide-page .ui .r i{display:block;height:9px;width:70px;border-radius:6px;background:#e1e5f1}
.ai-guide-page .ui .pill{background:#dcfce7;color:#166534;border-radius:999px;padding:2px 10px;font-size:12px}
.ai-guide-page .ui table{width:100%;border-collapse:collapse;font-size:12.5px}
.ai-guide-page .ui th{color:var(--mut);text-align:left;padding:6px 4px;font-size:11.5px;letter-spacing:.8px}
.ai-guide-page .ui td{padding:6px 4px;border-top:1px solid var(--line)}
.ai-guide-page .ui .btn{background:var(--blue);color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;display:inline-block}
.ai-guide-page .ui .cell{background:#e8ebf6;border-radius:12px;padding:4px 10px;display:inline-block;min-width:44px;font-weight:700}
.ai-guide-page .ui .cell i{display:inline-block;height:8px;width:24px;background:#d5dbee;border-radius:5px;vertical-align:middle}
.ai-guide-page .box{border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15.5px}
.ai-guide-page .box .k{font-weight:800;letter-spacing:1px;font-size:12.5px;margin-bottom:2px;text-transform:uppercase}
.ai-guide-page .b1{background:#eef0ff}
.ai-guide-page .b2{background:var(--okbg)}
.ai-guide-page .b3{background:var(--badbg)}
.ai-guide-page .how{margin:14px 0 0}
.ai-guide-page .how .k{font-weight:800;letter-spacing:1px;color:var(--mut);font-size:13px;text-transform:uppercase}
.ai-guide-page .how ol{margin:6px 0 0 20px;padding:0}
.ai-guide-page .how li{margin:5px 0}
.ai-guide-page .simchips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.ai-guide-page .simchips button{display:flex;align-items:center;gap:10px;border:2.5px solid #2f7a4d;background:var(--okbg);border-radius:999px;padding:10px 16px;font-weight:800;font-size:16px;cursor:pointer;color:var(--ink);font-family:inherit}
.ai-guide-page .simchips button.off{border-color:#e3b0ab;background:#fff;color:#8a8fa8;text-decoration:line-through}
.ai-guide-page .simchips .bx{width:24px;height:24px;border-radius:6px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px;text-decoration:none}
.ai-guide-page .simchips .off .bx{background:#fff;border:2px solid #ccd2e6;color:transparent}
.ai-guide-page .caller{background:#eceef4;border-radius:14px;padding:14px;margin:6px 0}
.ai-guide-page .ai{background:#eef0ff;border:1px solid #cdd3ff;border-radius:14px;padding:14px;margin:6px 0}
.ai-guide-page .ai.bad{background:#fff1f0;border-color:#f3c6c1}
.ai-guide-page .ai small{display:block;color:var(--bad);font-weight:700;margin-top:6px}
.ai-guide-page .complete{font-weight:800;color:var(--mut);margin-top:8px}
.ai-guide-page .qrback{position:fixed;inset:0;background:rgba(10,15,40,.6);z-index:200;display:none;place-items:center;padding:20px}
.ai-guide-page .qrback.on{display:grid}
.ai-guide-page .qrbox{background:#fff;border-radius:22px;padding:20px;text-align:center;max-width:340px;width:100%}
.ai-guide-page #qrcv{display:grid;place-items:center;margin:12px 0;min-height:200px}
.ai-guide-page .btnp{background:var(--blue);border:0;color:#fff;font-weight:800;padding:12px 18px;border-radius:12px;font-size:15px;cursor:pointer;font-family:inherit}
.ai-guide-page .btnp.g{background:#e3e8f6;color:var(--ink)}
.ai-guide-page .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* Smart tour */
body.tour .ai-guide-page .spot{position:relative;z-index:60;box-shadow:0 0 0 3px #22d3ee,0 0 0 9999px rgba(8,12,34,.72)!important;background-clip:padding-box}
.ai-guide-page #tourbar{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none}
body.tour .ai-guide-page #tourbar{display:block}
.ai-guide-page #tourbar .in{max-width:640px;margin:0 auto;background:#0d1230;color:#fff;border:1px solid #3b4690;border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ai-guide-page #tourbar .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ai-guide-page #tourbar .tag{font-size:11px;font-weight:800;letter-spacing:.6px;background:linear-gradient(135deg,#8b5cf6,#3b82f6 55%,#22d3ee);padding:3px 9px;border-radius:999px;white-space:nowrap}
.ai-guide-page #tourbar .ctl{margin-left:auto;display:flex;gap:6px}
.ai-guide-page #tourbar .ctl button{background:#1b2250;border:1px solid #2c3566;color:#fff;width:34px;height:30px;border-radius:9px;cursor:pointer;font-size:14px}
.ai-guide-page #tourbar .cap{max-height:26vh;overflow:auto}
.ai-guide-page #tourbar .c1{font-weight:600;font-size:14px}
.ai-guide-page #tourbar .c2{color:#a9b4e0;font-size:12.5px;margin-top:5px}
.ai-guide-page #tourbar .bar{height:3px;background:#232b55;border-radius:3px;margin-top:8px;overflow:hidden}
.ai-guide-page #tourbar .bar i{display:block;height:100%;width:0;background:linear-gradient(135deg,#8b5cf6,#3b82f6,#22d3ee)}
.ai-guide-page #fab{position:fixed;right:12px;bottom:12px;z-index:90;display:flex;gap:8px}
.ai-guide-page #fab button{background:linear-gradient(135deg,#8b5cf6,#3b82f6 55%,#22d3ee);border:0;color:#fff;font-weight:800;padding:12px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(59,130,246,.45);cursor:pointer;font-family:inherit;font-size:14px}
.ai-guide-page #fab button.sec{background:#111a3c}
body.tour .ai-guide-page #fab{display:none}
.ai-guide-page .nopl{background:#fff4f2;border:2px solid #f3b4ac;border-radius:16px;padding:14px;margin:6px 0 12px}
.ai-guide-page .nopl .nt{font-weight:800;font-size:18px;color:#b42318}
.ai-guide-page .nopl p{margin:4px 0 10px;font-size:15px}
.ai-guide-page .wr{display:grid;gap:8px}
.ai-guide-page .wr>div{border-radius:12px;padding:10px 12px}
.ai-guide-page .wr .w{background:#fff;border:1px solid #f3b4ac}
.ai-guide-page .wr .r{background:#ecfdf3;border:1px solid #a8e7c0}
.ai-guide-page .wr span{display:block;font-weight:800;font-size:12.5px;letter-spacing:1px;margin-bottom:4px}
.ai-guide-page .wr .w span{color:#b42318}
.ai-guide-page .wr .r span{color:#166534}
.ai-guide-page .wr code{display:block;font:700 15px ui-monospace,Menlo,monospace;word-break:break-all;margin:2px 0}
.ai-guide-page .wr .w code{text-decoration:line-through;text-decoration-color:#dc2626}
.ai-guide-page .wr .w u{text-decoration:none;color:#dc2626}
.ai-guide-page .srcrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.ai-guide-page .srcok,.ai-guide-page .srcwarn{font-size:13px;font-weight:700;border-radius:10px;padding:5px 10px}
.ai-guide-page .srcok{background:#ecfdf3;color:#166534}
.ai-guide-page .srcwarn{background:#fff9e6;color:#b4531a}
.ai-guide-page .stl{padding-left:22px;margin:6px 0}
.ai-guide-page .stl li{margin:6px 0;font-size:15.5px}
.ai-guide-page .nts{padding-left:20px;margin:8px 0;font-size:14.5px;color:#374063}
.ai-guide-page .nts li{margin:6px 0}
.ai-guide-page .secrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ai-guide-page .secb{padding:10px 14px;border-radius:12px;border:2px solid #cfd6f0;background:#fff;font-weight:800;font-size:16px;color:#1d2a6b}
.ai-guide-page .secb.on{background:#2b3fb8;color:#fff;border-color:#2b3fb8}
.ai-guide-page .tbl{background:#f1f4ff;border-radius:14px;padding:12px;margin:10px 0}
.ai-guide-page .tbl p{margin:6px 0;font-size:14px}
.ai-guide-page .tbl .tr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ai-guide-page .tbl .tr div{background:#fff;border-radius:10px;padding:8px;text-align:center;font-size:13px}
.ai-guide-page .tbl .tr b{display:block;font-size:15px;color:#2b3fb8}
.ai-guide-page .warnbox{background:#fff4e0;border:1px solid #f0c27a;border-radius:14px;padding:12px;margin:10px 0}
.ai-guide-page .warnbox p{margin:4px 0 0;font-size:14px}
.ai-guide-page .hw li{margin:8px 0;font-size:17px}
.ai-guide-page .two{display:grid;gap:10px;margin:8px 0}
.ai-guide-page .two .m{background:#f1f4ff;border-radius:14px;padding:12px}
.ai-guide-page .two .m p{margin:4px 0 0;font-size:15px}

const ds=l=>`<b>${l[0]}</b>${l[1]}<b>${l[2]}</b>`;
function carrierGuide(car,cd){
 const g=GT[S.lang],F=cd.F,two=F.two,N=S.num.length===10?S.num:SAMPLE;
 const badge=F.official?`<span class="srcok">${g.srcOk}</span>`:`<span class="srcwarn">${g.srcWarn}</span>`;
 let h=`<div class="noteblue">${S.num.length===10?"":`<b>${g.sampleT}</b> `}${g.sampleP}</div><div class="nopl"><div class="nt">${g.noPlusT}</div><p>${g.noPlusP}</p>
  <div class="wr"><div class="w"><span>✕ ${g.wrong}</span><code>${ds(cd.wrong[0]).replace(/<b>/g,'<u>').replace(/<\/b>/g,'</u>')}</code><code>${cd.wrong[1].join("")}</code></div>
  <div class="r"><span>✓ ${g.right}</span><code>${cd.lines.map(l=>l.join("")).join(two?"  →  ":"")}</code></div></div></div>
  <div class="srcrow">${badge}<span class="badge">${t("untested")}</span></div>
  ${S.num.length===10?`<div class="noteblue"><b>${g.realAI}</b> ${fmt(S.num)}</div>`:`<div class="samplebox"><b>${g.sampleAI}</b> ${fmt(SAMPLE)}<p>${g.sampleAIp}</p></div>`}
  ${two?"":`<div class="formula"><div><small>${g.fCode}</small><b>${cd.lines[0][0]}</b></div><i>+</i><div><small>${g.fNum}</small><b>${N}</b></div>${cd.lines[0][2]?`<i>+</i><div><small>${g.fEnd}</small><b>${cd.lines[0][2]}</b></div>`:""}<i>=</i><div class="res"><small>${g.fAll}</small><b>${cd.lines[0].join("")}</b></div></div>`}
  <div class="codepanel"><div class="t">${two?g.stepA:t("typeLine")}</div>`;
 cd.lines.forEach((l,i)=>{
  if(two&&i===1)h+=`<div class="small" style="margin:6px 0">${g.wait}</div><div class="t">${g.stepB}</div>`;
  h+=`<div class="codebox"><b>${l[0]}</b>${l[1]}<b>${l[2]}</b></div><div class="small">${t("legend")}</div><button class="copy" data-copy="${l.join("")}">${t("copy")}</button>`;
 });
 h+=`<div class="small">${t("ten")}</div>
  ${assignedNumber?`<div class="small"><b>${g.autoN}</b> ${fmt(S.num)}</div>`:`<div class="numrow"><label for="numIn">${t("inputLb")}</label><input id="numIn" inputmode="numeric" maxlength="14" placeholder="(___) ___-____" value="${fmt(S.num)}"></div>`}</div>`;
 if(cd.extra){h+=`<div class="lbl">${g.extraT}</div><div class="codepanel" style="padding:10px">`+cd.extra.map(l=>`<div class="codebox" style="font-size:22px"><b>${l[0]}</b>${l[1]}<b>${l[2]}</b></div><button class="copy" style="font-size:16px;padding:10px 18px" data-copy="${l.join("")}">${t("copy")}</button>`).join("")+`</div>`;}
 const steps=F.two||(F.hand&&car.f==="xv")?g.stH:(F.hand?g.stC:g.stM);
 h+=`<div class="lbl">${t("h4")}</div><ol class="stl">${steps.map(x=>`<li>${x}</li>`).join("")}</ol>`;
 if(cd.F.sec&&S.mode==="ring"){h+=`<div class="lbl">${g.secT}</div><p class="small">${g.secP}</p><div class="secrow">${[5,10,15,20,25,30].map(s=>`<button class="secb ${S.sec===s?"on":""}" data-sec="${s}">${s} ${g.secU}</button>`).join("")}</div>
  <div class="tbl"><b>${g.tblT}</b><p>${g.tblP}</p><div class="tr">${g.tblR.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div><p>${g.tblN}</p></div>`}
 if(S.mode==="ring"){h+=`<div class="warnbox"><b>${g.vmT}</b><p>${g.vmP}</p></div>`;if(["att","tm"].includes(car.f)||["cr","mm"].includes(car.id))h+=`<div class="warnbox"><b>${g.ppT}</b><p>${g.ppP}</p></div>`}
 h+=`<div class="noteblue">${S.mode==="ring"?(g.ringNotes[car.f]||""):""}</div><ul class="nts">${g.notes[car.f].map(x=>`<li>${x}</li>`).join("")}</ul>`;
 return h;
}

a3l:[["Có thông báo “cuộc gọi nhỡ”","Mở app, đọc phần tóm tắt. Nếu khách hỏi giá hoặc muốn đặt lịch, gọi lại trong 15 phút."],["Có tin nhắn mới trong app","Trả lời ngay trong app, đừng dùng điện thoại cá nhân. Khách nhắn STOP thì đừng nhắn lại."],["Không ai nghe và cuộc gọi không tới AI","Chín trên mười lần là do hộp thư thoại nghe trước. Tắt hộp thư rồi thử lại. Vẫn hư thì bấm mã đỏ ở trên và gọi hỗ trợ."],["AI báo sai giá hoặc sai giờ","Chụp màn hình, ghi giờ cuộc gọi, gửi cho hỗ trợ. Khách đang bị ảnh hưởng thì gọi điện, đừng gửi email."],["Cuối ngày","Hai phút trong app: tin nhắn chưa trả lời, cuộc gọi nhỡ chưa gọi lại. Rồi đóng app."]],
a4:"Khách quen hỏi “sao máy nghe điện thoại vậy?”",a4b:"Nói vầy: “Tiệm có thêm trợ lý nghe điện thoại để không bỏ sót ai khi tụi em đang làm cho khách. Chị cứ nói chuyện bình thường, hoặc nhắn tin cho tiệm, tụi em thấy liền.”",

{h:"Thông tin tiệm",b:"Thông tin tiệm",why:"AI là lễ tân của mình. Phải biết tên, địa chỉ, số điện thoại và giờ mở cửa thì mới nói đúng.",uses:"Trả lời “mấy giờ mở cửa?” và “tiệm ở đâu?”, và chỉ đặt lịch trong giờ làm việc. Ngày lễ nghỉ thì AI báo khách không đặt được.",miss:"Không có giờ làm việc: AI có thể đặt lịch cho khách lúc tiệm đóng cửa.",how:["Mở POS và chọn Cài đặt tiệm.","Chọn tab Thông tin tiệm.","Kiểm tra tên, địa chỉ và số điện thoại.","Bấm Sửa giờ và nhập giờ mở, giờ đóng cho từng ngày.","Thêm những ngày lễ nghỉ ở mục Ngày lễ & Nghỉ."]},

{h:"Dịch vụ",b:"Dịch vụ",why:"Khách hỏi giá và hỏi làm mất bao lâu. AI cần danh sách dịch vụ để trả lời và biết giữ bao nhiêu thời gian.",uses:"Báo giá, báo thời gian, và giữ đủ chỗ trong lịch cho dịch vụ đó.",miss:"Thiếu dịch vụ, giá hoặc thời gian: AI không báo giá được, hoặc đặt khung giờ quá ngắn.",how:["Chọn tab Dịch vụ.","Chọn nhóm (Manicure, Pedicure, Gel...).","Điền Giá và Thời gian cho từng dịch vụ.","Tiệm ngưng làm dịch vụ nào thì tắt Active dịch vụ đó."]},
{h:"Cấp bậc: ai làm được dịch vụ nào",b:"Cấp bậc nhân viên, và cột Duyệt trong Dịch vụ",why:"Không phải thợ nào cũng làm được mọi dịch vụ. Cấp bậc cho AI biết ai đủ trình độ làm gì.",uses:"Khi khách hỏi gel hoặc bột, AI chỉ đặt cho thợ làm được.",miss:"Không có cấp bậc: AI không biết ai làm được gì, nên có thể đặt nhầm người hoặc không đặt được đúng thợ.",how:["Chọn tab Cấp bậc nhân viên và tạo cấp bậc (ví dụ Cơ bản, Nâng cao, Senior).","Mở hồ sơ từng nhân viên và chọn cấp bậc.","Trong Dịch vụ, xem cột Duyệt để biết dịch vụ nào cần cấp bậc nào."]},
{h:"AI Lễ Tân: lời chào, giới thiệu tiệm, câu hỏi thường gặp",b:"AI LỄ TÂN",why:"Đây là chỗ dạy AI nói chuyện đúng giọng tiệm: ngôn ngữ, giọng đọc, lời chào, khuyến mãi và câu trả lời cho câu hỏi hay gặp.",uses:"Chào theo phong cách tiệm, trả lời về chỗ đậu xe, chính sách hủy lịch và khuyến mãi, và nhắn tin chào khách gọi lần đầu.",miss:"Để trống: AI chỉ đặt lịch được, không có câu trả lời cho mấy câu hỏi ngoài lề.",how:["Chọn tab AI LỄ TÂN.","Chọn ngôn ngữ và giọng đọc, rồi nghe thử.","Viết lời chào và phần Giới thiệu tiệm.","Điền câu hỏi thường gặp: chỗ đậu xe, hủy lịch, thanh toán.","Tải lên tài liệu chính sách nếu có."]}],

erta de “llamada perdida”", "Abra la app y lea el resumen. Si preguntaron el precio o quisieron reservar, devuelva la llamada en 15 minutos."], ["Un mensaje de texto nuevo en la app", "Responda dentro de la app, no desde su teléfono personal. Si escriben STOP, no les escriba de vuelta."], ["Nadie contesta y nunca llega a la IA", "Nueve de cada diez veces gana el buzón de voz. Apáguelo y pruebe otra vez. Si sigue mal: marque el código rojo de arriba y llame a soporte."], ["La IA dio un precio u hora equivocados", "Tome una captura, anote la hora de la llamada y envíela a soporte. Si afecta a un cliente ahora mismo: llame, no mande correo."], ["Al final del día", "Dos minutos en la app: mensajes sin responder y llamadas perdidas sin devolver. Luego ciérrela."]], "a4": "Un cliente habitual pregunta “¿por qué contestó una máquina?”", "a4b": "Diga esto: “Agregamos un asistente que contesta el teléfono para no perder a nadie mientras atendemos a un cliente. Puede hablarle con normalidad, o escribirnos. Lo vemos de inmediato.”", "stuckK": "¿NECESITA AYUDA? LLAME", "hours": "De lunes a viernes, de 9:00 AM a 5:00 PM", "share": "📱 Comparta esta guía con un código QR", "qrT": "Escanee para abrir esta guía", "qrCopy": "Copiar enlace", "qrClose": "Cerrar", "e2": "AI VOICE · CONFIGURACIÓN INTELIGENTE", "t2": "Enseñe a la IA sobre su salón", "s2t": "La IA es tan inteligente como la información que usted le da. Complete las 5 partes de abajo para que la IA reserve correctamente.", "dark": "La IA no sabe por arte de magia su horario, su personal ni quién puede hacer cada servicio. Necesita el conjunto completo. Si falta una parte, la IA contesta peor o tiene que pasar la llamada a una persona.", "tabsApp": ["Salon Information", "SMS Settings", "Staff", "Services", "Roles & Permissions", "Staff Levels", "AI RECEPTIONIST"], "why": "Por qué importa", "uses": "La IA lo usa para", "miss": "Si falta", "how": "Cómo hacerlo", "pos": "POS → Salon Settings → ", "cards": [{"h": "Información de const VP={"vi": "2 phút 44 giây. Có giọng đọc và phụ đề tiếng Việt, làm theo từng màn hình.", "en": "2 min 21 sec. Narrated in English with English captions.", "es": "2 min 45 s. Narrado en español con subtítulos en español."};const NTS={"vi": [0, 11.86, 34.63, 48.72, 63.04, 69.11, 95.77, 111.41, 121.33, 141.5, 156.95], "en": [0, 11.15, 28.18, 42.12, 54.28, 61.18, 84.97, 97.11, 108.02, 124.13, 135.31], "es": [0, 14.73, 33.75, 49.49, 63.17, 70.37, 96.47, 109.9, 123.15, 142.65, 156.64]};const PARAS={vi:["Chào anh chị em chủ tiệm, Brian đây. Hôm nay Brian hướng dẫn mình cài AI nghe điện thoại cho tiệm. Làm một lần là xong, sau đó AI nghe điện thoại giúp mình mỗi ngày.", "Trước hết, mình hiểu cách nó chạy. Khách gọi vô số điện thoại của tiệm. Điện thoại của tiệm sẽ chuyển cuộc gọi đó đi, qua số điện thoại AI mà NEXORA TOUCH cấp cho tiệm, rồi AI nghe máy thay cho mình. Nghĩa là mình dùng chính điện thoại của tiệm để bấm một dãy mã, chứ mình không gõ vào hệ thống.", "Có hai cách cài. Cách thứ nhất, AI nghe máy liền, điện thoại tiệm không đổ chuông. Cách thứ hai, điện thoại tiệm đổ chuông khoảng ba hồi, tức là khoảng hai chục giây, nếu mình không bắt máy thì AI mới nghe.", "Bước một, chọn nhà mạng của số điện thoại tiệm, là tên in trên hóa đơn. Mỗi nhà mạng có mã khác nhau, nên mình chọn cho đúng. Nếu mình không biết, bấm vô dòng, tôi không biết nhà mạng của mình.", "Bước hai, chọn cách cài. AI nghe máy liền, hay đổ chuông vài hồi rồi AI mới nghe.", "Bước ba, hệ thống hiện ra dãy mã cho mình. Dãy mã ghép từ hai phần: mã của nhà mạng, cộng với số điện thoại AI. Số ở đây là số mẫu thôi nha, mình không bấm số mẫu. Mình dùng số AI mà NEXORA TOUCH cấp cho tiệm của mình. Và nhớ, chỉ bấm đúng mười số, không thêm dấu cộng một, không thêm số một phía trước. Đây là lỗi nhiều người hay gặp, thêm vô là chuyển cuộc gọi không chạy.", "Rồi mình cầm điện thoại của tiệm, mở bàn phím, gõ đúng dãy mã đó, bấm nút gọi, chờ nghe tiếng báo hoặc tin nhắn xác nhận, rồi tắt máy. Nếu mình xài AT&T hay T-Mobile, nhớ bấm dấu thăng ở cuối.", "Xong rồi mình gọi thử. Dùng một điện thoại khác, gọi vô số của tiệm. Nếu chọn AI nghe liền thì AI trả lời ngay. Nếu chọn đổ chuông thì chờ khoảng hai chục giây.", "Nếu bấm mã mà không được, mình gọi chăm sóc khách hàng của nhà mạng, số in trên hóa đơn, và hỏi: điện thoại của tôi có chuyển cuộc gọi sang số khác được không? Xin bật giúp tôi call forwarding sang số AI. Lưu ý, một số gói trả trước không cho chuyển cuộc gọi.", "Còn khi AI có trục trặc, hoặc mình muốn lấy lại điện thoại, mình bấm mã tắt trong khung màu đỏ, từ điện thoại của tiệm. Sau đó dùng điện thoại khác gọi vô số tiệm, để chắc là điện thoại của mình đổ chuông lại.", "Vậy là xong. Cần giúp thì mình gọi hỗ trợ NEXORA TOUCH. Chúc anh chị em đông khách. NEXORA TOUCH."],en:["Hi shop owners, it's Brian. Today I'll show you how to set up the AI to answer your shop's phone. You do it once, and after that the AI answers the phone for you every day.", "First, how it works. A customer calls your shop number. Your shop phone forwards that call to the AI phone number that NEXORA TOUCH gave your shop, and the AI answers for you. So you use your own shop phone to dial a short code. You do not type it into the system.", "There are two ways to set it up. In the first, the AI answers right away, and your shop phone does not ring. In the second, your shop phone rings about three times, around twenty seconds, and if you do not pick up, the AI answers.", "Step one, pick the carrier of your shop phone number. It is the name printed on your bill. Each carrier has a different code, so pick the right one. If you do not know it, tap I do not know my carrier.", "Step two, choose how you want it to work. The AI answers right away, or the phone rings a few times first.", "Step three, the guide shows you your code. It has two parts put together: your carrier's code, plus the AI phone number. The number you see here is only a sample, so do not dial it. Use the AI number NEXORA TOUCH gave your shop. And remember, dial exactly ten digits. No plus one, and no one in front. This is the most common mistake, and it stops the forwarding from working.", "Then take your shop phone, open the keypad, type the exact code, press call, wait for the confirmation tone or message, and hang up. If you are on AT&T or T-Mobile, remember the pound key at the end.", "Now test it. Use a different phone and call your shop number. If you chose answer right away, the AI picks up immediately. If you chose ring first, wait about twenty seconds.", "If the code does not work, call your carrier's customer service, the number on your bill, and ask: can my phone forward calls to another number? Please turn on call forwarding to the AI number. Note that some prepaid plans do not allow forwarding.", "And if the AI has a problem, or you want your phone back, dial the turn-off code in the red box from your shop phone. Then call the shop from another phone to make sure it rings again.", "That's it. If you need help, call NEXORA TOUCH support. Wishing you a busy shop. NEXORA TOUCH."],es:["Hola, dueños de negocio, soy Brian. Hoy les voy a enseñar cómo configurar la inteligencia artificial para que conteste el teléfono de su negocio. Se hace una sola vez, y después la IA contesta el teléfono por ustedes todos los días.", "Primero, cómo funciona. Un cliente llama al número de su negocio. El teléfono de su negocio desvía esa llamada al número de IA que NEXORA TOUCH le asignó, y la IA contesta por usted. Es decir, usted usa el teléfono de su propio negocio para marcar un código corto. No lo escribe en el sistema.", "Hay dos formas de configurarlo. En la primera, la IA contesta de inmediato y el teléfono del negocio no suena. En la segunda, el teléfono suena unas tres veces, unos veinte segundos, y si usted no contesta, entonces contesta la IA.", "Paso uno, elija la compañía de teléfono de su número. Es el nombre que aparece en su factura. Cada compañía tiene un código distinto, así que elija la correcta. Si no la sabe, toque, no sé cuál es mi compañía.", "Paso dos, elija cómo quiere que funcione. La IA contesta de inmediato, o primero suena unas veces.", "Paso tres, la guía le muestra su código. Se arma con dos partes: el código de su compañía, más el número de teléfono de la IA. El número que ve aquí es solo un ejemplo, no lo marque. Use el número de IA que NEXORA TOUCH le asignó a su negocio. Y recuerde, marque exactamente diez dígitos. Sin más uno, y sin un uno al frente. Este es el error más común, y hace que el desvío no funcione.", "Luego tome el teléfono de su negocio, abra el teclado, escriba el código exacto, presione llamar, espere el tono o el mensaje de confirmación y cuelgue. Si tiene AT&T o T-Mobile, recuerde la tecla de numeral al final.", "Ahora haga la prueba. Use otro teléfono y llame al número de su negocio. Si eligió que la IA conteste de inmediato, la IA contesta al instante. Si eligió que suene primero, espere unos veinte segundos.", "Si el código no funciona, llame al servicio al cliente de su compañía, el número que está en su factura, y pregunte: ¿mi teléfono puede desviar llamadas a otro número? Por favor active el desvío de llamadas al número de la IA. Tenga en cuenta que algunos planes prepagados no permiten el desvío.", "Y si la IA tiene un problema, o quiere recuperar su teléfono, marque el código para apagar, el del recuadro rojo, desde el teléfono de su negocio. Después llame al negocio desde otro teléfono para comprobar que vuelve a sonar.", "Eso es todo. Si necesita ayuda, llame a soporte de NEXORA TOUCH. Les deseo un negocio lleno de clientes. NEXORA TOUCH."]};

}

function showCap(){if(!tourOn)return;$("tc1").textContent=PARAS[S.lang][tourIdx];}
function spot(i){
 document.querySelectorAll(".spot").forEach(x=>x.classList.remove("spot"));
 const [id,tab]=SEC[i]; if(tab&&S.tab!==tab){S.tab=tab;render()}
 const el=$(id);el.classList.add("spot");setTimeout(()=>{if(tourOn)el.scrollIntoView({behavior:"smooth",block:"start"})},60);
 showCap();tourT0=Date.now();tourDwell=Math.min(12000,Math.max(5500,PARAS[S.lang][i].length*48));
}
function goto(i){tourIdx=((i%SEC.length)+SEC.length)%SEC.length;render();spot(tourIdx)}

 if(tourPaused){tourT0+=80;return}

$("vid").addEventListener("play",()=>{if(tourOn)stopTour()});$("tStop").onclick=stopTour;

},{capture:true,passive:true}));
["click","change","input","keyup"].forEach(ev=>document.addEventListener(ev,()=>{

 },0);
}));
