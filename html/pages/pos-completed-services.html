<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora Touch - Completed Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/nexora-icons.css">
  <link rel="stylesheet" href="../assets/nexora-shell.css">
  <link rel="stylesheet" href="../assets/pos-front-desk.css">
  <link rel="stylesheet" href="../assets/pos-demo-settings.css">
  <link rel="stylesheet" href="../assets/pos-direct-checkout.css?v=service-names-1">
  <link rel="stylesheet" href="../assets/front-desk-tabs.css">
</head>
<body>
<div class="shell"><aside class="sidebar" aria-label="Salon sidebar"></aside><div class="app-area"><header class="header"></header>
<main class="content front-desk direct-checkout-page">
  <h1>Front Desk</h1><p class="subtitle">Check in guests, manage open tickets, and run the turn board.</p>
  <nav class="workflow" data-front-desk-tabs aria-label="Front Desk workflows"></nav>
  <script src="../assets/front-desk-tabs.js"></script>
  <section class="po-direct" data-completed-root aria-label="Paid checkouts">
    <div class="checkout-hero"><div class="checkout-list-title"><h2>Completed Services</h2><span class="count-chip" data-completed-count>Paid: 0</span></div><button type="button" class="po-account" data-pos-switch><i data-lucide="user-round" aria-hidden="true"></i><span data-completed-account></span></button></div>
    <div class="po-list-tools"><input class="input" type="search" data-completed-search placeholder="Search name, phone or ID" aria-label="Search completed services"><select class="select" data-completed-source aria-label="Checkout source"><option value="all">All sources</option><option value="direct">Checkout Customer</option><option value="tickets">Tickets</option></select></div>
    <p class="review-warning" data-completed-error role="status" hidden></p>
    <div class="ticket-grid" data-completed-list aria-live="polite"></div>
  </section>
</main></div></div>
<script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>window.NEXORA_SHELL={activePage:'pos',activeTab:'front-desk'};</script>
<script src="../assets/nexora-icons.js"></script>

<script src="../assets/appointments-store.js"></script>
<script src="../assets/front-desk-data.js"></script>
<script src="../assets/pos-demo-settings.js"></script>
<script src="../assets/pos-completed-services.js?v=completed-1"></script>
</body></html>
