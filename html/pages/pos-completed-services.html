<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora Touch - Completed Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/nexora-icons.css">
  <link rel="stylesheet" href="../assets/nexora-shell.css?v=20261030-shared-header-v47">
  <link rel="stylesheet" href="../assets/pos-front-desk.css">
  <link rel="stylesheet" href="../assets/pos-demo-settings.css">
  <link rel="stylesheet" href="../assets/pos-completed-services.css?v=staging-20261028">
  <link rel="stylesheet" href="../assets/front-desk-tabs.css">
</head>
<body>
<div class="shell"><aside class="sidebar" aria-label="Salon sidebar"></aside><div class="app-area"><header class="header"></header>
<main class="content front-desk completed-page">
  <h1>Front Desk</h1><p class="subtitle">Check in guests, manage open tickets, and run the turn board.</p>
  <nav class="workflow" data-front-desk-tabs aria-label="Front Desk workflows"></nav>
  <script src="../assets/front-desk-tabs.js"></script>
  <section data-completed-root aria-label="Completed Services">
    <form class="cs-filters" data-completed-filters>
      <label class="cs-date"><span data-date-display="from">From</span><i data-lucide="calendar-days" aria-hidden="true"></i><input type="date" name="from" aria-label="From"></label>
      <label class="cs-date"><span data-date-display="to">To</span><i data-lucide="calendar-days" aria-hidden="true"></i><input type="date" name="to" aria-label="To"></label>
      <input type="search" name="customer" placeholder="Search by name..." aria-label="Customer Name">
      <input type="search" name="phone" placeholder="Search by phone..." aria-label="Phone">
      <button type="submit" class="cs-primary">Filter</button>
    </form>
    <p class="cs-error" data-completed-error role="status" hidden></p>
    <p class="cs-empty" data-completed-empty hidden>No completed tickets in this range.</p>
    <div class="cs-table-card" data-completed-results>
      <div class="cs-table-scroll" tabindex="0" role="region" aria-label="Completed Services">
        <table><thead><tr><th scope="col">Number</th><th scope="col">Customer</th><th scope="col">Phone</th><th scope="col">Completed</th><th scope="col">Technician</th><th scope="col">Services</th><th scope="col">Payment</th><th scope="col">Total</th><th scope="col">Actions</th></tr></thead><tbody data-completed-list></tbody></table>
      </div>
      <div class="cs-pagination"><span data-completed-pagination aria-live="polite"></span><div><button type="button" data-completed-page="previous">Previous</button><button type="button" data-completed-page="next">Next</button></div></div>
    </div>
  </section>
</main></div></div>
<dialog class="cs-dialog" id="completed-detail" aria-labelledby="completed-detail-title">
  <h2 id="completed-detail-title">Ticket Detail</h2>
  <div class="cs-tabs" role="tablist" aria-label="Ticket Detail"><button type="button" role="tab" id="completed-details-tab" data-completed-tab="details" aria-selected="true" aria-controls="completed-details">Details</button><button type="button" role="tab" id="completed-history-tab" data-completed-tab="history" aria-selected="false" aria-controls="completed-history" tabindex="-1">Edit History</button></div>
  <div id="completed-details" role="tabpanel" aria-labelledby="completed-details-tab" data-completed-details></div>
  <div id="completed-history" role="tabpanel" aria-labelledby="completed-history-tab" hidden></div>
  <div class="cs-dialog-footer"><button type="button" data-completed-close>Close</button><button type="button" class="cs-green" data-completed-action="sms"><i data-lucide="message-square" aria-hidden="true"></i>SMS</button><button type="button" class="cs-primary" data-completed-action="print"><i data-lucide="printer" aria-hidden="true"></i>Re-print receipt</button></div>
</dialog>
<dialog class="cs-dialog cs-action-dialog" id="completed-action" aria-labelledby="completed-action-title"><form data-completed-action-form><div class="cs-action-heading"><div><h2 id="completed-action-title"></h2><p data-completed-action-intro></p></div><button type="button" data-action-close aria-label="Close"><i data-lucide="x" aria-hidden="true"></i></button></div><div data-completed-action-body></div><div class="cs-action-footer"><button type="button" data-action-close>Cancel</button><button type="submit" class="cs-primary" data-action-submit>Continue</button></div></form></dialog>
<script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>window.NEXORA_SHELL={activePage:'pos',activeTab:'front-desk'};</script>
<script src="../assets/nexora-icons.js"></script>
  <script src="../assets/nexora-shell-nav.js?v=20261029-sidebar-group-labels"></script>
  <script src="../assets/nexora-shell.js?v=20261030-header-nine-dots-v48"></script>
<script src="../assets/salon-data.js"></script>
<script src="../assets/appointment-tickets.js"></script>
<script src="../assets/appointments-store.js"></script>
<script src="../assets/front-desk-data.js"></script>
<script src="../assets/pos-demo-settings.js"></script>
<script src="../assets/pos-completed-services.js?v=staging-20261028"></script>
</body></html>
