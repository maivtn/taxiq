<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Touch - Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/nexora-icons.css">
  <link rel="stylesheet" href="../assets/nexora-shell.css?v=20261028-current-item-gradient">
  <style>
    :root{--nexora-canvas:#f7f9fc;--nexora-surface:#fff;--nexora-surface-muted:#f3f6fa;--nexora-border:#dde5ef;--nexora-text:#0b1220;--nexora-muted:#4d5870;--nexora-subtle:#7a8296;--nexora-sidebar:#081f49;--nexora-brand:#4648d8;--nexora-electric:#2b59ff;--nexora-violet:#8e4df8;--nexora-card-shadow:0 2px 8px rgba(15,23,42,.08);--nexora-soft-shadow:0 8px 24px rgba(15,23,42,.06)}
    .community-content.content{padding:0;min-height:0}#community-staging{display:block;width:100%;height:calc(100dvh - 64px);min-height:480px;border:0;background:var(--nexora-canvas)}
    @media(max-width:639px){#community-staging{height:calc(100dvh - 116px);min-height:420px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Dashboard sidebar"></aside>
    <div class="app-area">
      <header class="header"></header>
      <main class="content community-content" aria-label="Community content"><iframe id="community-staging" title="Nexora Community"></iframe></main>
    </div>
  </div>
  <script>
    if(new URLSearchParams(location.search).get('role')==='tech')location.replace('staff-community.html'+location.search+location.hash);
    window.NEXORA_SHELL={activePage:'community',isCommunity:true,activeTab:'feed',onNavigate:function(tab){if(window.navigateCommunityHub)window.navigateCommunityHub(tab);}};
  </script>
  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
  <script src="../assets/nexora-icons.js"></script>
  <script src="../assets/nexora-shell-nav.js?v=20261028-ai-hub-po"></script>
  <script src="../assets/nexora-shell.js?v=20261028-sidebar-selection-768"></script>
  <script src="../assets/community-staging-integration.js?v=20261028-production"></script>
</body>
</html>
