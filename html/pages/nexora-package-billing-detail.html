<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA TOUCH - Billing Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/nexora-shell.css">
  <link rel="stylesheet" href="../assets/nexora-package-billing-detail.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Dashboard sidebar"></aside>

    <div class="app-area">
      <div class="billing-dev-toolbar" aria-label="Developer billing tools">
        <button class="billing-dev-preview-button" type="button" data-billing-email-preview-open>
          <i data-lucide="code-2" aria-hidden="true"></i>
          <span>dev - view html send email</span>
        </button>
      </div>
      <header class="header"></header>

      <main class="content" aria-label="Billing details content">
        <section class="billing-detail-page" aria-labelledby="billing-detail-title">
          <a class="billing-detail-back" href="nexora-packages.html?tab=history">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            <span>Back to Package History</span>
          </a>
          <h1 class="visually-hidden" id="billing-detail-title">Billing details</h1>
          <div data-billing-detail-root></div>
        </section>
      </main>
    </div>
  </div>

  <div class="billing-email-preview-modal" data-billing-email-preview-modal hidden aria-hidden="true">
    <div class="billing-email-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="billing-email-preview-title" aria-describedby="billing-email-preview-description">
      <div class="billing-email-preview-head">
        <div>
          <span class="billing-payment-kicker">Developer preview</span>
          <h2 id="billing-email-preview-title">HTML send email</h2>
          <p id="billing-email-preview-description">Mobile-style preview of the billing HTML that will be sent by email.</p>
        </div>
        <button class="billing-payment-close" type="button" data-billing-email-preview-close aria-label="Close email HTML preview"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <div class="billing-email-preview-body" data-billing-email-preview-body></div>
    </div>
  </div>

  <div class="billing-payment-modal" data-billing-payment-modal hidden aria-hidden="true">
    <div class="billing-payment-dialog" role="dialog" aria-modal="true" aria-labelledby="billing-payment-title" aria-describedby="billing-payment-description">
      <div class="billing-payment-head">
        <div>
          <span class="billing-payment-kicker">NEXORA TOUCH secure billing</span>
          <h2 id="billing-payment-title">Pay invoice</h2>
          <p id="billing-payment-description">Choose a payment method for this invoice.</p>
        </div>
        <button class="billing-payment-close" type="button" data-billing-payment-close aria-label="Close payment dialog"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>

      <div class="billing-payment-body">
        <div class="billing-payment-summary" data-billing-payment-summary></div>
        <fieldset class="billing-payment-methods">
          <legend>Payment method</legend>
          <label><input type="radio" name="billing-payment-method" value="card" checked><span><i data-lucide="credit-card" aria-hidden="true"></i><strong>Credit or debit card</strong></span></label>
          <label><input type="radio" name="billing-payment-method" value="usdv"><span><i data-lucide="wallet-cards" aria-hidden="true"></i><strong>USDV balance</strong></span></label>
          <label><input type="radio" name="billing-payment-method" value="usdt"><span><i data-lucide="coins" aria-hidden="true"></i><strong>USDT balance</strong></span></label>
        </fieldset>
        <div class="billing-payment-demo-note" role="note"><i data-lucide="info" aria-hidden="true"></i><span>Demo only - payment processing is not connected.</span></div>
      </div>

      <div class="billing-payment-foot">
        <button class="billing-payment-secondary" type="button" data-billing-payment-close>Close</button>
        <button class="billing-payment-primary" type="button" data-billing-payment-close><i data-lucide="shield-check" aria-hidden="true"></i><span>Continue payment demo</span></button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
  <script src="../assets/nexora-package-billing-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/nexora-package-billing-detail.js"></script>
  <script>
    window.NEXORA_SHELL = {
      activePage: 'packages',
      activeTab: 'history'
    };
  </script>
  <script src="../assets/nexora-shell.js"></script>
</body>
</html>
