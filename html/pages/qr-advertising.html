<!doctype html>
<html lang="vi">
  <head>
    <script>window.__EMBED = true;</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="oneqr-policy-version" content="ONEQR-ADS-WALLET-2026-10-27">
    <title>OneQR · Quảng cáo &amp; thu nhập</title>
    <link rel="stylesheet" href="../assets/qr-stations.css?v=industry-module-library-8">
    <link rel="stylesheet" href="../assets/nexora-shell.css">
    <link rel="stylesheet" href="../assets/oneqr-advertising.css?v=po-20261027-compact-tabs">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Dashboard sidebar"></aside>
      <div class="app-area">
        <header class="header"></header>
        <main class="content qr-stations-page">
          <div class="qr-advertising-shell">
            <div class="qr-stations-heading">
              <div class="qr-tabs" role="tablist" aria-label="Stations and QR tabs">
                <a class="qr-tab" href="qr-stations.html?tab=one-qr" role="tab" aria-selected="false">
                  <span class="qr-tab-icon">
                    <i data-lucide="scan-line" aria-hidden="true"></i>
                  </span>
                  <span>OneQR</span>
                </a>
                <a class="qr-tab is-active" href="qr-advertising.html" role="tab" aria-selected="true" aria-current="page">
                  <span class="qr-tab-icon">
                    <i data-lucide="megaphone" aria-hidden="true"></i>
                  </span>
                  <span>Quảng cáo</span>
                </a>
                <a class="qr-tab" href="qr-stations.html?tab=qr-stations" role="tab" aria-selected="false">
                  <span class="qr-tab-icon">
                    <i data-lucide="hand-coins" aria-hidden="true"></i>
                  </span>
                  <span>Receive Tips</span>
                </a>
                <a class="qr-tab" href="qr-stations.html?tab=accept-payment" role="tab" aria-selected="false">
                  <span class="qr-tab-icon">
                    <i data-lucide="credit-card" aria-hidden="true"></i>
                  </span>
                  <span>Accept Payment</span>
                </a>
                <a class="qr-tab" href="qr-stations.html?tab=referral-link" role="tab" aria-selected="false">
                  <span class="qr-tab-icon">
                    <i data-lucide="share-2" aria-hidden="true"></i>
                  </span>
                  <span>Referral Link</span>
                </a>
                <a class="qr-tab" href="qr-stations.html?tab=staff-invite-qr" role="tab" aria-selected="false">
                  <span class="qr-tab-icon">
                    <i data-lucide="user-plus" aria-hidden="true"></i>
                  </span>
                  <span>Staff Invite QR</span>
                </a>
              </div>
            </div>
            <div id="oneqr-advertising" class="qa-app" data-po-source="from-po/quang-cao/NEXORA_ONEQR_Chinh_sach_Va_Vi (2).html">
              <h1 data-i="title">OneQR · Quảng cáo &amp; thu nhập</h1>
              <nav id="nav" aria-label="OneQR">
                <button class="active" data-view="setup" data-i="navSetup"></button>
                <button data-view="overview" data-i="navOverview"></button>
                <button data-view="earn" data-i="navEarn"></button>
                <button data-view="transfer" data-i="navTransfer"></button>
                <button data-view="ads" data-i="navAds"></button>
                <button data-view="policy" data-i="navPolicy"></button>
              </nav>
              <section data-screen="setup" id="setup">
                <div class="card hero">
                  <span id="status" class="tag" role="status"></span>
                  <h2 style="margin-top:16px" data-i="setupTitle"></h2>
                  <p data-i="setupIntro"></p>
                  <label for="group" data-i="groupLabel"></label>
                  <select id="group" required></select>
                  <label for="industry" data-i="industryLabel"></label>
                  <select id="industry" required></select>
                  <label for="secondary" data-i="secondaryLabel"></label>
                  <select id="secondary" multiple size="5"></select>
                  <p class="muted" data-i="secondaryHelp"></p>
                  <div id="customBlock" class="hide">
                    <label for="custom" data-i="customLabel"></label>
                    <input id="custom" data-ph="customPlaceholder">
                  </div>
                  <p class="notice" data-i="filterNote"></p>
                  <div class="line">
                    <input type="checkbox" id="agree" required>
                    <label for="agree">
                      <span data-i="agreement"></span>
                      <a href="#policy" data-view="policy" data-i="policyLink"></a>
                    </label>
                  </div>
                  <button type="button" id="activate" data-action="activate" disabled data-i="activate"></button>
                  <p class="muted" data-i="noAgree"></p>
                </div>
                <div class="grid">
                  <div class="box">
                    <b data-i="step1"></b>
                    <p data-i="step1p"></p>
                  </div>
                  <div class="box">
                    <b data-i="step2"></b>
                    <p data-i="step2p"></p>
                  </div>
                  <div class="box">
                    <b data-i="step3"></b>
                    <p data-i="step3p"></p>
                  </div>
                </div>
              </section>
              <section data-screen="overview" id="overview" class="hide">
                <div class="card hero">
                  <h2 data-i="overviewTitle"></h2>
                  <p data-i="overviewIntro"></p>
                  <div class="grid">
                    <div class="box">
                      <small data-i="available"></small>
                      <div class="num balance">12.000</div>
                      <small>ONEQR Points</small>
                    </div>
                    <div class="box">
                      <small data-i="pending"></small>
                      <div class="num" data-pending>300</div>
                      <small data-i="pendingHelp"></small>
                    </div>
                    <div class="box">
                      <small data-i="chosenIndustry"></small>
                      <div id="chosen" class="num" style="font-size:17px"></div>
                      <small data-i="industryReview"></small>
                    </div>
                  </div>
                  <p data-i="exchange"></p>
                </div>
              </section>
              <section data-screen="earn" id="earn" class="hide">
                <div class="card">
                  <h2 data-i="earnTitle"></h2>
                  <p data-i="earnIntro"></p>
                  <div class="grid">
                    <div class="box">
                      <small data-i="available"></small>
                      <div class="num balance">12.000</div>
                      <small data-i="approved"></small>
                    </div>
                    <div class="box">
                      <small data-i="pending"></small>
                      <div class="num" data-pending>300</div>
                      <small data-i="demoOnly"></small>
                    </div>
                    <div class="box">
                      <small data-i="minimumWithdraw"></small>
                      <div class="num" data-minimum-payout>10.000</div>
                      <small>ONEQR Points = $100</small>
                    </div>
                  </div>
                  <div class="row" style="margin-top:16px">
                    <button data-action="payout" data-i="withdraw"></button>
                    <button class="alt" data-action="convert" data-i="convert"></button>
                    <button class="alt" data-view="transfer" data-i="navTransfer"></button>
                  </div>
                  <div class="notice hide" id="payout">
                    <span data-i="payoutText"></span>
                    <div style="margin-top:12px">
                      <button data-action="request-payout" data-i="testPayout"></button>
                    </div>
                    <p id="payoutResult" role="status" tabindex="-1"></p>
                  </div>
                  <div class="box hide" id="convert">
                    <p data-i="convertText"></p>
                    <label for="convertAmount" data-i="convertAmount"></label>
                    <input type="number" id="convertAmount" min="100" step="100" value="1000">
                    <button data-action="convert-points" data-i="convertConfirm" style="margin-top:12px"></button>
                    <p id="convertResult" role="status" tabindex="-1"></p>
                  </div>
                </div>
                <div class="card">
                  <h2 data-i="sourcesTitle"></h2>
                  <p data-i="sourcesIntro"></p>
                  <div class="grid">
                    <div class="box">
                      <b data-i="adsSource"></b>
                      <p data-i="adsSourceText"></p>
                    </div>
                    <div class="box">
                      <b data-i="refSource"></b>
                      <p data-i="refSourceText"></p>
                    </div>
                    <div class="box">
                      <b data-i="ledgerTitle"></b>
                      <p data-i="ledgerText"></p>
                      <div id="ledger"></div>
                    </div>
                  </div>
                </div>
                <div class="card">
                  <h2 data-i="spendWallet"></h2>
                  <p data-i="spendText"></p>
                  <div class="grid">
                    <div class="box">
                      <small data-i="receivedCredits"></small>
                      <div class="num" id="received">0</div>
                      <small data-i="notCash"></small>
                    </div>
                    <div class="box">
                      <small data-i="ownCredits"></small>
                      <div class="num" id="ownCredits">0</div>
                      <small data-i="ownCreditsHelp"></small>
                    </div>
                  </div>
                </div>
              </section>
              <section data-screen="transfer" id="transfer" class="hide">
                <button class="alt subview-back" data-view="earn" data-i="back"></button>
                <div class="card">
                  <h2 data-i="transferTitle"></h2>
                  <p data-i="transferIntro"></p>
                  <div class="notice" id="recipient-help" data-i="demoRecipient"></div>
                  <label for="recipient" data-i="recipient"></label>
                  <input id="recipient" autocomplete="off" aria-describedby="recipient-help" placeholder="DEMO">
                  <label for="amount" data-i="amount"></label>
                  <input id="amount" type="number" min="1000" step="1" value="1000">
                  <p id="preview" aria-live="polite"></p>
                  <button data-action="review-transfer" data-i="continue"></button>
                  <p id="error" class="error" role="alert"></p>
                  <div id="review" class="box hide" tabindex="-1" aria-labelledby="review-heading">
                    <h3 id="review-heading" data-i="review"></h3>
                    <p>
                      <span data-i="recipient"></span>
                      :
                      <b>Demo Recipient</b>
                    </p>
                    <p id="reviewAmount"></p>
                    <p data-i="transferWarning"></p>
                    <div class="row">
                      <button data-action="confirm-transfer" data-i="confirmDemo"></button>
                      <button class="alt" data-action="cancel-transfer" data-i="back"></button>
                    </div>
                  </div>
                  <p id="result" class="ok" role="status" tabindex="-1"></p>
                  <div id="recipient-wallet" class="box hide">
                    <h3>Demo Recipient</h3>
                    <p data-i="spendWallet"></p>
                    <small data-i="receivedCredits"></small>
                    <div class="num" id="recipient-credits">0</div>
                    <small data-i="notCash"></small>
                  </div>
                </div>
              </section>
              <section data-screen="ads" id="ads" class="hide">
                <div class="card">
                  <h2 data-i="adsTitle"></h2>
                  <p>
                    <span data-i="chosenIndustry"></span>
                    :
                    <b id="adIndustry"></b>
                  </p>
                  <p class="notice" data-i="failClosed"></p>
                  <h3 data-i="placements"></h3>
                  <p data-i="placementsText"></p>
                  <h3 data-i="blocking"></h3>
                  <p data-i="blockingText"></p>
                  <p data-i="secondaryPolicy"></p>
                </div>
              </section>
              <section data-screen="policy" id="policy" class="hide">
                <button class="alt subview-back" data-view="setup" data-i="back"></button>
                <div class="card">
                  <span class="tag" data-i="draftTag"></span>
                  <h2 style="margin-top:16px" data-i="policyTitle"></h2>
                  <p data-i="p1"></p>
                  <p data-i="p2"></p>
                  <p data-i="p3"></p>
                  <p data-i="p4"></p>
                  <p data-i="p5"></p>
                  <p data-i="p6"></p>
                  <p data-i="p7"></p>
                  <div class="notice" data-i="legal"></div>
                </div>
              </section>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
    <script>window.NEXORA_SHELL={activePage:'stations',activeTab:'advertising'};</script>
    <script src="../assets/nexora-shell.js"></script>
    <script src="../assets/oneqr-action-appearance.js"></script>
    <script src="../assets/oneqr-advertising-po.js?v=po-20261027"></script>
    <script src="../assets/oneqr-advertising.js?v=po-20261027-title-only"></script>
  </body>
</html>
