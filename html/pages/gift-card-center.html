<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexora Touch — Gift Card Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/nexora-icons.css" />
    <link rel="stylesheet" href="../assets/nexora-shell.css?v=20261030-shared-header-v47" />
    <link rel="stylesheet" href="../assets/front-desk-tabs.css" />
    <link rel="stylesheet" href="../assets/gift-card-center.css?v=20261103-scanner-clarity" />
  <link rel="icon" type="image/png" sizes="128x128" href="../assets/flaticon-flat/favicon-letter-n-9203636.png">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Gift Card Center"></aside>
      <div class="app-area">
        <header class="header"></header>
        <main class="content front-desk gc-workspace" aria-label="Gift Card Center">
          <h1 class="gc-front-title">Front Desk</h1>
          <p class="subtitle gc-front-subtitle">Check in guests, manage open tickets, and run the turn board.</p>
          <nav class="workflow" data-front-desk-tabs aria-label="Front Desk sections"></nav>
          <div class="gift-center gc-top-tabs gc-center-tabs" role="tablist" aria-label="Gift Card Center">
            <button type="button" role="tab" id="gc-issue-tab" data-gc-center-tab="issue" aria-controls="gc-issue-panel" aria-selected="true">Issue Gift Card</button>
            <button type="button" role="tab" id="gc-balance-tab" data-gc-center-tab="balance" aria-controls="gc-balance-panel" aria-selected="false" tabindex="-1">Check balance</button>
          </div>
          <section class="gift-center gc-card gc-balance" id="gc-balance-panel" role="tabpanel" aria-labelledby="gc-balance-tab" tabindex="0" hidden>
            <div class="gc-balance-heading">
              <h2 id="gc-balance-title">Check balance</h2>
              <p>Look up an existing card.</p>
            </div>
            <form id="gc-balance-form">
              <div class="gc-balance-controls">
                <div class="gc-field">
                  <label for="gc-balance-code">Card code</label>
                  <div class="gc-balance-input">
                    <input id="gc-balance-code" name="cardCode" placeholder="Enter card number or scan..." autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="gc-balance-help" required />
                    <button class="gc-balance-scan" id="gc-balance-scan" type="button" aria-label="Scan QR" aria-haspopup="dialog"><i data-lucide="qr-code" aria-hidden="true"></i><span>Scan QR</span></button>
                  </div>
                </div>
                <button class="gc-button primary" type="submit">Check demo balance</button>
              </div>
              <p class="gc-note" id="gc-balance-help">Demo codes: DEMO-GIFT-100 ($100), DEMO-GIFT-25 ($25). No live card is charged.</p>
              <div id="gc-balance-result" role="status" aria-live="polite" aria-atomic="true" hidden></div>
            </form>
          </section>
          <section class="gc-portal" id="gc-issue-panel" role="tabpanel" aria-labelledby="gc-issue-tab" tabindex="0">
            <header class="gc-portal-head">
              <strong><i data-lucide="gift" aria-hidden="true"></i>Secure Gift Card</strong>
              <a href="gift-card-center.html?view=cards" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link" aria-hidden="true"></i>Open Merchant Portal</a>
            </header>
            <div class="gift-center" id="gift-center" aria-label="Gift Card Center"></div>
          </section>
        </main>
      </div>
    </div>
    <dialog class="gc-dialog gift-center" id="gift-dialog"></dialog>
    <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"></script>
    <script>
      window.NEXORA_SHELL = {
        workspace: "pos",
        activePage: "gift",
        activeTab: "gift",
      };
    </script>
    <script src="../assets/nexora-icons.js"></script>
    <script src="../assets/nexora-shell-nav.js?v=20261029-sidebar-group-labels"></script>
    <script src="../assets/nexora-shell.js?v=20261030-header-nine-dots-v48"></script>
    <script src="../assets/salon-data.js"></script>
    <script src="../assets/front-desk-data.js"></script>
    <script src="../assets/front-desk-tabs.js"></script>
    <script src="../assets/gift-card-brand-prompts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
    <script src="../assets/gift-card-center.js?v=20261103-scanner-clarity"></script>
  </body>
</html>
